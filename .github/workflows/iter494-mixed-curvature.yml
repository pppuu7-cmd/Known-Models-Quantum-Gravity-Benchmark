name: iter494-mixed-curvature

on:
  push:
    paths:
      - '.github/workflows/iter494-mixed-curvature.yml'
      - 'code/iter494_mixed_curvature.py'
      - 'code/iter494_aggregate.py'
      - 'recovery/ITER494_PREREG_MIXED_CURVATURE_2026-09-14.md'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authority and scope guards
        run: |
          python - <<'PY'
          import pathlib
          pre=pathlib.Path('recovery/ITER494_PREREG_MIXED_CURVATURE_2026-09-14.md').read_text()
          result=pathlib.Path('recovery/ITER493_RESULT_CRITICAL_Q1_VARIATION_2026-09-14.md').read_text()
          assert 'prospectively frozen before implementation' in pre
          assert '[0,1,3,5,6,11]' in pre
          assert 'all 15 unordered pairs' in pre
          assert 'q = 1.00 only' in pre
          assert 'ITER493_CRITICAL_Q1_LOCAL_VARIATION_QUALIFIED_SCOPED' in result
          assert 'Candidate Gravity remains inactive' in result
          PY

  lane:
    needs: source-lock
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        causal: [0to5, 1to4, 2to3]
        block: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy
      - name: Run frozen mixed-curvature job
        run: |
          mkdir -p artifacts
          python code/iter494_mixed_curvature.py --causal '${{ matrix.causal }}' --block '${{ matrix.block }}' --out 'artifacts/iter494-${{ matrix.causal }}-b${{ matrix.block }}.json'
      - name: Upload raw job artifact
        uses: actions/upload-artifact@v4
        with:
          name: iter494-${{ matrix.causal }}-b${{ matrix.block }}
          path: artifacts/*.json
          if-no-files-found: error

  aggregate:
    needs: [source-lock, lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all raw jobs
        uses: actions/download-artifact@v4
        with:
          pattern: iter494-*
          path: raw
          merge-multiple: false
      - name: Aggregate frozen verdict
        run: |
          mkdir -p aggregate
          python code/iter494_aggregate.py --root raw --out aggregate/iter494-summary.json
      - name: Upload aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter494-summary
          path: aggregate/iter494-summary.json
          if-no-files-found: error
