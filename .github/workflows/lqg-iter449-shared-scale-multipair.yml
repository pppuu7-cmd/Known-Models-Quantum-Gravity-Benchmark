name: lqg-iter449-shared-scale-multipair
on:
  push:
    branches: [research/iter449-shared-scale-multipair]
    paths:
      - 'code/lqg_iter449_shared_scale_multipair.py'
      - '.github/workflows/lqg-iter449-shared-scale-multipair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        gamma: [7,8]
        j: [2,5]
        k: [2,3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Audit frozen shared-scale coherent multi-pair collision powers
        run: python code/lqg_iter449_shared_scale_multipair.py --gamma '${{ matrix.gamma }}' --j '${{ matrix.j }}' --k '${{ matrix.k }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter449-g${{ matrix.gamma }}-j${{ matrix.j }}-k${{ matrix.k }}
          path: build/lqg-iter449/*.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: iter449-*
          path: evidence
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Aggregate frozen scientific classifier
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,hashlib,pathlib
          rows=[json.load(open(f)) for f in sorted(glob.glob('evidence/g*_j*_k*.json'))]
          valid=len(rows)==8 and all(r.get('numerically_valid') for r in rows)
          n_pass=sum(bool(r.get('scientific_lane_pass')) for r in rows)
          if not valid: cls='MULTIPAIR_COHERENT_COLLISION_NUMERICAL_INVALID'
          elif n_pass==8: cls='SOURCE_TOLLER_COHERENT_SHARED_SCALE_TWO_THREE_PAIR_POWER_INTEGRABLE_ON_FROZEN_GRID'
          else: cls='SOURCE_TOLLER_COHERENT_SHARED_SCALE_MULTI_PAIR_POWER_OBSTRUCTION_ON_FROZEN_GRID'
          out={
            'iteration':449,'lanes_found':len(rows),'lanes_scientifically_passed':n_pass,'numerically_valid':valid,'classification':cls,
            'worst_product_p_local':max((r['worst_witness']['product_p_local'] for r in rows if r['worst_witness']['product_p_local'] is not None),default=None),
            'worst_recheck_delta':max((r['worst_power_recheck_abs_delta'] for r in rows),default=None),
            'worst_factorization_power_delta':max((r['worst_factorization_power_delta'] for r in rows if r['worst_factorization_power_delta'] is not None),default=None),
            'd7_s2':'MULTIPAIR_SHARED_SCALE_COHERENT_GEOMETRY_SUPPORTED__FULL_SOURCE_INVARIANT_CONTRACTION_REMAINS_OPEN' if cls.endswith('INTEGRABLE_ON_FROZEN_GRID') else 'MULTIPAIR_SHARED_SCALE_COHERENT_GEOMETRY_OBSTRUCTION__FULL_SOURCE_INVARIANT_CONTRACTION_REMAINS_OPEN',
            'd7_s3':'NOT_CLOSED','d7_s4':'PARTIAL_GLOBAL_NOT_CLOSED','d7':'NOT_CLOSED / NOT_YET_AUTHORIZED','candidate_gravity_authorized':False,
            'next_gate':'Reconstruct/audit complete source-defined coupled magnetic/intertwiner invariant contraction before D7-S2 closure; do not retune Iter449.'
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'; pathlib.Path('iter449-summary.json').write_text(payload); pathlib.Path('iter449-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n'); print(payload)
          if not valid: raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter449-summary
          path: |
            iter449-summary.json
            iter449-summary.sha256
          if-no-files-found: error
          retention-days: 90
