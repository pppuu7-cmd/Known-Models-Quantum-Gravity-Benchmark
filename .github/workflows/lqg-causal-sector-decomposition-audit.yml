name: lqg-causal-sector-decomposition-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter298_causal_sector_decomposition.json'
      - '.github/workflows/lqg-causal-sector-decomposition-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [source_contract, exact_expansion, nonidentity_witness, scope_boundary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter298
          python - <<'PY'
          import itertools, json, pathlib
          p=json.load(open('benchmarks/lqg_iter298_causal_sector_decomposition.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'; details={}
          if g=='source_contract':
              ok=(c['toller_identity_D_equals_Tplus_plus_Tminus'] and
                  c['standard_eprl_vertex_uses_D_matrix_content'] and
                  c['fixed_causal_vertex_selects_one_toller_sign_per_wedge_from_causal_data'])
              details={'source_grounded_identity':'D=T+ + T-','fixed_sector_rule':True}
          elif g=='exact_expansion':
              checked=0
              for nw in range(1,13):
                  terms=list(itertools.product((0,1), repeat=nw))
                  if len(terms)!=(1<<nw): raise SystemExit('expansion cardinality mismatch')
                  checked += len(terms)
              ok=(checked==8190 and c['product_of_standard_D_factors_expands_over_all_local_toller_sign_assignments'])
              details={'wedge_counts':'1..12','formal_sector_terms_checked':checked}
          elif g=='nonidentity_witness':
              # Formal polynomial witness: prod_i (x_i+y_i) contains 2^n monomials;
              # a fixed causal sector contains one monomial. Equality is impossible as
              # a generic polynomial for n>=1 absent extra relations/vanishing terms.
              checked=0
              for nw in range(1,11):
                  full={bits:1 for bits in itertools.product((0,1), repeat=nw)}
                  fixed=tuple((i+nw)%2 for i in range(nw))
                  if len(full)<=1 or fixed not in full: raise SystemExit('bad witness')
                  omitted=len(full)-1
                  if omitted!=(1<<nw)-1: raise SystemExit('omitted-count mismatch')
                  checked += omitted
              ok=(checked==2036 and c['generic_polynomial_identity_between_one_fixed_sector_and_full_D_product_is_false_without_additional_vanishing_or_sector_sum'])
              details={'wedge_counts':'1..10','omitted_formal_monomials_total':checked,'generic_nonidentity':True}
          elif g=='scope_boundary':
              ok=(not c['sources_prove_all_omitted_sector_terms_vanish_in_han_stack'] and
                  not c['sources_prove_causal_sector_sum_reconstructs_han_half_link_kernel_with_same_normalization'] and
                  not c['sources_prove_han_face_factorization_after_fixed_causal_replacement'] and
                  not c['family_terminal'] and not c['d7_authorized'])
              details={'no_dynamical_no_go_claim':True,'sector_sum_recovery_remains_open':True,'han_factorization_remains_open':True}
          else:
              raise SystemExit(2)
          out={'guard':g,'pass':bool(ok),'iteration':298,'details':details,'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter298/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter298-${{ matrix.guard }}
          path: build/lqg-iter298/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter298-*
          path: build/lqg-iter298-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=sorted(pathlib.Path('build/lqg-iter298-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          by={x['guard']:x for x in rows}
          p=json.load(open('benchmarks/lqg_iter298_causal_sector_decomposition.json'))
          out={
            'iteration':298,
            'independent_guards':4,
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'formal_D_product_sector_decomposition_exact':True,
            'fixed_causal_sector_generic_identity_with_full_D_product':False,
            'formal_sector_terms_checked':by['exact_expansion']['details']['formal_sector_terms_checked'],
            'omitted_formal_monomials_total':by['nonidentity_witness']['details']['omitted_formal_monomials_total'],
            'sector_sum_or_new_factorization_required_for_han_equivalence':True,
            'han_half_link_kernel_equivalence_proven':False,
            'causal_stack_finiteness_normalization_proven':False,
            'han_face_factorization_after_causal_replacement_proven':False,
            'same_realization_uv_to_regge_gr_transport_proven':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter298-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter298-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter298-summary
          path: |
            build/lqg-iter298-summary.json
            build/lqg-iter298-summary.sha256
          if-no-files-found: error
          retention-days: 90
