name: iter465-source-twofactor-pullback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter465-source-twofactor-pullback.yml'
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {m1: -1, m2: 0, beta1: '0.8', beta2: '2.1', label: 'a'}
          - {m1: 0, m2: 1, beta1: '2.1', beta2: '0.8', label: 'b'}
          - {m1: -1, m2: 1, beta1: '2.1', beta2: '2.1', label: 'c'}
          - {m1: 0, m2: 0, beta1: '0.8', beta2: '2.1', label: 'd'}
          - {m1: 1, m2: -1, beta1: '0.8', beta2: '0.8', label: 'e'}
          - {m1: 1, m2: 0, beta1: '2.1', beta2: '0.8', label: 'f'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check mpmath
      - name: Run frozen lane
        run: |
          mkdir -p out
          python code/lqg_iter465_source_twofactor_pullback.py \
            --m1 '${{ matrix.m1 }}' --m2 '${{ matrix.m2 }}' \
            --beta1 '${{ matrix.beta1 }}' --beta2 '${{ matrix.beta2 }}' \
            --label '${{ matrix.label }}' --out 'out/result.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter465-${{ matrix.label }}
          path: out/result.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-latest
    needs: lane
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter465-*
          path: collected
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import json, glob, os, sys
          rows=[]
          for p in sorted(glob.glob('collected/**/result.json', recursive=True)):
              with open(p) as f: rows.append(json.load(f))
          valid=len(rows)==6 and all(r.get('iteration')==465 for r in rows)
          passed=valid and all(r.get('pass') is True for r in rows)
          out={
            'iteration':465,
            'valid':valid,
            'n_lanes':len(rows),
            'pass_lanes':sum(bool(r.get('pass')) for r in rows),
            'lanes':rows,
            'classification':('ITER465_SOURCE_TWOFACTOR_TRANSVERSAL_PULLBACK_ORDER_INDEPENDENCE_QUALIFIED_SCOPED' if passed else 'SCIENTIFIC_FAIL_ITER465_SOURCE_TWOFACTOR_PULLBACK_OR_ORDER_INDEPENDENCE'),
            'scope':'Transversal two-factor source-defined tensor-product pullback/order prerequisite only; no full causal-vertex theorem and no D7-S2 closure.'
          }
          os.makedirs('aggregate',exist_ok=True)
          with open('aggregate/iter465_aggregate.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not passed: sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter465-aggregate
          path: aggregate/iter465_aggregate.json
          if-no-files-found: warn
