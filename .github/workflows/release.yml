name: reproducibility-release

on:
  workflow_run:
    workflows: ["methodology-ci"]
    types: [completed]

permissions:
  contents: write

jobs:
  release-frozen-infrastructure:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 line pinned
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 line pinned
        with:
          python-version: '3.12.11'

      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Re-run independent readiness and schema gates
        run: |
          python code/schema_validation.py
          python code/readiness_score.py
          python code/repository_completion_validator.py --require-100

      - name: Build deterministic release bundle
        run: python code/build_release_bundle.py --verify-deterministic

      - name: Create immutable GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="$(tr -d '\r\n' < release/RELEASE_VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no mutation performed."
            exit 0
          fi
          gh release create "$TAG" \
            build/kmqgb-reproducibility-bundle.zip \
            reproducibility/ENVIRONMENT_LOCK.json \
            requirements-ci.txt \
            --target "$HEAD_SHA" \
            --title "KMQGB Infrastructure v1.0.0" \
            --notes "Frozen repository/methodology reproducibility release. This release certifies infrastructure and methodology packaging only; it does not promote Candidate Gravity, close CW2, or authorize Paper IV."
