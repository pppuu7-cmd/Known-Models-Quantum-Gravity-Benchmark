name: lqg-iter444-two-group-radial-integrability
on:
  push:
    branches: [research/iter444-two-group-radial-integrability]
    paths:
      - 'benchmarks/lqg_iter444_two_group_radial_integrability_contract.json'
      - 'code/lqg_iter444_two_group_radial_gate.py'
      - '.github/workflows/lqg-iter444-two-group-radial-integrability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        gamma: [7.0, 8.0]
        j: [2, 5]
        c: [0.5, 1.0, 2.0, 4.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Evaluate frozen two-group radial lane
        run: python code/lqg_iter444_two_group_radial_gate.py --gamma '${{ matrix.gamma }}' --j '${{ matrix.j }}' --c '${{ matrix.c }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter444-g${{ matrix.gamma }}-j${{ matrix.j }}-c${{ matrix.c }}
          path: build/lqg-iter444/*.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: radial
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: iter444-*
          path: evidence
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Aggregate frozen scientific gate
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,hashlib,pathlib
          files=sorted(glob.glob('evidence/g*_j*_c*.json'))
          rows=[json.load(open(f)) for f in files]
          ok=len(rows)==16 and all(r.get('controls_valid') for r in rows)
          out={'iteration':444,'lanes_found':len(rows),'lanes_passed':sum(bool(r.get('controls_valid')) for r in rows),'controls_valid':ok,'worst_common_shift_log_slope':max((r['common_shift_log_slope'] for r in rows),default=None),'max_external_scaled_envelope_variation':max((r['external_scaled_envelope_variation'] for r in rows),default=None),'classification':'SOURCE_TWO_GROUP_SEPARATED_RADIAL_ENVELOPE_INTEGRABLE_ON_FROZEN_GRID' if ok else 'TWO_GROUP_SEPARATED_RADIAL_GATE_FAILED_OR_INVALID','d7_s2':'STRENGTHENED_BUT_NOT_CLOSED' if ok else 'NOT_CLOSED','d7_s3':'NOT_CLOSED','d7_s4':'PARTIAL_GLOBAL_NOT_CLOSED','d7':'NOT_CLOSED / NOT_YET_AUTHORIZED','candidate_gravity_authorized':False,'next_gate':'If valid, use Iter445 to localize whether the one-factor envelope can certify k>=3. Do not infer full vertex finiteness from the two-group common-axis fixed-separation gate.'}
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'; pathlib.Path('iter444-summary.json').write_text(payload); pathlib.Path('iter444-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n'); print(payload)
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter444-summary
          path: |
            iter444-summary.json
            iter444-summary.sha256
          if-no-files-found: error
          retention-days: 90
