name: lqg-causal-sector-sum-recovery-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter299_causal_sector_sum_recovery.json'
      - '.github/workflows/lqg-causal-sector-sum-recovery-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [source_contract, unrestricted_sector_sum_identity, proper_subset_witness, scope_boundary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter299
          python - <<'PY'
          import itertools, json, pathlib
          p=json.load(open('benchmarks/lqg_iter299_causal_sector_sum_recovery.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'; details={}
          if g=='source_contract':
              ok=(c['toller_identity_D_equals_Tplus_plus_Tminus'] and
                  c['unrestricted_unit_weight_sum_over_all_local_toller_sign_assignments_exactly_reconstructs_product_of_D_factors'] and
                  c['this_unrestricted_identity_is_formal_algebra_not_a_causal_admissibility_theorem'])
              details={'source_grounded_identity':'D=T+ + T-','formal_only':True}
          elif g=='unrestricted_sector_sum_identity':
              # Exact symbolic coefficient identity:
              # prod_i (x_i+y_i) = sum_{sigma in {0,1}^n} prod_i z_{i,sigma_i}.
              checked=0
              for nw in range(1,13):
                  lhs={bits:1 for bits in itertools.product((0,1), repeat=nw)}
                  rhs={}
                  for bits in itertools.product((0,1), repeat=nw):
                      rhs[bits]=rhs.get(bits,0)+1
                  if lhs!=rhs: raise SystemExit('sector-sum identity mismatch')
                  checked += len(lhs)
              ok=(checked==8190)
              details={'wedge_counts':'1..12','formal_sector_terms_checked':checked,'all_coefficients_unit':True}
          elif g=='proper_subset_witness':
              # Any proper subset of an algebraically independent monomial basis misses
              # at least one monomial, hence cannot generically equal the full D-product.
              witnesses=0
              missing_total=0
              for nw in range(1,11):
                  full=list(itertools.product((0,1), repeat=nw))
                  subset=full[:-1]
                  if len(subset)!=len(full)-1: raise SystemExit('bad subset')
                  missing=set(full)-set(subset)
                  if len(missing)!=1: raise SystemExit('missing witness mismatch')
                  witnesses += 1
                  missing_total += len(missing)
              ok=(witnesses==10 and missing_total==10)
              details={'proper_subset_witnesses':witnesses,'missing_monomials_total':missing_total,'claim_scope':'generic formal polynomial basis only'}
          elif g=='scope_boundary':
              ok=(not c['sources_define_a_causally_admissible_sector_measure_equal_to_the_unrestricted_unit_weight_measure_for_han_stack'] and
                  not c['sources_prove_sector_weights_and_normalization_reconstruct_han_half_link_kernel'] and
                  not c['sources_prove_han_face_factorization_after_causal_sector_sum'] and
                  not c['sources_prove_lambda_f_weighted_causal_complete_stack_finiteness_and_cutoff_control'] and
                  not c['sources_prove_same_realization_uv_to_causal_regge_gr_transport'] and
                  not c['family_terminal'] and not c['d7_authorized'])
              details={'causal_measure_open':True,'han_glue_open':True,'stack_cutoff_open':True,'uv_ir_transport_open':True,'no_no_go_claim':True}
          else:
              raise SystemExit(2)
          out={'guard':g,'pass':bool(ok),'iteration':299,'details':details,'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter299/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter299-${{ matrix.guard }}
          path: build/lqg-iter299/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter299-*
          path: build/lqg-iter299-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=sorted(pathlib.Path('build/lqg-iter299-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          by={x['guard']:x for x in rows}
          p=json.load(open('benchmarks/lqg_iter299_causal_sector_sum_recovery.json'))
          out={
            'iteration':299,
            'independent_guards':4,
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'unrestricted_unit_weight_sector_sum_exactly_reconstructs_standard_D_product':True,
            'formal_sector_terms_checked':by['unrestricted_sector_sum_identity']['details']['formal_sector_terms_checked'],
            'generic_proper_subset_cannot_reconstruct_full_D_product_without_relations':True,
            'proper_subset_witnesses':by['proper_subset_witness']['details']['proper_subset_witnesses'],
            'causally_admissible_sector_measure_identity_proven':False,
            'han_half_link_kernel_equivalence_proven':False,
            'han_face_factorization_after_causal_sector_sum_proven':False,
            'causal_stack_finiteness_normalization_cutoff_control_proven':False,
            'same_realization_uv_to_regge_gr_transport_proven':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter299-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter299-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter299-summary
          path: |
            build/lqg-iter299-summary.json
            build/lqg-iter299-summary.sha256
          if-no-files-found: error
          retention-days: 90
