name: iter475-lqg-s3-conflict-resolver
on:
  push:
    branches: [research/iter475-lqg-s3-conflict-resolver]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python code/iter475_lqg_s3_conflict_resolver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter475-summary
          path: artifacts/iter475-summary.json
