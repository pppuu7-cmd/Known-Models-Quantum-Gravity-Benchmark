name: lqg-gamma-duality-observable-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_gamma_duality_observable_audit.py'
      - '.github/workflows/lqg-gamma-duality-observable-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        label: [authority, gamma_duality, eft_observable, transport_scope]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent gamma-duality guard
        run: python code/lqg_gamma_duality_observable_audit.py guard --label '${{ matrix.label }}' --output build/lqg-gamma-duality/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-gamma-duality-${{ matrix.label }}
          path: build/lqg-gamma-duality/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-gamma-duality-*
          path: build/lqg-gamma-duality-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_gamma_duality_observable_audit.py aggregate --input-dir build/lqg-gamma-duality-results --output build/lqg-gamma-duality-iter291-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-gamma-duality-iter291-summary
          path: build/lqg-gamma-duality-iter291-summary.json
          if-no-files-found: error
          retention-days: 90
