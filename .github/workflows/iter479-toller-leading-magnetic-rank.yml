name: iter479-toller-leading-magnetic-rank
on:
  push:
    branches: [research/iter479-toller-leading-magnetic-rank]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install mpmath
      - run: python code/iter479_toller_leading_magnetic_rank.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter479-summary
          path: artifacts/iter479-summary.json
