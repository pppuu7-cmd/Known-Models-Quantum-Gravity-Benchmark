name: lqg-cross-face-transport-consistency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter333_*.py'
      - '.github/workflows/lqg-cross-face-transport-consistency.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [k4, k3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter333
          python code/lqg_iter333_cross_face_transport.py --kind '${{ matrix.kind }}' --output 'build/iter333/${{ matrix.kind }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter333-${{ matrix.kind }}
          path: build/iter333/${{ matrix.kind }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter333-*
          path: iter333-results
      - run: python code/lqg_iter333_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter333-summary
          path: iter333-summary.json
          if-no-files-found: error
          retention-days: 90
