name: KMQGB Iter504P out-of-sample point drift localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter504p-point-drift-localization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preregistration and upstream terminal ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 77bac4728401200b226dda16447befce85df0c66 HEAD
          git merge-base --is-ancestor 56362459a826e3e376c529446678f2fbcaa269ae HEAD
          git merge-base --is-ancestor 95870d0649d4b8d7b156c3f2b68bd55caa65d9c0 HEAD
          git merge-base --is-ancestor 00018ceb5bcecbbff7ef800e452d544534e1ba77 HEAD
          test "$(git hash-object research/authority/ITER504P_POINT_DRIFT_LOCALIZATION_FROZEN_2026-09-16.json)" = "375a497e5fe56ff35d5fb6d21c59b893daad1d3d"
      - name: Verify exact Iter504 artifact IDs and digests against GitHub metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34907349374/artifacts?per_page=100&page=1" > /tmp/artifacts1.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34907349374/artifacts?per_page=100&page=2" > /tmp/artifacts2.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('research/authority/ITER504P_POINT_DRIFT_LOCALIZATION_FROZEN_2026-09-16.json').read_text())
          items=[]
          for p in ('/tmp/artifacts1.json','/tmp/artifacts2.json'):
              items.extend(json.loads(Path(p).read_text())['artifacts'])
          by_name={x['name']:x for x in items}
          expected=dict(manifest['decisive_artifacts'])
          ctrl=manifest['known_non_decisive_control']
          expected[ctrl['name']]={'id':ctrl['id'],'digest':ctrl['digest']}
          for name,spec in expected.items():
              got=by_name.get(name)
              assert got is not None, name
              assert got['id']==spec['id'], (name,got['id'],spec['id'])
              assert got['digest']==spec['digest'], (name,got['digest'],spec['digest'])
              assert got['expired'] is False, name
              assert got['workflow_run']['id']==manifest['upstream_iter504']['run_id'], name
              assert got['workflow_run']['head_sha']==manifest['upstream_iter504']['workflow_head'], name
          print('verified_artifacts',len(expected))
          PY

  exact-lanes:
    needs: source-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - method: decimal
            python: '3.11'
            artifact: iter504p-point-drift-decimal
          - method: float
            python: '3.13'
            artifact: iter504p-point-drift-float
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_RUN: '34907349374'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download frozen decisive cohort and disclosed control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs
          for lane in \
            0to5-b0 0to5-b1 0to5-b2 0to5-b3 \
            1to4-b0 1to4-b1 1to4-b2 1to4-b3 \
            2to3-b0 2to3-b1 2to3-b2 2to3-b3; do
              name="iter504-point-${lane}"
              gh run download "${UPSTREAM_RUN}" --name "${name}" --dir "inputs/${name}"
          done
      - name: Execute frozen point-drift classifier
        run: |
          python code/iter504p_point_drift_localization.py \
            --input-root inputs \
            --method "${{ matrix.method }}" \
            --out "out/${{ matrix.method }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.method }}.json

  aggregate:
    needs: exact-lanes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: iter504p-point-drift-decimal
          path: artifacts/decimal
      - uses: actions/download-artifact@v4
        with:
          name: iter504p-point-drift-float
          path: artifacts/float
      - name: Aggregate independent arithmetic paths
        run: |
          python code/iter504p_point_drift_localization_aggregate.py \
            --decimal artifacts/decimal \
            --float artifacts/float \
            --out out/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter504p-point-drift-aggregate
          path: out/aggregate.json
