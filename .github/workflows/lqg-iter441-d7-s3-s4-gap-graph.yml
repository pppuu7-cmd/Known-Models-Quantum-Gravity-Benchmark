name: lqg-iter441-d7-s3-s4-gap-graph

on:
  push:
    branches:
      - research/iter441-d7-s3-s4-gap-graph
    paths:
      - 'benchmarks/lqg_iter441_d7_s3_s4_gap_graph.json'
      - '.github/workflows/lqg-iter441-d7-s3-s4-gap-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-same-realization-gap-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Compute fail-closed S3 capability graph
        shell: bash
        run: |
          mkdir -p build/iter441
          python - <<'PY'
          import json, pathlib
          spec=json.load(open('benchmarks/lqg_iter441_d7_s3_s4_gap_graph.json'))
          rows=[]
          docs={p:json.load(open(p)) for p in spec['inputs'] if p.startswith('benchmarks/')}
          for capability, aliases in spec['s3_required_capabilities'].items():
              evidence=[]
              for path,doc in docs.items():
                  claims=doc.get('prospectively_frozen_claims',{})
                  for alias in aliases:
                      if alias in claims:
                          evidence.append({'source':path,'claim':alias,'value':claims[alias]})
              present=any(e['value'] is True for e in evidence)
              rows.append({'capability':capability,'state':'PRESENT' if present else 'UNRESOLVED','evidence':evidence})
          out={
            'iteration':441,
            'lane':'D7-S3',
            'classification':'NONTERMINAL_GAP_GRAPH_ONLY',
            'capabilities':rows,
            'present_count':sum(r['state']=='PRESENT' for r in rows),
            'unresolved_count':sum(r['state']=='UNRESOLVED' for r in rows),
            'absence_is_not_fail':True,
            'd7_s5_authorized':False
          }
          pathlib.Path('build/iter441/s3.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter441-s3
          path: build/iter441/s3.json
          if-no-files-found: error
          retention-days: 90

  s4-exact-common-domain-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Exhaust K5 orientation domain and S4 gap graph
        shell: bash
        run: |
          mkdir -p build/iter441
          python - <<'PY'
          import itertools, json, pathlib
          spec=json.load(open('benchmarks/lqg_iter441_d7_s3_s4_gap_graph.json'))
          n=spec['exact_k5_diagnostic']['vertices']
          edges=list(itertools.combinations(range(n),2))
          A=[[int(v in e) for v in range(n)] for e in edges]
          def gf2_rank(a):
              a=[r[:] for r in a]; m=len(a); cols=len(a[0]); rank=0
              for c in range(cols):
                  p=next((i for i in range(rank,m) if a[i][c]&1),None)
                  if p is None: continue
                  a[rank],a[p]=a[p],a[rank]
                  for i in range(m):
                      if i!=rank and (a[i][c]&1):
                          a[i]=[x^y for x,y in zip(a[i],a[rank])]
                  rank+=1
              return rank
          def signature(x):
              return tuple(sum(A[i][j]*x[j] for j in range(n))%2 for i in range(len(edges)))
          assignments=list(itertools.product((0,1), repeat=n))
          sigs={signature(x) for x in assignments}
          def connected_without(rem):
              adj={i:set() for i in range(n)}
              for idx,(u,v) in enumerate(edges):
                  if idx not in rem:
                      adj[u].add(v); adj[v].add(u)
              seen={0}; stack=[0]
              while stack:
                  u=stack.pop()
                  for v in adj[u]-seen:
                      seen.add(v); stack.append(v)
              return len(seen)==n
          docs={p:json.load(open(p)) for p in spec['inputs'] if p.startswith('benchmarks/')}
          rows=[]
          for capability,aliases in spec['s4_required_capabilities'].items():
              evidence=[]
              for path,doc in docs.items():
                  claims=doc.get('prospectively_frozen_claims',{})
                  for alias in aliases:
                      if alias in claims:
                          evidence.append({'source':path,'claim':alias,'value':claims[alias]})
              present=any(e['value'] is True for e in evidence)
              rows.append({'capability':capability,'state':'PRESENT' if present else 'UNRESOLVED','evidence':evidence})
          out={
            'iteration':441,
            'lane':'D7-S4',
            'classification':'NONTERMINAL_EXACT_CONDITIONAL_DOMAIN_WITNESS',
            'k5':{
              'vertices':n,'edges':len(edges),'gf2_rank':gf2_rank(A),
              'kernel_dimension':n-gf2_rank(A),
              'vertex_assignments':len(assignments),
              'unique_wedge_signatures_mod_global_flip':len(sigs),
              'global_flip_kernel_size':2**(n-gf2_rank(A)),
              'all_single_edge_removals_connected':all(connected_without({i}) for i in range(len(edges))),
              'all_two_edge_removals_connected':all(connected_without(set(r)) for r in itertools.combinations(range(len(edges)),2))
            },
            'capabilities':rows,
            'present_count':sum(r['state']=='PRESENT' for r in rows),
            'unresolved_count':sum(r['state']=='UNRESOLVED' for r in rows),
            'conditional_witness_is_not_universal_domain_closure':True,
            'd7_s5_authorized':False
          }
          pathlib.Path('build/iter441/s4.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter441-s4
          path: build/iter441/s4.json
          if-no-files-found: error
          retention-days: 90

  d7-contract-fail-closed-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Verify terminal classifier remains legally locked
        shell: bash
        run: |
          mkdir -p build/iter441
          python - <<'PY'
          import json, pathlib
          contract=json.load(open('protocol/PAPER_IV_D7_GLOBAL_DECISION_CONTRACT.json'))
          spec=json.load(open('benchmarks/lqg_iter441_d7_s3_s4_gap_graph.json'))
          stages=contract['stages']
          required=['D7-S0','D7-S1','D7-S2','D7-S3','D7-S4','D7-S5','D7-S6']
          assert contract['stage_order']==required
          assert stages['D7-S5']['otherwise_output']=='NOT_AUTHORIZED'
          assert 'Any unresolved mandatory prerequisite forces D7-S5 to NOT_AUTHORIZED.' in contract['fail_closed_rules']
          assert spec['frozen_expected_classification']=='NONTERMINAL_GAP_GRAPH_ONLY'
          assert spec['authority']=='DIAGNOSTIC_ONLY_NO_TERMINAL_D7_AUTHORIZATION'
          terminal=set(stages['D7-S5']['authorized_outputs'])
          forbidden=terminal.intersection({spec['frozen_expected_classification']})
          assert not forbidden
          out={
            'iteration':441,
            'lane':'D7-CONTRACT',
            'contract_status':contract['status'],
            'stage_order':required,
            'authorized_terminal_outputs':sorted(terminal),
            'current_iter441_output':'NOT_AUTHORIZED',
            'fail_closed_guard_pass':True,
            'candidate_gravity_activation':False
          }
          pathlib.Path('build/iter441/contract.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter441-contract
          path: build/iter441/contract.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs:
      - s3-same-realization-gap-graph
      - s4-exact-common-domain-witness
      - d7-contract-fail-closed-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: iter441-*
          path: build/iter441-input
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('build/iter441-input')
          s3=json.load(open(root/'s3.json'))
          s4=json.load(open(root/'s4.json'))
          contract=json.load(open(root/'contract.json'))
          out={
            'iteration':441,
            'scientific_scope':'D7-S3/D7-S4 NONTERMINAL GAP GRAPH',
            's3_present':s3['present_count'],
            's3_unresolved':s3['unresolved_count'],
            's4_present':s4['present_count'],
            's4_unresolved':s4['unresolved_count'],
            'k5_exact_witness':s4['k5'],
            'terminal_d7':'NOT_AUTHORIZED',
            'candidate_gravity_activation':False,
            'next_gate':'Use unresolved capability nodes as the minimal target set; do not rerun already PRESENT conditional-domain witnesses and do not promote absence to FAIL.'
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('iter441-summary.json').write_text(payload)
          pathlib.Path('iter441-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          print(payload)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter441-summary
          path: |
            iter441-summary.json
            iter441-summary.sha256
          if-no-files-found: error
          retention-days: 90
