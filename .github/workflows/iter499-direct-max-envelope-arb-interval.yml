name: iter499-direct-max-envelope-arb-interval
on:
  push:
    branches: [main]
    paths:
      - 'recovery/ITER499_PREREG_DIRECT_MAX_ENVELOPE_ARB_INTERVAL_2026-09-14.md'
      - 'code/iter499_arb_core.py'
      - 'code/iter499_direct_max_envelope_interval.py'
      - 'code/iter499_aggregate.py'
      - '.github/workflows/iter499-direct-max-envelope-arb-interval.yml'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authority and classifier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('recovery/ITER499_PREREG_DIRECT_MAX_ENVELOPE_ARB_INTERVAL_2026-09-14.md').read_text()
          low=p.lower()
          assert 'frozen before implementation / production' in low
          assert 'python-flint==0.9.0' in p
          assert 'ctx.prec=384' in p
          assert '16 closed rational boxes' in p
          assert '(16+k)/12800' in p and '(17+k)/12800' in p
          assert 'all 243' in p
          assert 'iter499_direct_max_envelope_interval_robust_qualified_scoped' in low
          assert 'iter499_direct_max_envelope_interval_nondecay_qualified_scoped' in low
          assert 'scientific_fail_iter499_uniform_nondecay_interval' in low
          assert 'iter499_validated_interval_inconclusive_scoped' in low
          assert 'iter499_numerical_method_blocker' in low
          assert 'candidate gravity' in low
          PY

  lane:
    needs: source-lock
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        causal: [0to5, 1to4, 2to3]
        block: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validated dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
          python - <<'PY'
          import flint
          assert flint.__version__ == '0.9.0', flint.__version__
          print('python-flint',flint.__version__)
          PY
      - name: Run frozen direct max-envelope interval lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter499_direct_max_envelope_interval.py \
            --causal '${{ matrix.causal }}' --block '${{ matrix.block }}' \
            --out 'artifacts/iter499-${{ matrix.causal }}-b${{ matrix.block }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter499-${{ matrix.causal }}-b${{ matrix.block }}
          path: artifacts/iter499-${{ matrix.causal }}-b${{ matrix.block }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter499-*
          path: downloaded
      - name: Aggregate frozen verdict
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter499_aggregate.py --root downloaded --out artifacts/iter499-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter499-summary
          path: artifacts/iter499-summary.json
          if-no-files-found: error
