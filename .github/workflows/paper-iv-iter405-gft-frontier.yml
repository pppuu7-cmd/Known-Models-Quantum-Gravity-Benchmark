name: paper-iv-iter405-gft-frontier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_iv/GFT_FRONTIER_AUTHORITY_ITER405.json'
      - 'code/iter405_gft_frontier_audit.py'
      - 'code/iter405_gft_aggregate.py'
      - '.github/workflows/paper-iv-iter405-gft-frontier.yml'

permissions:
  contents: read

jobs:
  frontier-lanes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [reduction_scope, identity_doublecount, tgft_gravity_observable, continuum_transfer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: |
          mkdir -p build/iter405
          python code/iter405_gft_frontier_audit.py --lane '${{ matrix.lane }}' --output 'build/iter405/${{ matrix.lane }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter405-${{ matrix.lane }}
          path: build/iter405/*.json
          if-no-files-found: error

  aggregate:
    needs: [frontier-lanes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'iter405-*'
          path: iter405-results
      - run: python code/iter405_gft_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter405-summary
          path: iter405-summary.json
          if-no-files-found: error
