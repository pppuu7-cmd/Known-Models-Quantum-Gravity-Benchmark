name: apply-iter303-recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/apply_iter303_recovery.py'
      - '.github/workflows/apply-iter303-recovery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Apply frozen interpreted Iter303 recovery update
        run: python code/apply_iter303_recovery.py
      - name: Commit only if changed
        shell: bash
        run: |
          FILES='paper_iv/P_LQG_TOLLER_SU2_HAAR_HALF_LINK_GLUE_AUDIT_ITER303_2026-09-11.md paper_iv/PAPER_IV_DECISION_LEDGER_DELTA_303.json recovery/RECOVERY_DELTA_303.md recovery/PUBLICATION_IMPACT_LEDGER.md recovery/CURRENT_BENCHMARK_FRONT.md'
          if git diff --quiet -- $FILES; then
            echo 'No Iter303 recovery changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m 'Iter303: integrate Toller SU2 Haar half-link glue recovery state'
          git pull --rebase origin main
          git push origin HEAD:main
