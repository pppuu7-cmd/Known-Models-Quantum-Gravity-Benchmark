name: iter481-angular-intertwiner-network

on:
  push:
    branches: [ main ]
    paths:
      - 'code/iter481_angular_intertwiner_network.py'
      - 'recovery/ITER481_PREREG_ANGULAR_INTERTWINER_NETWORK_2026-09-13.md'
      - '.github/workflows/iter481-angular-intertwiner-network.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        gamma: [7, 8]
        causal: [0to5, 1to4, 2to3]
        pattern: [P0, P1]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 mpmath==1.3.0 sympy==1.13.3
      - name: Run frozen Iter481 lane
        env:
          ITER481_GAMMA: ${{ matrix.gamma }}
          ITER481_CAUSAL: ${{ matrix.causal }}
          ITER481_PATTERN: ${{ matrix.pattern }}
        run: python code/iter481_angular_intertwiner_network.py
      - name: Upload raw lane artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter481-g${{ matrix.gamma }}-${{ matrix.causal }}-${{ matrix.pattern }}
          path: artifacts/iter481-g${{ matrix.gamma }}-${{ matrix.causal }}-${{ matrix.pattern }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter481-*
          path: collected
          merge-multiple: false
      - name: Frozen aggregate classifier
        run: |
          python - <<'PY'
          import json,pathlib,sys
          files=sorted(pathlib.Path('collected').glob('**/*.json'))
          rows=[json.loads(p.read_text()) for p in files]
          expected={(g,c,p) for g in (7,8) for c in ('0to5','1to4','2to3') for p in ('P0','P1')}
          seen={(r.get('gamma'),r.get('causal_representative'),r.get('angular_pattern')) for r in rows}
          complete=(seen==expected and len(rows)==12)
          passes=complete and all(r.get('scientific_pass') is True for r in rows)
          out={'iteration':'481','lane_count':len(rows),'complete_expected_panel':complete,'all_lane_scientific_pass':passes,
               'classification':'ITER481_SOURCE_ANGULAR_INTERTWINER_NETWORK_NONZERO_WITNESS_SCOPED' if passes else 'FAIL_ITER481_ANGULAR_INTERTWINER_NETWORK',
               'lanes':[{'lane':r.get('lane'),'pass':r.get('scientific_pass'),'nonzero_witnesses':r.get('nonzero_witnesses'),'max_ratio':r.get('max_ratio')} for r in rows],
               'scope':'frozen local Eq7 angular/intertwiner diagnostic only; common SL2C group compatibility and D7-S2 remain open'}
          pathlib.Path('iter481-aggregate.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2)); sys.exit(0 if passes else 2)
          PY
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter481-aggregate
          path: iter481-aggregate.json
          if-no-files-found: error
