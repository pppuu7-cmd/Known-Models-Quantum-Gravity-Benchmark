name: iter499-interval-dependency-diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'recovery/ITER499_DIAGNOSTIC_INTERVAL_DEPENDENCY_2026-09-14.md'
      - 'diagnostics/iter499_interval_dependency.py'
      - '.github/workflows/iter499-interval-dependency-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
      - name: Run frozen diagnostic only
        env:
          PYTHONPATH: code
        run: python diagnostics/iter499_interval_dependency.py
      - uses: actions/upload-artifact@v4
        with:
          name: iter499-dependency-diagnostic
          path: artifacts/iter499-dependency-diagnostic.json
          if-no-files-found: error
