name: lqg-toller-local-power-count-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter306_toller_local_power_count.json'
      - 'code/lqg_iter306_*.py'
      - '.github/workflows/lqg-toller-local-power-count-audit.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        probe:
          - hypergeom_local_exponent
          - h3_local_measure_threshold
          - k5_subset_power_count
          - uniform_spin_threshold_map
          - scope_guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Iter306 probe
        shell: bash
        run: |
          mkdir -p build/lqg-iter306
          python code/lqg_iter306_${{ matrix.probe }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter306-${{ matrix.probe }}
          path: build/lqg-iter306/${{ matrix.probe }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter306-*
          path: build/lqg-iter306-results
          merge-multiple: true
      - name: Aggregate only after all independent probes succeed
        run: python code/lqg_iter306_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter306-summary
          path: |
            build/lqg-iter306-summary.json
            build/lqg-iter306-summary.sha256
          if-no-files-found: error
          retention-days: 90
