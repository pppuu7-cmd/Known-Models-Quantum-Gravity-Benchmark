name: fakeon-iter344-nnll-consistency-breaking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/fakeon_iter344_*.py'
      - '.github/workflows/fakeon-iter344-nnll-consistency-breaking.yml'

permissions:
  contents: read

jobs:
  point:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        xi: ['0.0','0.25','0.5','0.75','1.5','3.0','8.0','16.0']
        alpha: ['0.0077','0.0087','0.0097']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter344
          python code/fakeon_iter344_nnll_consistency_breaking.py \
            --xi '${{ matrix.xi }}' --alpha '${{ matrix.alpha }}' \
            --output 'build/iter344/point-${{ matrix.xi }}-${{ matrix.alpha }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fakeon-iter344-${{ matrix.xi }}-${{ matrix.alpha }}
          path: build/iter344/point-${{ matrix.xi }}-${{ matrix.alpha }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: point
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fakeon-iter344-*
          path: iter344-results
      - run: python code/fakeon_iter344_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fakeon-iter344-summary
          path: iter344-summary.json
          if-no-files-found: error
          retention-days: 90
