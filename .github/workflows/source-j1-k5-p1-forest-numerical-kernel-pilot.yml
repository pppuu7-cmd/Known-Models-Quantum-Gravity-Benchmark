name: source-j1-k5-p1-forest-numerical-kernel-pilot

on:
  push:
    branches: [main]
    paths:
      - 'research/prereg/SOURCE_J1_K5_P1_FOREST_NUMERICAL_KERNEL_PILOT_2026-09-15.md'
      - 'code/source_j1_k5_p1_forest_numerical_kernel_pilot.py'
      - 'code/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.py'
      - '.github/workflows/source-j1-k5-p1-forest-numerical-kernel-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify prospective kernel contract
        shell: bash
        run: |
          set -euo pipefail
          test -f research/prereg/SOURCE_J1_K5_P1_FOREST_NUMERICAL_KERNEL_PILOT_2026-09-15.md
          test -f code/source_j1_k5_p1_forest_numerical_kernel_pilot.py
          test -f code/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.py
          grep -Fq 'PROSPECTIVELY_FROZEN_BEFORE_IMPLEMENTATION_OR_RESULT' research/prereg/SOURCE_J1_K5_P1_FOREST_NUMERICAL_KERNEL_PILOT_2026-09-15.md
          grep -Fq 'alpha=0.55' research/prereg/SOURCE_J1_K5_P1_FOREST_NUMERICAL_KERNEL_PILOT_2026-09-15.md
          grep -Fq 'P1_FOREST_NUMERICAL_KERNEL_LANE_VALID' code/source_j1_k5_p1_forest_numerical_kernel_pilot.py
          grep -Fq 'P1_FOREST_NUMERICAL_KERNEL_CONFIRMED_SCOPED' code/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.py

  lane:
    needs: source-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dps: [180, 260]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install 'mpmath==1.3.0'
      - name: Run frozen precision lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python code/source_j1_k5_p1_forest_numerical_kernel_pilot.py \
            --dps '${{ matrix.dps }}' \
            --out artifacts/source_j1_k5_p1_forest_numerical_kernel_pilot.json \
            | tee artifacts/source_j1_k5_p1_forest_numerical_kernel_pilot.log
          sha256sum artifacts/source_j1_k5_p1_forest_numerical_kernel_pilot.json \
            > artifacts/source_j1_k5_p1_forest_numerical_kernel_pilot.json.sha256
          sha256sum artifacts/source_j1_k5_p1_forest_numerical_kernel_pilot.log \
            > artifacts/source_j1_k5_p1_forest_numerical_kernel_pilot.log.sha256
      - name: Upload lane artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1-forest-kernel-dps${{ matrix.dps }}
          path: artifacts/
          if-no-files-found: error

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install 'mpmath==1.3.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-forest-kernel-dps*
          path: lane_artifacts
      - name: Cross-precision aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aggregate
          python code/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.py \
            --root lane_artifacts \
            --out aggregate/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.json \
            | tee aggregate/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.log
          sha256sum aggregate/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.json \
            > aggregate/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.json.sha256
          sha256sum aggregate/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.log \
            > aggregate/source_j1_k5_p1_forest_numerical_kernel_pilot_aggregate.log.sha256
      - name: Upload aggregate artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1-forest-numerical-kernel-pilot-aggregate
          path: aggregate/
          if-no-files-found: error
