name: lqg-iter448-branch-sum-collision-cancellation
on:
  push:
    branches: [research/iter448-branch-sum-collision-cancellation]
    paths:
      - 'code/lqg_iter448_branch_sum_collision_cancellation.py'
      - '.github/workflows/lqg-iter448-branch-sum-collision-cancellation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {gamma: 7, j: 2}
          - {gamma: 7, j: 5}
          - {gamma: 8, j: 2}
          - {gamma: 8, j: 5}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Audit frozen coherent branch-sum collision powers
        run: python code/lqg_iter448_branch_sum_collision_cancellation.py --gamma '${{ matrix.gamma }}' --j '${{ matrix.j }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter448-g${{ matrix.gamma }}-j${{ matrix.j }}
          path: build/lqg-iter448/*.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: iter448-*
          path: evidence
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Aggregate frozen scientific classifier
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,hashlib,pathlib
          rows=[json.load(open(f)) for f in sorted(glob.glob('evidence/g*_j*.json'))]
          valid=len(rows)==4 and all(r.get('numerically_valid') for r in rows)
          n_pass=sum(bool(r.get('scientific_lane_pass')) for r in rows)
          if not valid: cls='BRANCH_SUM_COLLISION_CANCELLATION_NUMERICAL_INVALID'
          elif n_pass==4: cls='SOURCE_TOLLER_BRANCH_SUM_PAIR_COLLISION_POWER_INTEGRABLE_ON_FROZEN_GRID'
          else: cls='SOURCE_TOLLER_BRANCH_SUM_PAIR_COLLISION_OBSTRUCTION_ON_FROZEN_GRID'
          out={
            'iteration':448,'lanes_found':len(rows),'lanes_scientifically_passed':n_pass,'numerically_valid':valid,'classification':cls,
            'worst_coherent_p_local':max((r['worst_witness']['coherent_p_local'] for r in rows if r['worst_witness']['coherent_p_local'] is not None),default=None),
            'worst_recheck_delta':max((r['worst_power_recheck_abs_delta'] for r in rows),default=None),
            'minimum_cancellation_ratio':min((r['minimum_cancellation_ratio'] for r in rows if r['minimum_cancellation_ratio'] is not None),default=None),
            'd7_s2':'PAIR_BRANCH_SUM_COLLISION_SUPPORTED__FULL_INVARIANT_CONTRACTION_AND_MULTI_PAIR_REMAIN_OPEN' if cls.endswith('INTEGRABLE_ON_FROZEN_GRID') else 'PAIR_BRANCH_SUM_COLLISION_OBSTRUCTION__SOURCE_INVARIANT_CONTRACTION_REMAINS_OPEN',
            'd7_s3':'NOT_CLOSED','d7_s4':'PARTIAL_GLOBAL_NOT_CLOSED','d7':'NOT_CLOSED / NOT_YET_AUTHORIZED','candidate_gravity_authorized':False,
            'next_gate':'PASS -> preregister shared-variable simultaneous two-/three-pair collision geometry with source-defined invariant contraction structure. FAIL -> source-backed full invariant-contraction construction/audit; no retuning of Iter448.'
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'; pathlib.Path('iter448-summary.json').write_text(payload); pathlib.Path('iter448-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n'); print(payload)
          if not valid: raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter448-summary
          path: |
            iter448-summary.json
            iter448-summary.sha256
          if-no-files-found: error
          retention-days: 90
