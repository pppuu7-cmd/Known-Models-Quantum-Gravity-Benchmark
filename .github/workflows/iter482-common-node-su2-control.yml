name: iter482-common-node-su2-control

on:
  push:
    branches: [ main ]
    paths:
      - 'code/iter482_common_node_su2_control.py'
      - 'recovery/ITER482_PREREG_COMMON_NODE_SU2_CORRELATED_CONTROL_2026-09-13.md'
      - '.github/workflows/iter482-common-node-su2-control.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        gamma: [7, 8]
        causal: [0to5, 1to4, 2to3]
        panel: [Q0, Q1, Q2]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 mpmath==1.3.0 sympy==1.13.3
      - name: Run frozen Iter482 lane
        env:
          ITER482_GAMMA: ${{ matrix.gamma }}
          ITER482_CAUSAL: ${{ matrix.causal }}
          ITER482_PANEL: ${{ matrix.panel }}
        run: python code/iter482_common_node_su2_control.py
      - name: Upload raw lane artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter482-g${{ matrix.gamma }}-${{ matrix.causal }}-${{ matrix.panel }}
          path: artifacts/iter482-g${{ matrix.gamma }}-${{ matrix.causal }}-${{ matrix.panel }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter482-*
          path: collected
          merge-multiple: false
      - name: Frozen aggregate classifier
        run: |
          python - <<'PY'
          import json,pathlib,sys
          files=sorted(pathlib.Path('collected').glob('**/*.json'))
          rows=[json.loads(p.read_text()) for p in files]
          expected={(g,c,p) for g in (7,8) for c in ('0to5','1to4','2to3') for p in ('Q0','Q1','Q2')}
          seen={(r.get('gamma'),r.get('causal_representative'),r.get('panel')) for r in rows}
          complete=(seen==expected and len(rows)==18)
          passes=complete and all(r.get('scientific_pass') is True for r in rows)
          out={'iteration':'482','lane_count':len(rows),'complete_expected_panel':complete,'all_lane_scientific_pass':passes,
               'classification':'ITER482_COMMON_NODE_SU2_CORRELATED_NETWORK_NONZERO_WITNESS_SCOPED' if passes else 'FAIL_ITER482_COMMON_NODE_SU2_CORRELATED_CONTROL',
               'lanes':[{'lane':r.get('lane'),'pass':r.get('scientific_pass'),'nonzero_witnesses':r.get('nonzero_witnesses'),'max_ratio':r.get('max_ratio'),'cycle':r.get('triangle_cycle_residual'),'old_pattern_cycle':r.get('iter481_old_pattern_cycle_residuals')} for r in rows],
               'scope':'compact SU2 common-node correlated control only; no unique full SL2C KAK, boost/Haar/spectral/full-vertex conclusion'}
          pathlib.Path('iter482-aggregate.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2)); sys.exit(0 if passes else 2)
          PY
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter482-aggregate
          path: iter482-aggregate.json
          if-no-files-found: error
