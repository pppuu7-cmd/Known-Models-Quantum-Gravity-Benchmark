name: iter503v-endpoint-contract-verifier
on:
  push:
    branches: [main]
    paths:
      - 'recovery/ITER503V_PREREG_ENDPOINT_CONTRACT_VERIFIER_2026-09-14.md'
      - 'code/iter503v_endpoint_contract_verifier.py'
      - 'code/iter503v_aggregate.py'
      - '.github/workflows/iter503v-endpoint-contract-verifier.yml'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prospective authority and syntax
        run: |
          python -m py_compile code/iter503v_endpoint_contract_verifier.py code/iter503v_aggregate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('recovery/ITER503V_PREREG_ENDPOINT_CONTRACT_VERIFIER_2026-09-14.md').read_text().lower()
          assert 'outcome-blind' in p
          assert '34895563822' in p
          assert '288' in p
          assert 'iter503v_endpoint_contract_confirmed' in p
          assert 'iter503v_endpoint_contract_violation' in p
          q=Path('code/iter503v_endpoint_contract_verifier.py').read_text()
          assert "BOXES = [0, 7, 15]" in q
          assert "CAUSALS = ['0to5', '1to4', '2to3']" in q
          assert 'high_precision_point_raw' in q
          assert 'centered_raw' in q
          assert 'total_checks == 96' in q
          PY
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
          python - <<'PY'
          import flint
          assert flint.__version__ == '0.9.0'
          import sys
          sys.path.insert(0, 'code')
          import iter503v_endpoint_contract_verifier as v
          assert v.BOXES == [0, 7, 15]
          assert len(v.CAUSALS) == 3
          PY

  lane:
    needs: source-lock
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        box: [0, 7, 15]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
      - name: Run frozen raw endpoint-contract verifier lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter503v_endpoint_contract_verifier.py --box '${{ matrix.box }}' --out 'artifacts/iter503v-box${{ matrix.box }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter503v-box${{ matrix.box }}
          path: artifacts/iter503v-box${{ matrix.box }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter503v-box*
          path: downloaded
      - name: Aggregate frozen Iter503V verdict
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter503v_aggregate.py --root downloaded --out artifacts/iter503v-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter503v-summary
          path: artifacts/iter503v-summary.json
          if-no-files-found: error
