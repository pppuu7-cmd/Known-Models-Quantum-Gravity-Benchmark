name: lqg-maximal-forest-joint-limit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter320_*.py'
      - '.github/workflows/lqg-maximal-forest-joint-limit.yml'

permissions:
  contents: read

jobs:
  chains:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chain:
          - '012_0123'
          - '013_0123'
          - '023_0123'
          - '123_0123'
          - '012_0124'
          - '014_0124'
          - '024_0124'
          - '124_0124'
          - '013_0134'
          - '014_0134'
          - '034_0134'
          - '134_0134'
          - '023_0234'
          - '024_0234'
          - '034_0234'
          - '234_0234'
          - '123_1234'
          - '124_1234'
          - '134_1234'
          - '234_1234'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Probe maximal nested forest joint cutoff
        run: |
          mkdir -p build/lqg-iter320
          python code/lqg_iter320_maximal_forest_chain.py --chain ${{ matrix.chain }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter320-chain-${{ matrix.chain }}
          path: build/lqg-iter320/chain_${{ matrix.chain }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: chains
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter320-chain-*
          path: build/lqg-iter320-results
          merge-multiple: true
      - run: python code/lqg_iter320_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter320-summary
          path: |
            build/lqg-iter320-summary.json
            build/lqg-iter320-summary.sha256
          if-no-files-found: error
          retention-days: 90
