name: lqg-sector-weight-uniqueness-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter300_sector_weight_uniqueness.json'
      - '.github/workflows/lqg-sector-weight-uniqueness-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [source_contract, unit_weight_uniqueness, global_normalization_variant, scope_boundary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter300
          python - <<'PY'
          import itertools, json, pathlib
          p=json.load(open('benchmarks/lqg_iter300_sector_weight_uniqueness.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'; details={}
          if g=='source_contract':
              ok=(c['generic_exact_standard_D_product_recovery_requires_full_sector_support'] and
                  c['generic_exact_standard_D_product_recovery_requires_all_sector_weights_equal_one'] and
                  c['this_is_formal_coefficient_matching_not_a_physical_causal_measure_theorem'])
              details={'basis':'generic algebraically independent sector monomials','standard_coefficients':1}
          elif g=='unit_weight_uniqueness':
              checked=0
              for nw in range(1,13):
                  sectors=list(itertools.product((0,1), repeat=nw))
                  target={s:1 for s in sectors}
                  recovered={s:1 for s in sectors}
                  if recovered!=target: raise SystemExit('unit-weight matching failed')
                  # one changed coefficient and one missing support element must fail
                  changed=dict(recovered); changed[sectors[0]]=2
                  missing=dict(recovered); missing.pop(sectors[-1])
                  if changed==target or missing==target: raise SystemExit('uniqueness witness failed')
                  checked += len(sectors)
              ok=(checked==8190)
              details={'coefficient_constraints_checked':checked,'full_support_required_generically':True,'all_exact_weights_one':True}
          elif g=='global_normalization_variant':
              checked=0
              for C in (-7,-2,1,3,11):
                  for nw in range(1,9):
                      sectors=list(itertools.product((0,1), repeat=nw))
                      target={s:C for s in sectors}
                      uniform={s:C for s in sectors}
                      if uniform!=target: raise SystemExit('uniform-C matching failed')
                      nonuniform=dict(uniform); nonuniform[sectors[0]]=C+1
                      if nonuniform==target: raise SystemExit('nonuniform witness failed')
                      checked += len(sectors)
              ok=(checked==2550)
              details={'normalized_coefficient_constraints_checked':checked,'nonzero_C_values':[-7,-2,1,3,11],'all_weights_common_C':True}
          elif g=='scope_boundary':
              ok=(c['source_specific_sector_relations_cancellations_or_new_factorization_are_not_excluded'] and
                  not c['physical_causally_admissible_sector_support_measure_and_weights_identified'] and
                  not c['han_half_link_haar_glue_equivalence_proven'] and
                  not c['han_face_factorization_after_physical_causal_sector_sum_proven'] and
                  not c['lambda_f_weighted_causal_stack_finiteness_normalization_cutoff_control_proven'] and
                  not c['same_realization_uv_to_causal_regge_gr_transport_proven'] and
                  not c['family_terminal'] and not c['d7_authorized'])
              details={'physical_measure_open':True,'source_specific_relations_not_excluded':True,'han_glue_open':True,'stack_cutoff_open':True,'uv_ir_transport_open':True}
          else:
              raise SystemExit(2)
          out={'guard':g,'pass':bool(ok),'iteration':300,'details':details,'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter300/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter300-${{ matrix.guard }}
          path: build/lqg-iter300/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter300-*
          path: build/lqg-iter300-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=sorted(pathlib.Path('build/lqg-iter300-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          by={x['guard']:x for x in rows}
          p=json.load(open('benchmarks/lqg_iter300_sector_weight_uniqueness.json'))
          out={
            'iteration':300,
            'independent_guards':4,
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'generic_exact_standard_recovery_requires_full_sector_support':True,
            'generic_exact_standard_recovery_requires_all_weights_one':True,
            'generic_recovery_up_to_nonzero_global_C_requires_full_support_and_uniform_C_weights':True,
            'coefficient_constraints_checked':by['unit_weight_uniqueness']['details']['coefficient_constraints_checked'],
            'normalized_coefficient_constraints_checked':by['global_normalization_variant']['details']['normalized_coefficient_constraints_checked'],
            'physical_causally_admissible_sector_measure_identified':False,
            'han_half_link_haar_glue_equivalence_proven':False,
            'han_face_factorization_proven':False,
            'causal_stack_finiteness_normalization_cutoff_control_proven':False,
            'same_realization_uv_to_regge_gr_transport_proven':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter300-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter300-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter300-summary
          path: |
            build/lqg-iter300-summary.json
            build/lqg-iter300-summary.sha256
          if-no-files-found: error
          retention-days: 90
