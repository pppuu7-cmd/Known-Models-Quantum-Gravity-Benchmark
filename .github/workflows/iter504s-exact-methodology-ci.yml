name: Iter504S exact-decision methodology CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter504s-exact-methodology-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check exact-decision chain
        run: |
          python -m py_compile \
            code/iter504s_mechanism_discriminator_exact.py \
            code/iter504s_mechanism_assemble_exact.py \
            code/iter504s_mechanism_aggregate_exact.py \
            code/iter504s_adversarial_critic_exact.py
      - name: Static exact-decision contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "REPAIR_EXACT = '77d42eb58c03eef2356aed7a25795562760de4e3'" code/iter504s_mechanism_discriminator_exact.py
          grep -F "slope_ok = bool(slo >= FLOOR)" code/iter504s_mechanism_discriminator_exact.py
          grep -F "drift_ok = bool(du <= TOL)" code/iter504s_mechanism_discriminator_exact.py
          grep -F "'drift_within_tolerance': drift_ok" code/iter504s_mechanism_discriminator_exact.py
          grep -F "'violating_channel_indices': violating" code/iter504s_mechanism_discriminator_exact.py
          grep -F "'scientific_decision_transport': 'exact_arb_booleans_float_bounds_display_only'" code/iter504s_mechanism_discriminator_exact.py
          grep -F "full_viol = not F['drift_within_tolerance']" code/iter504s_mechanism_discriminator_exact.py
          grep -F "center_viol = not C['drift_within_tolerance']" code/iter504s_mechanism_discriminator_exact.py
          grep -F "not F['drift_within_tolerance']" code/iter504s_mechanism_assemble_exact.py
          grep -F "violating_channel_indices" code/iter504s_mechanism_aggregate_exact.py
          grep -F "cross_environment_exact_decision_agreement" code/iter504s_adversarial_critic_exact.py
          grep -F "center_D_is_control_only': True" code/iter504s_mechanism_assemble_exact.py
          if grep -E "float\([^)]*(drift_upper|S_lower|max_fixed_channel_drift_upper)[^)]*\).*(<=|>=|<|>)" code/iter504s_mechanism_assemble_exact.py code/iter504s_mechanism_aggregate_exact.py code/iter504s_adversarial_critic_exact.py; then
            echo 'scientific float threshold comparison reintroduced'
            exit 1
          fi
      - name: Mandatory adversarial controls present
        shell: bash
        run: |
          set -euo pipefail
          for control in \
            threshold_comparison_after_arb_to_float_conversion \
            floor_comparison_from_serialized_float \
            fixed_channel_maximum_used_as_threshold_authority \
            missing_exact_decision_boolean \
            inconsistent_all_within_vs_violating_channel_list \
            omitted_channel \
            candidate_set_incompleteness_mislabeled_complete \
            channel_pruning \
            changed_threshold \
            changed_floor \
            changed_root_rho_R_cohort \
            changed_exact_LOW_MID_HIGH_amplitude \
            center_D_treated_as_rigorous_enclosure \
            result_dependent_case_deletion; do
            grep -F "$control" code/iter504s_adversarial_critic_exact.py
          done
      - name: Execute synthetic adversarial self-test
        run: python code/iter504s_adversarial_critic_exact.py --self-test
      - name: Frozen science constants unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -F "TOL = arb('0.05')" code/iter504s_mechanism_discriminator_exact.py
          grep -F "FLOOR = arb('1.0')" code/iter504s_mechanism_discriminator_exact.py
          grep -F "ROOTS = (13, 14, 15)" code/iter504s_mechanism_discriminator_exact.py
          grep -F "full_channel_count': 243" code/iter504s_mechanism_discriminator_exact.py
          grep -F "precision_bits': 384" code/iter504s_mechanism_discriminator_exact.py
