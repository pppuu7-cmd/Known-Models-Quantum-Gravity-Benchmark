name: iter507-tensor-frobenius-control-repair
on:
  push:
    branches: [research/iter507-tensor-frobenius-control-repair]
    paths:
      - 'recovery/ITER507_PREREG_TENSOR_FROBENIUS_CONTROL_REPAIR_2026-09-14.md'
      - 'code/iter507_tensor_frobenius_control_repair.py'
      - 'code/iter507_aggregate.py'
      - '.github/workflows/iter507-tensor-frobenius-control-repair.yml'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authority and scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('recovery/ITER507_PREREG_TENSOR_FROBENIUS_CONTROL_REPAIR_2026-09-14.md').read_text().lower()
          assert 'prospectively frozen after consuming terminal iter506 production evidence and before any iter507 production evidence' in p
          assert "valueerror('improper number of dimensions to norm.')" in p
          assert 'np.linalg.norm(np.ravel(t))' in p
          assert 'eta in {1e-12, 1e-10, 1e-8, 1e-6}' in p
          assert '5e-3' in p and '1e-12' in p
          assert 'no-branch-sum' in p
          assert 'no post-hoc radius insertion or refinement is allowed' in p
          assert 'terminal d7 label' in p
          assert 'candidate gravity remains inactive' in p
          PY

  lane:
    needs: source-lock
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        panel: [T0, T1, T2]
        causal: [0to5, 1to4, 2to3]
        rho: [7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy
      - name: Run frozen control-repair lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter507_tensor_frobenius_control_repair.py --panel '${{ matrix.panel }}' --causal '${{ matrix.causal }}' --rho '${{ matrix.rho }}' --out 'artifacts/iter507-${{ matrix.panel }}-${{ matrix.causal }}-rho${{ matrix.rho }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter507-${{ matrix.panel }}-${{ matrix.causal }}-rho${{ matrix.rho }}
          path: artifacts/iter507-${{ matrix.panel }}-${{ matrix.causal }}-rho${{ matrix.rho }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter507-*
          path: downloaded
      - name: Aggregate frozen Iter507 verdict
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter507_aggregate.py --root downloaded --out artifacts/iter507-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter507-summary
          path: artifacts/iter507-summary.json
          if-no-files-found: error
