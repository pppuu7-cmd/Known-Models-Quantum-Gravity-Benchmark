name: iter485-ten-edge-toller-network

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/iter485_ten_edge_toller_network.py'
      - 'code/iter485_aggregate.py'
      - 'recovery/ITER485_PREREG_TEN_EDGE_TOLLER_MAGNETIC_NETWORK_2026-09-14.md'
      - '.github/workflows/iter485-ten-edge-toller-network.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authorities
        run: |
          python - <<'PY'
          import pathlib
          p=pathlib.Path('recovery/ITER485_PREREG_TEN_EDGE_TOLLER_MAGNETIC_NETWORK_2026-09-14.md').read_text()
          for s in ['FROZEN BEFORE IMPLEMENTATION/PRODUCTION','24 lanes','3^5=243','pre-Haar','do not integrate shared group variables or spectral variables']:
              assert s in p, s
          for q in ['code/iter482_common_node_su2_control.py','code/iter483_common_node_sl2c_polar.py','code/iter484_source_toller_kak_one_edge.py','sources/arxiv_2601_23162v1_causal_vertex.json','sources/arxiv_2604_24945v1_toller_cartan.json']:
              assert pathlib.Path(q).exists(), q
          print('ITER485_SOURCE_LOCK_PASS')
          PY

  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        panel: [A, B, C, D]
        regime: [mild, strong]
        causal: [0to5, 1to4, 2to3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 mpmath==1.3.0 sympy==1.14.0
      - name: Run frozen scientific lane
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python code/iter485_ten_edge_toller_network.py \
            --panel '${{ matrix.panel }}' \
            --regime '${{ matrix.regime }}' \
            --causal '${{ matrix.causal }}' \
            --out 'artifacts/iter485-${{ matrix.panel }}-${{ matrix.regime }}-${{ matrix.causal }}.json'
          rc=$?
          echo "$rc" > 'artifacts/iter485-${{ matrix.panel }}-${{ matrix.regime }}-${{ matrix.causal }}.exit.txt'
          exit 0
      - name: Upload raw lane artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter485-${{ matrix.panel }}-${{ matrix.regime }}-${{ matrix.causal }}
          path: artifacts/iter485-${{ matrix.panel }}-${{ matrix.regime }}-${{ matrix.causal }}.*
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [source-lock, lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all raw lane artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iter485-*
          path: artifacts
          merge-multiple: true
      - name: Aggregate frozen verdict
        run: python code/iter485_aggregate.py
      - name: Upload aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter485-summary
          path: artifacts/iter485-summary.json
          if-no-files-found: error
      - name: Enforce source-lock infrastructure status
        if: needs.source-lock.result != 'success'
        run: |
          echo 'Source lock failed; aggregate payload is non-authoritative.'
          exit 1
