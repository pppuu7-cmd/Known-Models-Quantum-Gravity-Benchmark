name: lqg-k3-contracted-residue-tensor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter315_k3_contracted_residue_tensor.json'
      - 'code/lqg_iter315_*.py'
      - '.github/workflows/lqg-k3-contracted-residue-tensor.yml'

permissions:
  contents: read

jobs:
  triangles:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        triangle: ['012','013','014','023','024','034','123','124','134','234']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent triangle residue tensor
        run: |
          mkdir -p build/lqg-iter315
          python code/lqg_iter315_triangle_residue_tensor.py --triangle ${{ matrix.triangle }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter315-triangle-${{ matrix.triangle }}
          path: build/lqg-iter315/triangle_${{ matrix.triangle }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: triangles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter315-triangle-*
          path: build/lqg-iter315-results
          merge-multiple: true
      - run: python code/lqg_iter315_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter315-summary
          path: |
            build/lqg-iter315-summary.json
            build/lqg-iter315-summary.sha256
          if-no-files-found: error
          retention-days: 90
