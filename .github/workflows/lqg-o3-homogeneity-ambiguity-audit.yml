name: lqg-o3-homogeneity-ambiguity-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter329_*.py'
      - '.github/workflows/lqg-o3-homogeneity-ambiguity-audit.yml'

permissions:
  contents: read

jobs:
  stratum:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        stratum: [K3, K4, K5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter329
          python code/lqg_iter329_o3_homogeneity.py --stratum '${{ matrix.stratum }}' --output 'build/iter329/${{ matrix.stratum }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter329-${{ matrix.stratum }}
          path: build/iter329/${{ matrix.stratum }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: stratum
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter329-*
          path: iter329-results
      - run: python code/lqg_iter329_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter329-summary
          path: iter329-summary.json
          if-no-files-found: error
          retention-days: 90
