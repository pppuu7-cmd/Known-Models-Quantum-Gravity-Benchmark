name: lqg-iter445-cut-cone-envelope-reach
on:
  push:
    branches: [research/iter445-cut-cone-envelope-reach]
    paths:
      - 'benchmarks/lqg_iter445_cut_cone_envelope_reach_contract.json'
      - 'code/lqg_iter445_cut_cone_reach.py'
      - '.github/workflows/lqg-iter445-cut-cone-envelope-reach.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cardinality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        k: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Evaluate exact K5 cut-cone lane
        run: python code/lqg_iter445_cut_cone_reach.py --k '${{ matrix.k }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter445-k${{ matrix.k }}
          path: build/lqg-iter445/k${{ matrix.k }}.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: cardinality
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: iter445-k*
          path: evidence
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Aggregate exact envelope-reach classification
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,hashlib,pathlib
          rows=[json.load(open(f)) for f in sorted(glob.glob('evidence/k*.json'))]
          by={r['k']:r for r in rows}
          exact=(len(rows)==4 and all(r.get('controls_valid') for r in rows) and [by[k]['exact_net_common_shift_exponent'] for k in (1,2,3,4)]==[-2,-2,0,4] and [by[k]['envelope_certificate'] for k in (1,2,3,4)]==['SUFFICIENT_BY_THIS_BOUND','SUFFICIENT_BY_THIS_BOUND','UNRESOLVED_BY_THIS_BOUND','UNRESOLVED_BY_THIS_BOUND'])
          out={'iteration':445,'lanes_found':len(rows),'controls_valid':exact,'net_exponents':{str(k):by[k]['exact_net_common_shift_exponent'] for k in sorted(by)},'envelope_certificates':{str(k):by[k]['envelope_certificate'] for k in sorted(by)},'classification':'EXACT_K5_SINGLE_FACTOR_ENVELOPE_CERTIFICATE_COVERS_K1_K2_ONLY__K3_K4_REQUIRE_STRONGER_CORRELATED_OR_ANGULAR_BOUND' if exact else 'CUT_CONE_AGGREGATE_INVALID','scientific_interpretation':'k=3 and k=4 are unresolved by this conservative bound; nonnegative exponent is not a divergence theorem, scientific FAIL, or no-go.','d7_s2':'BLOCKER_LOCALIZED_TO_K3_K4_CORRELATED_MULTI_GROUP_DIRECTIONS_BUT_NOT_CLOSED' if exact else 'NOT_CLOSED','d7_s3':'NOT_CLOSED','d7_s4':'PARTIAL_GLOBAL_NOT_CLOSED','d7':'NOT_CLOSED / NOT_YET_AUTHORIZED','candidate_gravity_authorized':False,'next_gate':'Construct a source-backed correlated multi-edge/group-integral bound for the k=3/k=4 escape cones, including angular/intertwiner structure, rather than multiplying independent one-factor envelopes.'}
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'; pathlib.Path('iter445-summary.json').write_text(payload); pathlib.Path('iter445-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n'); print(payload)
          if not exact: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter445-summary
          path: |
            iter445-summary.json
            iter445-summary.sha256
          if-no-files-found: error
          retention-days: 90
