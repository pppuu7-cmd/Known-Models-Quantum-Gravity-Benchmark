name: iter455-toller-reciprocal-gamma-zero-scaling
on:
  push:
    paths:
      - 'code/iter455_toller_reciprocal_gamma_zero_scaling.py'
      - '.github/workflows/iter455-toller-reciprocal-gamma-zero-scaling.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        lane: [L0, L1, L2, L3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mpmath
      - name: Frozen lane audit
        run: |
          mkdir -p artifacts
          python code/iter455_toller_reciprocal_gamma_zero_scaling.py --lane ${{ matrix.lane }} --out artifacts/${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter455-${{ matrix.lane }}
          path: artifacts/${{ matrix.lane }}.json

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter455-*
          path: raw
          merge-multiple: true
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import glob,json,os
          files=sorted(glob.glob('raw/*.json'))
          rec=[json.load(open(f)) for f in files]
          valid=len(rec)==4 and all(x.get('valid') for x in rec)
          passed=valid and all(x.get('pass') for x in rec)
          cls=('ITER455_TOLLER_RECIPROCAL_GAMMA_SIMPLE_ZERO_QUALIFIED_SCOPED' if passed else
               'SCIENTIFIC_FAIL_ITER455_TOLLER_RECIPROCAL_GAMMA_SIMPLE_ZERO' if valid else
               'INFRASTRUCTURE_OR_NUMERICAL_FAIL')
          summary={'n_artifacts':len(rec),'valid_lanes':sum(bool(x.get('valid')) for x in rec),
                   'pass_lanes':sum(bool(x.get('pass')) for x in rec),'classification':cls,'lanes':rec}
          os.makedirs('summary',exist_ok=True)
          json.dump(summary,open('summary/iter455_summary.json','w'),indent=2)
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter455-summary
          path: summary/iter455_summary.json
