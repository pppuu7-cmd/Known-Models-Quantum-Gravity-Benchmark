name: source-j1-k5-p1-mixed-taylor-grid-method-pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-j1-k5-p1-mixed-taylor-grid-method-pilot.yml'
      - 'code/source_j1_k5_p1_mixed_taylor_grid_method_pilot.py'
      - 'code/source_j1_k5_p1_mixed_taylor_grid_method_aggregate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prospective chronology and frozen markers
        run: |
          set -euo pipefail
          git merge-base --is-ancestor aca376c7933c20bb5cbea1f95c6fc601a82af070 HEAD
          git merge-base --is-ancestor 4f73b7822ba910ea0904c9add0d5a1c52c206bbf HEAD
          grep -F 'P1_MIXED_TAYLOR_GRID_METHOD_CONFIRMED_SCOPED' research/prereg/SOURCE_J1_K5_P1_MIXED_TAYLOR_GRID_METHOD_PILOT_2026-09-15.md
          grep -F 'P1_MIXED_TAYLOR_GRID_METHOD_PRECISION_BLOCKED' research/prereg/SOURCE_J1_K5_P1_MIXED_TAYLOR_GRID_METHOD_PILOT_2026-09-15.md
          grep -F 'INVALID_IMPLEMENTATION' research/prereg/SOURCE_J1_K5_P1_MIXED_TAYLOR_GRID_METHOD_PILOT_2026-09-15.md
          grep -F 'c3e0ca0c5a5357887db79b7b0a1c5a0a1042c450ca13f7e2599c7e3801ef8a9c' results/SOURCE_J1_K5_SCALAR_FOREST_OPERATOR_PILOT_TERMINAL_2026-09-15.md

  lane:
    needs: source-lock
    strategy:
      fail-fast: false
      matrix:
        lane: [LOW, HIGH]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin numerical dependency
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Run frozen lane
        env:
          PYTHONPATH: code
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python code/source_j1_k5_p1_mixed_taylor_grid_method_pilot.py --lane '${{ matrix.lane }}' --repo-root . --out 'artifacts/mixed_taylor_${{ matrix.lane }}.json' | tee 'artifacts/mixed_taylor_${{ matrix.lane }}.log'
          sha256sum 'artifacts/mixed_taylor_${{ matrix.lane }}.json' 'artifacts/mixed_taylor_${{ matrix.lane }}.log' > 'artifacts/mixed_taylor_${{ matrix.lane }}.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-taylor-${{ matrix.lane }}
          path: artifacts/mixed_taylor_${{ matrix.lane }}.*
          if-no-files-found: error

  aggregate:
    needs: lane
    if: ${{ always() && needs.lane.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - uses: actions/download-artifact@v4
        with:
          pattern: mixed-taylor-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate frozen decision
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python code/source_j1_k5_p1_mixed_taylor_grid_method_aggregate.py --low downloaded/mixed_taylor_LOW.json --high downloaded/mixed_taylor_HIGH.json --out artifacts/mixed_taylor_aggregate.json | tee artifacts/mixed_taylor_aggregate.log
          sha256sum artifacts/mixed_taylor_aggregate.json artifacts/mixed_taylor_aggregate.log > artifacts/mixed_taylor_aggregate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-taylor-aggregate
          path: artifacts/mixed_taylor_aggregate.*
          if-no-files-found: error
