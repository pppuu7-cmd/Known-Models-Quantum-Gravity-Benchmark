name: nsf-tree-claim-boundary-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/nsf_tree_common.py'
      - 'code/nsf_tree_normalization.py'
      - 'code/nsf_tree_tu_symmetry.py'
      - 'code/nsf_tree_fixed_angle_scaling.py'
      - 'code/nsf_tree_collinear_scaling.py'
      - 'code/nsf_tree_aggregate.py'
      - '.github/workflows/nsf-tree-claim-boundary-audit.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: normalization, script: nsf_tree_normalization.py}
          - {label: tu-symmetry, script: nsf_tree_tu_symmetry.py}
          - {label: fixed-angle, script: nsf_tree_fixed_angle_scaling.py}
          - {label: collinear, script: nsf_tree_collinear_scaling.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent NSF probe
        run: python code/${{ matrix.script }} --output build/nsf/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsf-${{ matrix.label }}
          path: build/nsf/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nsf-*
          path: build/nsf-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/nsf_tree_aggregate.py --input-dir build/nsf-results --output build/nsf-iter279-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsf-iter279-summary
          path: build/nsf-iter279-summary.json
          if-no-files-found: error
          retention-days: 90
