name: source-j1-k5-gaussian-compact-support-localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-j1-k5-gaussian-compact-support-localization.yml'
      - 'code/source_j1_k5_gaussian_compact_support_localization.py'
      - 'research/prereg/SOURCE_J1_K5_GAUSSIAN_COMPACT_SUPPORT_LOCALIZATION_2026-09-15.md'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prospective contract and parent
        shell: bash
        run: |
          set -euo pipefail
          p='research/prereg/SOURCE_J1_K5_GAUSSIAN_COMPACT_SUPPORT_LOCALIZATION_2026-09-15.md'
          git show 1e3402aa02a2f52eac5d379ba8b0c5ffc5ebc4ef:"$p" > /tmp/p.frozen
          cmp /tmp/p.frozen "$p"
          git merge-base --is-ancestor 8982ea92de08bfb6028df35be16f116e0e58c22f HEAD
          grep -F 'AUX_GAUSSIAN_JOINT_REGULATOR_REJECTED_UNRENORMALIZED_SCOPED' results/SOURCE_J1_K5_ADDITIONAL_JOINT_REGULATOR_GAUSSIAN_DIAGNOSTIC_RESULT_2026-09-15.md
          grep -F 'P0 must not enter the terminal classifier' "$p"
      - name: Syntax check
        run: python -m py_compile code/source_j1_k5_gaussian_compact_support_localization.py

  certificate:
    needs: source-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Run compact-support localization certificate
        run: |
          set -euo pipefail
          python code/source_j1_k5_gaussian_compact_support_localization.py > source_j1_k5_gaussian_compact_support.json
          cat source_j1_k5_gaussian_compact_support.json
      - name: Validate output
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('source_j1_k5_gaussian_compact_support.json'))
          allowed={
            'AUX_GAUSSIAN_UNRENORMALIZED_COMPACT_LOCAL_DIVERGENCE_SCOPED',
            'AUX_GAUSSIAN_COMPACT_LOCALIZATION_PARTIAL_SCOPED',
            'AUX_GAUSSIAN_COMPACT_LOCALIZATION_INCONCLUSIVE',
            'INVALID_IMPLEMENTATION',
          }
          assert x['classification'] in allowed
          assert x['precision_decimal_digits'] >= 100
          assert x['k_used'] == [5,6,7,8]
          assert x['deciding_paths'] == ['P1','P2','P3']
          if x['classification'] != 'INVALID_IMPLEMENTATION':
              assert x['controls_pass'] is True
          print('classification='+x['classification'])
          for p in x['deciding_paths']:
              print(p, x['path_results'][p]['status'])
              print(x['path_results'][p]['growth_lower_ratios'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-j1-k5-gaussian-compact-support-localization
          path: source_j1_k5_gaussian_compact_support.json
          if-no-files-found: error
