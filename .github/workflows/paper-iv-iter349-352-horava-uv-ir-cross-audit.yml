name: paper-iv-iter349-352-horava-uv-ir-cross-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_iv/HORAVA_SOURCE_AUTHORITY_ITER349_352.json'
      - 'code/horava_iter349_*.py'
      - 'code/horava_iter350_*.py'
      - 'code/horava_iter351_*.py'
      - 'code/horava_iter352_*.py'
      - 'code/iter349_352_aggregate.py'
      - '.github/workflows/paper-iv-iter349-352-horava-uv-ir-cross-audit.yml'

permissions:
  contents: read

jobs:
  ir-dispersion:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        epsilon: ['1e-6','1e-4','1e-2','1e-1','1','10']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - run: |
          mkdir -p build/iter349
          python code/horava_iter349_ir_dispersion.py --epsilon '${{ matrix.epsilon }}' --output 'build/iter349/ir-${{ matrix.epsilon }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter349-ir-${{ matrix.epsilon }}, path: 'build/iter349/ir-${{ matrix.epsilon }}.json', if-no-files-found: error, retention-days: 90}

  uv-amplitude:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: ['zero','v2p1','v3p1','mixedA','mixedB','mixedC']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - run: |
          mkdir -p build/iter350
          python code/horava_iter350_uv_amplitude_limit.py --case '${{ matrix.case }}' --output 'build/iter350/uv-${{ matrix.case }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter350-uv-${{ matrix.case }}, path: 'build/iter350/uv-${{ matrix.case }}.json', if-no-files-found: error, retention-days: 90}

  transport-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python code/horava_iter351_transport_guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter351-horava-transport-guard, path: iter351-horava-transport-guard.json, if-no-files-found: error, retention-days: 90}

  nonprojectable-scope-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python code/horava_iter352_nonprojectable_scope_guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter352-horava-nonprojectable-scope-guard, path: iter352-horava-nonprojectable-scope-guard.json, if-no-files-found: error, retention-days: 90}

  aggregate:
    needs: [ir-dispersion, uv-amplitude, transport-guard, nonprojectable-scope-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'iter3*', path: iter349-352-results}
      - run: python code/iter349_352_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter349-352-summary, path: iter349-352-summary.json, if-no-files-found: error, retention-days: 90}
