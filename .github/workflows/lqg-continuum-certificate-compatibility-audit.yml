name: lqg-continuum-certificate-compatibility-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_continuum_contract_common.py'
      - 'code/lqg_continuum_strong_limit_guard.py'
      - 'code/lqg_continuum_rigging_map_guard.py'
      - 'code/lqg_continuum_model_specificity_guard.py'
      - 'code/lqg_continuum_han_bridge_guard.py'
      - 'code/lqg_continuum_aggregate.py'
      - '.github/workflows/lqg-continuum-certificate-compatibility-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: strong, script: lqg_continuum_strong_limit_guard.py}
          - {label: rigging, script: lqg_continuum_rigging_map_guard.py}
          - {label: specificity, script: lqg_continuum_model_specificity_guard.py}
          - {label: han, script: lqg_continuum_han_bridge_guard.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent continuum-certificate guard
        run: python code/${{ matrix.script }} --output build/lqg-continuum/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-continuum-${{ matrix.label }}
          path: build/lqg-continuum/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-continuum-*
          path: build/lqg-continuum-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_continuum_aggregate.py --input-dir build/lqg-continuum-results --output build/lqg-continuum-iter282-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-continuum-iter282-summary
          path: build/lqg-continuum-iter282-summary.json
          if-no-files-found: error
          retention-days: 90
