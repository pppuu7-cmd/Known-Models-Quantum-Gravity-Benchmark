name: lqg-lorentzian-entropy-observable-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_entropy_observable_common.py'
      - 'code/lqg_entropy_bh_normalization_probe.py'
      - 'code/lqg_entropy_coupling_gamma_guard.py'
      - 'code/lqg_entropy_discretization_guard.py'
      - 'code/lqg_entropy_uv_ir_transport_guard.py'
      - 'code/lqg_entropy_observable_aggregate.py'
      - '.github/workflows/lqg-lorentzian-entropy-observable-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: bh, script: lqg_entropy_bh_normalization_probe.py}
          - {label: coupling, script: lqg_entropy_coupling_gamma_guard.py}
          - {label: discretization, script: lqg_entropy_discretization_guard.py}
          - {label: transport, script: lqg_entropy_uv_ir_transport_guard.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Lorentzian entropy observable guard
        run: python code/${{ matrix.script }} --output build/lqg-entropy/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-entropy-${{ matrix.label }}
          path: build/lqg-entropy/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-entropy-*
          path: build/lqg-entropy-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_entropy_observable_aggregate.py --input-dir build/lqg-entropy-results --output build/lqg-entropy-iter285-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-entropy-iter285-summary
          path: build/lqg-entropy-iter285-summary.json
          if-no-files-found: error
          retention-days: 90
