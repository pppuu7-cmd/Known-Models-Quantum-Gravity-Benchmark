name: iter477-toller-exact-beta0-singular-order
on:
  push:
    branches: [research/iter477-toller-exact-beta0-singular-order]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install mpmath
      - run: python code/iter477_toller_exact_beta0_singular_order.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter477-summary
          path: artifacts/iter477-summary.json
