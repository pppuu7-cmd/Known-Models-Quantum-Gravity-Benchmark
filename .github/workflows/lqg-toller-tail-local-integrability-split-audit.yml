name: lqg-toller-tail-local-integrability-split-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter305_toller_tail_local_integrability_split.json'
      - 'code/lqg_iter305_*.py'
      - '.github/workflows/lqg-toller-tail-local-integrability-split-audit.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        probe:
          - gamma_simple_decay_floor
          - k5_kaminski_margin
          - physical_rho_pole_guard
          - local_identity_singularity
          - scope_guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Iter305 probe
        shell: bash
        run: |
          mkdir -p build/lqg-iter305
          python code/lqg_iter305_${{ matrix.probe }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter305-${{ matrix.probe }}
          path: build/lqg-iter305/${{ matrix.probe }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter305-*
          path: build/lqg-iter305-results
          merge-multiple: true
      - name: Aggregate only after all independent probes succeed
        run: python code/lqg_iter305_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter305-summary
          path: |
            build/lqg-iter305-summary.json
            build/lqg-iter305-summary.sha256
          if-no-files-found: error
          retention-days: 90
