name: iter493-critical-q1-variation

on:
  push:
    paths:
      - '.github/workflows/iter493-critical-q1-variation.yml'
      - 'code/iter493_critical_q1_variation.py'
      - 'code/iter493_aggregate.py'
      - 'recovery/ITER493_PREREG_CRITICAL_Q1_VARIATION_2026-09-14.md'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authority and scope guards
        run: |
          python - <<'PY'
          import pathlib
          pre=pathlib.Path('recovery/ITER493_PREREG_CRITICAL_Q1_VARIATION_2026-09-14.md').read_text()
          result=pathlib.Path('recovery/ITER492_RESULT_TANGENT_BOUNDARY_LAYER_2026-09-14.md').read_text()
          assert 'prospectively frozen before implementation' in pre
          assert 'q=1.00' in pre and 'only' in pre
          assert 'all 20 standard coordinate basis vectors' in pre
          assert 'kappa in {0.005, 0.010}' in pre
          assert 'ITER492_TANGENT_BOUNDARY_LAYER_BRACKET_QUALIFIED_SCOPED' in result
          assert 'Candidate Gravity remains inactive' in result
          PY

  lane:
    needs: source-lock
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        causal: [0to5, 1to4, 2to3]
        block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy
      - name: Run frozen critical q1 variation job
        run: |
          mkdir -p artifacts
          python code/iter493_critical_q1_variation.py \
            --causal '${{ matrix.causal }}' \
            --block '${{ matrix.block }}' \
            --out 'artifacts/iter493-${{ matrix.causal }}-b${{ matrix.block }}.json'
      - name: Upload raw job artifact
        uses: actions/upload-artifact@v4
        with:
          name: iter493-${{ matrix.causal }}-b${{ matrix.block }}
          path: artifacts/*.json
          if-no-files-found: error

  aggregate:
    needs: [source-lock, lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all raw jobs
        uses: actions/download-artifact@v4
        with:
          pattern: iter493-*
          path: raw
          merge-multiple: false
      - name: Aggregate frozen verdict
        run: |
          mkdir -p aggregate
          python code/iter493_aggregate.py --root raw --out aggregate/iter493-summary.json
      - name: Upload aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter493-summary
          path: aggregate/iter493-summary.json
          if-no-files-found: error
