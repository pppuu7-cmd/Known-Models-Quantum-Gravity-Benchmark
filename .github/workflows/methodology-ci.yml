name: methodology-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  methodology-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile reference code
        run: python -m compileall -q code

      - name: Validate all JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('.').rglob('*.json'))
          if not paths:
              raise SystemExit('No JSON files found')
          for path in paths:
              with path.open('r', encoding='utf-8') as fh:
                  json.load(fh)
          print(f'validated_json_files={len(paths)}')
          PY

      - name: Run fail-closed candidate-record validator self-test
        run: python code/kg_candidate_record_validator.py

      - name: Run inverse-kernel completeness self-test
        run: python code/inverse_kernel_ordered_partitions.py

      - name: Run residual-space geometry self-test
        run: python code/residual_space_geometry_reference.py

      - name: Run source-traceable detector-visible residual self-test
        run: python code/detector_visible_residual_physical_covariance_reference.py

      - name: Run optimal comparator-contrast self-test
        run: python code/optimal_comparator_contrasts_reference.py

      - name: Run cross-order rigidity self-test
        run: python code/cross_order_rigidity_reference.py

      - name: Run intervention-design self-test
        run: python code/intervention_design_reference.py

      - name: Run predictive-holdout self-test
        run: python code/predictive_holdout_reference.py

      - name: Run minimal-test-suite self-test
        run: python code/minimal_test_suite_reference.py

      - name: Run cross-representation rigidity self-test
        run: python code/cross_representation_rigidity_reference.py

      - name: Run P4 functional-freedom self-test
        run: python code/p4_functional_freedom_reference.py

      - name: Run exact local TT-projector no-go witness
        run: python code/local_tt_projector_no_go_reference.py

      - name: Run MISP2 BCC spin2 representation-lift control
        run: python code/misp2_spin2_representation_lift_control.py

      - name: Run MISP2 same-lattice fractional-root no-go witness
        run: python code/misp2_shared_clock_root_no_go_reference.py

      - name: Run O3 q-difference uniqueness control
        run: python code/o3_qdifference_uniqueness_reference.py

      - name: Run O3 self-similar continuum control
        run: python code/o3_self_similar_continuum_reference.py

      - name: Check recovery and current hard-origin authority
        run: |
          test -s recovery/CURRENT_BENCHMARK_FRONT.md
          test -s recovery/state.json
          test -s recovery/CANDIDATE_GRAVITY_RESEARCH_HANDOFF.md
          test -s recovery/RESTORE_FROM_NEW_CHAT.md
          test -s recovery/PROVENANCE_CORRECTION_POST116_ID_COLLISION.md
          for i in $(seq -w 99 134); do test -s recovery/RECOVERY_DELTA_${i}.md; done
          test -s protocol/READINESS_METRICS.md
          test -s protocol/P4_FUNCTIONAL_FREEDOM_NO_GO.md
          test -s protocol/CANDIDATE_GRAVITY_CONSTRUCTION_PLAYBOOK.md
          test -s protocol/P4_SAME_FACTORIZATION_CONTACT_DIFFERENCE_THEOREM.md
          test -s protocol/P4_STANDARD_UNITARITY_NEW_CUT_ATTRIBUTION_GATE.md
          test -s protocol/P4_ENTIRE_POLYNOMIAL_BOUNDED_COLLAPSE_GATE.md
          test -s protocol/P4_HADAMARD_ENTIRE_HARD_DATA_GATE.md
          test -s protocol/P4_CELESTIAL_ASSOCIATIVITY_MULTIPARTICLE_COMPLETION_GATE.md
          test -s protocol/P4_ENTIRE_HERGLOTZ_INTERSECTION_NO_GO.md
          test -s protocol/P4_ELASTIC_INNER_CDD_ORIGIN_DATA_GATE.md
          test -s protocol/P4_MHV_GRAVITY_HIDDEN_ZERO_RIGIDITY_CONTROL.md
          test -s protocol/P4_HIDDEN_ZERO_CROSS_ORDER_NONUNIQUENESS_GATE.md
          test -s protocol/P4_HIDDEN_ZERO_DEGREE_GROWTH_ORIGIN_GATE.md
          test -s protocol/P4_BCFW_INFINITY_BOUNDARY_ORIGIN_DATA_GATE.md
          test -s protocol/P4_BOUNDARY_AT_INFINITY_ORIGIN_DATA_GATE.md
          test -s protocol/P4_EIKONAL_CAUSALITY_SELECTOR_LIMIT_GATE.md
          test -s protocol/P4_MULTI_SHIFT_CONTACT_NULLSPACE_GATE.md
          test -s protocol/P4_LORENTZIAN_CONTOUR_THIMBLE_ORIGIN_GATE.md
          test -s protocol/P4_RESURGENT_TRANSSERIES_PARAMETER_ORIGIN_GATE.md
          test -s protocol/P4_ZERO_RETARDED_CROSSREP_CONTACT_NULLSPACE_GATE.md
          test -s protocol/P4_GR_BONUS_SCALING_CONSTRUCTIBILITY_CONTROL.md
          test -s protocol/P4_FINITE_SPECTRAL_MOMENT_NONUNIQUENESS_GATE.md
          test -s protocol/P4_LINEAR_MOMENT_RECURRENCE_ATOMIC_COLLAPSE_GATE.md
          test -s protocol/P4_NONLINEAR_MOMENT_RECURSION_RANDOM_MATRIX_CONTROL.md
          test -s protocol/FRESH_AS_INTERACTING_VERTEX_GENERATOR_COMPARATOR_2026.md
          test -s protocol/O4_PROCESS_MATRIX_GRAVITY_ATTRIBUTION_UNIQUENESS_GATE.md
          test -s protocol/P4_PRINCIPAL_SYMBOL_EQUIVALENCE_OPERATOR_NONUNIQUENESS_GATE.md
          test -s protocol/P5_DETECTOR_VISIBLE_RESIDUAL_PHYSICAL_COVARIANCE_GATE.md
          test -s candidate_synthesis/SYNTHESIS_007_CAUSAL_DIAMOND_ENTANGLEMENT_EQUILIBRIUM.md
          test -s candidate_synthesis/SYNTHESIS_008_ANOMALY_FREE_REFOLIATION_ALGEBRA.md
          test -s candidate_synthesis/SYNTHESIS_009_INFINITY_BOUNDARY_RECURSIVE_PARENT.md
          test -s candidate_synthesis/SYNTHESIS_010_BLACK_HOLE_ENTROPY_S_MATRIX_PARENT.md
          test -s candidate_synthesis/SYNTHESIS_011_ALL_DEFORMATION_BOUNDARY_CONSISTENCY.md
          test -s candidate_synthesis/SYNTHESIS_012_COMPLEX_GROWTH_MINIMALITY_SELECTOR.md
          test -s candidate_synthesis/SYNTHESIS_013_BLACK_HOLE_ENTROPY_DENSITY_PARENT.md
          test -s candidate_synthesis/SYNTHESIS_014_BLACK_HOLE_ETH_MATRIX_PARENT.md
          test -s candidate_synthesis/SYNTHESIS_015_BLACK_HOLE_ETH_KMS_PARENT.md
          test -s candidate_synthesis/SYNTHESIS_016_BLACK_HOLE_MONODROMY_SPECTRAL_PARENT.md
          test -s candidate_synthesis/SYNTHESIS_017_QUANTUM_CORNER_STATE_LAW_PARENT.md
          test -s candidate_synthesis/SYNTHESIS_018_SPECTRAL_DETERMINANT_ALL_VERTEX_PARENT.md
          test -s external_rqir_checks/iter675_prerequisite_exhaustion_audit.md
          test -s external_rqir_checks/iter133_rqir_programme_paper3_physical_psd_sync.md
