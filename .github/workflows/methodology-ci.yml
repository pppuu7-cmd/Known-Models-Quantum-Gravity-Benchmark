name: methodology-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact action implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 line

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 line
        with:
          python-version: '3.12.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install hashed dependency lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Verify dependency environment
        run: |
          python -m pip check
          python - <<'PY'
          import importlib.metadata as m
          import json
          from pathlib import Path
          lock = json.loads(Path('reproducibility/ENVIRONMENT_LOCK.json').read_text())
          for name, expected in lock['packages'].items():
              observed = m.version(name)
              if observed != expected:
                  raise SystemExit(f'{name}: {observed} != {expected}')
          print('locked_package_versions=PASS')
          PY

      - name: Compile reference code
        run: python -m compileall -q code

      - name: Validate all JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('.').rglob('*.json'))
          if not paths:
              raise SystemExit('No JSON files found')
          for path in paths:
              try:
                  with path.open('r', encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as exc:
                  raise SystemExit(f'INVALID_JSON path={path}: {exc}') from exc
          print(f'validated_json_files={len(paths)}')
          PY

      - name: Validate executable methodology registry and shard partition
        run: |
          python code/methodology_orchestrator.py --validate-only
          for shard in 0 1 2 3; do
            python code/methodology_orchestrator.py --validate-only --shard-index "$shard" --shard-count 4
          done

  methodology-shards:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout exact action implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 line

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 line
        with:
          python-version: '3.12.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install hashed dependency lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Run deterministic methodology shard ${{ matrix.shard }}/4
        run: >-
          python code/methodology_orchestrator.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4
          --summary build/shard-${{ matrix.shard }}.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4 line
        with:
          name: kmqgb-methodology-shard-${{ matrix.shard }}
          path: build/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  aggregate-and-bundle:
    needs: [preflight, methodology-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact action implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 line

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 line
        with:
          python-version: '3.12.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install hashed dependency lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Download all methodology shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned v4 line
        with:
          pattern: kmqgb-methodology-shard-*
          path: build/shards
          merge-multiple: true

      - name: Merge shards fail-closed in canonical registry order
        run: python code/merge_methodology_shards.py --input-dir build/shards --expected-shards 4

      - name: Validate repository completion against independent 100-percent score
        run: python code/repository_completion_validator.py --require-100

      - name: Build deterministic reproducibility bundle
        run: python code/build_release_bundle.py --verify-deterministic

      - name: Check recovery and frozen-core Paper IV authority
        run: |
          test -s recovery/CURRENT_BENCHMARK_FRONT.md
          test -s recovery/state.json
          test -s recovery/CANDIDATE_GRAVITY_RESEARCH_HANDOFF.md
          test -s recovery/RESTORE_FROM_NEW_CHAT.md
          test -s recovery/PROVENANCE_CORRECTION_POST116_ID_COLLISION.md
          test -s recovery/PROVENANCE_CORRECTION_ITER174_CONCURRENT_COLLISION.md
          for i in $(seq -w 99 180); do test -s recovery/RECOVERY_DELTA_${i}.md; done
          test -s protocol/READINESS_METRICS.md
          test -s protocol/READINESS_100_COMPLETION_CONTRACT.md
          test -s protocol/READINESS_RUBRIC_V2.json
          test -s protocol/RQIR_CORE_V1_BENCHMARK_FIREWALL.md
          test -s protocol/PAPER_IV_SAME_REALIZATION_COMPOSITION_GATE.md
          test -s protocol/BEYOND_C5_PARENT_PRINCIPLE_DECISION_PROCEDURE.md
          test -s protocol/EXECUTABLE_TEST_REGISTRY.json
          test -s schemas/candidate_gravity_record_v1_3.schema.json
          test -s templates/candidate_gravity_record_v1_3.template.json
          test -s publication/KMQGB_METHODS_EVIDENCE_MATRIX.md
          test -s publication/claim_evidence_matrix.json
          test -s requirements-ci.txt
          test -s reproducibility/ENVIRONMENT_LOCK.json
          test -s release/BUNDLE_CONTENTS.json
          test -s release/RELEASE_VERSION
          test -s .github/workflows/release.yml
          test -s .github/CODEOWNERS
          test -s LICENSE
          test -s CITATION.cff
          test -s SECURITY.md
          test -s paper_iv/PAPER_IV_FROZEN_CORE_DECISION_LEDGER.md
          test -s paper_iv/PAPER_IV_FROZEN_CORE_DECISION_LEDGER.json
          test -s post_freeze_paper_iv_wave_01/README.md
          test -s post_freeze_paper_iv_closure_wave_02/README.md
          for d in PF1_01_CFS PF1_02_GR_EFT PF1_03_STRING_DUAL_RESONANCE PF1_04_LQG_SPINFOAM PF1_05_ASYMPTOTIC_SAFETY; do
            test -s post_freeze_paper_iv_wave_01/$d/audit.md
            test -s post_freeze_paper_iv_wave_01/$d/result.json
          done
          test -s paper_iv/O_AS_SCALAR_SCATTERING_CLOSURE_AUDIT_2026.md
          test -s paper_iv/O_AS_CROSS_AUTHORITY_COMPOSITION_GATE_2026.md
          test -s paper_iv/O_AS_CONTACT_REALIZATION_MISMATCH_DIAGNOSTIC_2026.md
          test -s paper_iv/O_AS_CONTACT_PUBLICATION_AUTHORITY_REFRESH_2026-09-10.md
          test -s paper_iv/O_LQG_SAME_REALIZATION_AREA_METRIC_BRIDGE_LADDER_2026.md
          test -s paper_iv/O_LQG_GAMMA_DUALITY_RG_TANGENCY_GATE_2026.md
          test -s paper_iv/O_LQG_AREA_METRIC_BIREFRINGENCE_GAMMA_IDENTIFIABILITY_GATE_2026.md
          test -s paper_iv/O_LQG_MULTISCALE_OBSERVABLE_RG_TRANSPORT_GATE_2026.md
          test -s code/schema_validation.py
          test -s code/readiness_score.py
          test -s code/kg_candidate_record_v13_validator.py
          test -s code/methodology_orchestrator.py
          test -s code/merge_methodology_shards.py
          test -s code/repository_completion_validator.py
          test -s code/build_release_bundle.py
          test -s paper_iv/O_CFS_GEOMETRIC_CORRECTION_GENERATOR_AUDIT_2026.md
          test -s external_rqir_checks/iter675_prerequisite_exhaustion_audit.md
          test -s external_rqir_checks/iter143_rqir_paper3_detector_campaign80_sync.md

      - name: Upload KMQGB reproducibility bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4 line
        with:
          name: kmqgb-reproducibility-bundle
          path: |
            build/kmqgb-reproducibility-bundle.zip
            build/methodology_orchestrator_summary.json
          if-no-files-found: error
          retention-days: 90
