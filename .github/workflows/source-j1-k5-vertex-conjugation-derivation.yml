name: source-j1-k5-vertex-conjugation-derivation

on:
  push:
    paths:
      - 'research/SOURCE_J1_K5_VERTEX_LEVEL_CONJUGATION_DERIVATION_COUNTERTERM_PREREG_2026-09-15.md'
      - 'code/source_j1_k5_vertex_conjugation_derivation_certificate.py'
      - '.github/workflows/source-j1-k5-vertex-conjugation-derivation.yml'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen prereg and source blobs
        shell: bash
        run: |
          set -euo pipefail
          PREREG=93f03b5f1458ad49f80065c959e596c0ac19039a
          git merge-base --is-ancestor "$PREREG" HEAD
          test "$(git rev-parse HEAD:research/SOURCE_J1_K5_PUBLISHED_IEPSILON_SCOPE_RESULT_2026-09-15.md)" = "9a5531b6dbecc367c2869c6e9d873071a6444a66"
          test "$(git rev-parse HEAD:research/SOURCE_J1_K5_CAUSAL_COCAUSAL_CONJUGATION_AMBIGUITY_PREREG_2026-09-15.md)" = "de8916bb0444d54249ffa7ffc33553ff39d5db0f"
          test "$(git rev-parse HEAD:research/SOURCE_J1_K5_VERTEX_LEVEL_CONJUGATION_AUTHORITY_RESULT_2026-09-15.md)" = "839f0ed038b60eb73dfbdc4738872d13fea2a352"
          test "$(git rev-parse HEAD:recovery/CRITICAL_REVIEW_SOURCE_J1_K5_VERTEX_LEVEL_CONJUGATION_AUTHORITY_2026-09-15.md)" = "87a95edccb41ca2115ad0918b590d948bf4b9338"
          test "$(git rev-parse HEAD:code/iter456_reduced_toller_appendixb.py)" = "9626d52307763bc84c348110ed26db4a2b57b211"
          test "$(git rev-parse HEAD:code/iter457_toller_eq7_magnetic_reconstruction.py)" = "23d7108cd697012b2d9bb9ce3b2651d36b561e2b"
          echo "source-lock PASS at $(git rev-parse HEAD)"

  certificate:
    needs: source-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen computation dependencies
        run: pip install 'mpmath==1.3.0' 'sympy==1.14.0'
      - name: Run prospective derivation certificate
        run: |
          mkdir -p artifacts
          python code/source_j1_k5_vertex_conjugation_derivation_certificate.py \
            --repo-root . \
            --out artifacts/source_j1_k5_vertex_conjugation_derivation.json
      - name: Upload canonical certificate
        uses: actions/upload-artifact@v4
        with:
          name: source-j1-k5-vertex-conjugation-derivation
          path: artifacts/source_j1_k5_vertex_conjugation_derivation.json
          if-no-files-found: error
