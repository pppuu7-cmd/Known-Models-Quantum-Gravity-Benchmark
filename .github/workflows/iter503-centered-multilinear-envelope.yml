name: iter503-centered-multilinear-envelope
on:
  push:
    branches: [research/iter503-centered-multilinear-envelope]
    paths:
      - 'recovery/ITER503_PREREG_CENTERED_MULTILINEAR_ENVELOPE_METHOD_2026-09-14.md'
      - 'code/iter503_centered_multilinear_envelope.py'
      - 'code/iter503_aggregate.py'
      - '.github/workflows/iter503-centered-multilinear-envelope.yml'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authority and scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('recovery/ITER503_PREREG_CENTERED_MULTILINEAR_ENVELOPE_METHOD_2026-09-14.md').read_text().lower()
          assert 'prospectively frozen before iter503 implementation' in p
          assert 'no further subdivision' in p
          assert 'same 243 intertwiner channels' in p
          assert 'no unique maximizing channel is assumed' in p
          assert 'iter503_centered_multilinear_method_qualified_scoped' in p
          assert 'iter503_centered_multilinear_method_insufficient_scoped' in p
          assert 'infrastructure_or_validation_fail_iter503' in p
          assert 'no iter503 outcome is a nondecay/decay science classification' in p
          assert 'candidate gravity activation is authorized' not in p
          PY

  lane:
    needs: source-lock
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        causal: [0to5, 1to4, 2to3]
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
          python - <<'PY'
          import flint
          assert flint.__version__ == '0.9.0'
          PY
      - name: Run frozen centered multilinear method diagnostic
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter503_centered_multilinear_envelope.py --causal '${{ matrix.causal }}' --out 'artifacts/iter503-${{ matrix.causal }}-b0.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter503-${{ matrix.causal }}-b0
          path: artifacts/iter503-${{ matrix.causal }}-b0.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter503-*
          path: downloaded
      - name: Aggregate frozen method verdict
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter503_aggregate.py --root downloaded --out artifacts/iter503-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter503-summary
          path: artifacts/iter503-summary.json
          if-no-files-found: error
