name: rqcp-cutoff-extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rqcp-cutoff-extension.yml'

permissions:
  contents: read

jobs:
  cutoff-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cutoff: [18, 20, 24, 28]
    steps:
      - name: Checkout exact KMQGB revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install hashed numerical environment
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Compute cutoff ${{ matrix.cutoff }}
        run: >-
          python code/rqcp_cutoff_robustness_probe.py
          --cutoff '${{ matrix.cutoff }}'
          --output build/cutoff-extension/cutoff-${{ matrix.cutoff }}.json

      - name: Upload cutoff result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rqcp-cutoff-extension-${{ matrix.cutoff }}
          path: build/cutoff-extension/cutoff-${{ matrix.cutoff }}.json
          if-no-files-found: error
          retention-days: 30
