name: paper-iv-iter412-416-parallel-source-closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_iv/SOURCE_GROUNDED_CLOSURE_AUTHORITY_ITER412_416.json'
      - 'code/iter412_416_parallel_source_closure.py'
      - '.github/workflows/paper-iv-iter412-416-parallel-source-closure.yml'

permissions:
  contents: read

jobs:
  lqg-toller-hypergeometric:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        gamma: ['0.1','0.5','1.0','2.0','5.0']
        j: ['0.5','1.0','1.5','2.0','3.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter412
          python code/iter412_416_parallel_source_closure.py --mode lqg --gamma '${{ matrix.gamma }}' --j '${{ matrix.j }}' --output 'build/iter412/lqg-g${{ matrix.gamma }}-j${{ matrix.j }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter412-lqg-g${{ matrix.gamma }}-j${{ matrix.j }}
          path: build/iter412/lqg-g${{ matrix.gamma }}-j${{ matrix.j }}.json
          if-no-files-found: error
          retention-days: 90

  cfs-delta3plus-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        x: ['0.1','0.03','0.01','0.003','0.001']
        B: ['1.0','10.0','100.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter413
          python code/iter412_416_parallel_source_closure.py --mode cfs --delta-over-L '${{ matrix.x }}' --B '${{ matrix.B }}' --output 'build/iter413/cfs-x${{ matrix.x }}-B${{ matrix.B }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter413-cfs-x${{ matrix.x }}-B${{ matrix.B }}
          path: build/iter413/cfs-x${{ matrix.x }}-B${{ matrix.B }}.json
          if-no-files-found: error
          retention-days: 90

  as-spectral-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cutoff: ['5','10','30','100','1000','1e6','1e12','1e24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter414
          python code/iter412_416_parallel_source_closure.py --mode as-tail --cutoff '${{ matrix.cutoff }}' --output 'build/iter414/as-tail-${{ matrix.cutoff }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter414-as-tail-${{ matrix.cutoff }}
          path: build/iter414/as-tail-${{ matrix.cutoff }}.json
          if-no-files-found: error
          retention-days: 90

  source-constant-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter415
          python code/iter412_416_parallel_source_closure.py --mode source-guard --output build/iter415/source-guard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter415-source-guard
          path: build/iter415/source-guard.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [lqg-toller-hypergeometric, cfs-delta3plus-envelope, as-spectral-tail, source-constant-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'iter41*-*'
          path: build/iter412-415-results
          merge-multiple: true
      - run: python code/iter412_416_parallel_source_closure.py --mode aggregate --input-dir build/iter412-415-results --output iter412-416-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter412-416-summary
          path: iter412-416-summary.json
          if-no-files-found: error
          retention-days: 90
