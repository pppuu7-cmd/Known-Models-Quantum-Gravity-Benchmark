name: lqg-iter453-eq4-contraction-topology

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/lqg-iter453-eq4-contraction-topology.yml'
      - 'scripts/iter453_eq4_contraction_topology.py'
      - 'prereg/ITER453_EQ4_CONTRACTION_TOPOLOGY_QUALIFICATION.md'
  workflow_dispatch:

jobs:
  topology-lane:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [17, 29, 43, 71]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Frozen Iter453 lane
        run: |
          mkdir -p out
          python scripts/iter453_eq4_contraction_topology.py \
            --seed '${{ matrix.seed }}' \
            --out 'out/seed_${{ matrix.seed }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter453-seed-${{ matrix.seed }}
          path: out/seed_${{ matrix.seed }}.json
          if-no-files-found: error

  aggregate:
    needs: topology-lane
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: iter453-seed-*
          path: lane-artifacts
          merge-multiple: true
      - name: Frozen Iter453 aggregate
        run: |
          mkdir -p out
          python scripts/iter453_eq4_contraction_topology.py \
            --aggregate \
              lane-artifacts/seed_17.json \
              lane-artifacts/seed_29.json \
              lane-artifacts/seed_43.json \
              lane-artifacts/seed_71.json \
            --out out/iter453_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter453-eq4-contraction-topology-summary
          path: out/iter453_summary.json
          if-no-files-found: error
