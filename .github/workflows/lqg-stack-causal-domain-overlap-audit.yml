name: lqg-stack-causal-domain-overlap-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter295_stack_causal_domain_overlap.json'
      - '.github/workflows/lqg-stack-causal-domain-overlap-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [formalism_overlap, domain_scope, k5_exact_witness, transport_guard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter295
          python - <<'PY'
          import itertools, json, pathlib
          p=json.load(open('benchmarks/lqg_iter295_stack_causal_domain_overlap.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'

          def gf2_rank(a):
              a=[row[:] for row in a]
              if not a: return 0
              m,n=len(a),len(a[0]); r=0
              for col in range(n):
                  pivot=next((i for i in range(r,m) if a[i][col]&1),None)
                  if pivot is None: continue
                  a[r],a[pivot]=a[pivot],a[r]
                  for i in range(m):
                      if i!=r and (a[i][col]&1):
                          a[i]=[(x^y) for x,y in zip(a[i],a[r])]
                  r+=1
              return r

          details={}
          if g=='formalism_overlap':
              ok=(c['han_stack_members_are_generalized_eprl_on_2_complexes_using_kkl'] and
                  c['beltran_causal_model_is_generalized_eprl_kkl_on_arbitrary_2_complex'] and
                  c['shared_per_complex_formalism']=='GENERALIZED_EPRL_KKL')
          elif g=='domain_scope':
              ok=(c['han_five_valent_root_vertex_is_dual_to_4_simplex'] and
                  c['beltran_requires_time_oriented_working_scope'] and
                  c['beltran_assumes_timelike_edges_in_remainder'] and
                  c['beltran_requires_each_vertex_boundary_graph_3_link_connected'] and
                  c['conditional_common_domain_nonempty'] and
                  not c['universal_han_stack_inclusion_in_beltran_working_domain'])
          elif g=='k5_exact_witness':
              n=5
              edges=list(itertools.combinations(range(n),2))
              A=[[int(i in e) for i in range(n)] for e in edges]
              rank=gf2_rank(A)
              x=[0,1,0,1,0]
              k=[sum(row[j]*x[j] for j in range(n))%2 for row in A]
              xflip=[v^1 for v in x]
              kflip=[sum(row[j]*xflip[j] for j in range(n))%2 for row in A]
              def connected_after_removed(rem):
                  adj={i:set() for i in range(n)}
                  for idx,(u,v) in enumerate(edges):
                      if idx not in rem:
                          adj[u].add(v); adj[v].add(u)
                  seen={0}; stack=[0]
                  while stack:
                      u=stack.pop()
                      for v in adj[u]-seen:
                          seen.add(v); stack.append(v)
                  return len(seen)==n
              all_two_cuts_connected=all(connected_after_removed(set(rem)) for rem in itertools.combinations(range(len(edges)),2))
              one_cuts=all(connected_after_removed({i}) for i in range(len(edges)))
              ok=(len(edges)==10 and rank==4 and k==kflip and all_two_cuts_connected and one_cuts and
                  c['beltran_five_valent_causality_matrix_is_k5_incidence_over_gf2'])
              details={'nodes':n,'edges':len(edges),'gf2_rank':rank,'kernel_dimension':n-rank,
                       'global_flip_same_wedge_orientation':k==kflip,
                       'all_one_link_cuts_connected':one_cuts,
                       'all_two_link_cuts_connected':all_two_cuts_connected,
                       'sample_edge_orientation_bits':x,'sample_wedge_bits':k}
          elif g=='transport_guard':
              ok=(not c['explicit_causal_vertex_lift_through_han_stack_sum'] and
                  not c['explicit_lambda_f_face_multiplicity_transport'] and
                  not c['explicit_same_realization_uv_to_ir_parameter_transport'] and
                  not c['normalized_same_realization_observable_comparator_error_certificate'] and
                  not c['family_terminal'] and not c['d7_authorized'])
          else:
              raise SystemExit(2)
          out={'guard':g,'pass':bool(ok),'iteration':p['iteration'],'details':details,
               'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter295/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter295-${{ matrix.guard }}
          path: build/lqg-iter295/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter295-*
          path: build/lqg-iter295-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=sorted(pathlib.Path('build/lqg-iter295-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          p=json.load(open('benchmarks/lqg_iter295_stack_causal_domain_overlap.json'))
          k5=next(x for x in rows if x['guard']=='k5_exact_witness')['details']
          out={
            'iteration':295,
            'independent_guards':len(rows),
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'shared_generalized_eprl_kkl_per_complex_formalism':True,
            'conditional_common_domain_nonempty':True,
            'k5_exact_witness':k5,
            'universal_han_stack_inclusion_ready':False,
            'causal_vertex_lift_through_han_stack_sum_ready':False,
            'lambda_f_face_multiplicity_transport_ready':False,
            'complete_stack_same_realization_uv_ir_transport_ready':False,
            'normalized_observable_comparator_error_ready':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter295-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter295-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter295-summary
          path: |
            build/lqg-iter295-summary.json
            build/lqg-iter295-summary.sha256
          if-no-files-found: error
          retention-days: 90
