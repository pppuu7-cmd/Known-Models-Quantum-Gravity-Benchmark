name: lqg-s5-so3-invariant-counterterms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter323_*.py'
      - '.github/workflows/lqg-s5-so3-invariant-counterterms.yml'

permissions:
  contents: read

jobs:
  stratum:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        size: [3,4,5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/lqg-iter323
          python code/lqg_iter323_s5_so3_invariants.py --size ${{ matrix.size }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter323-K${{ matrix.size }}
          path: build/lqg-iter323/K${{ matrix.size }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: stratum
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter323-K*
          path: build/lqg-iter323-results
          merge-multiple: true
      - run: python code/lqg_iter323_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter323-summary
          path: build/lqg-iter323-summary.json
          if-no-files-found: error
          retention-days: 90
