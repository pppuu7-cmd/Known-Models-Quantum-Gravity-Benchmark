name: lqg-semiclassical-hierarchy-overlap-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_semiclassical_hierarchy_probe.py'
      - 'code/lqg_semiclassical_hierarchy_aggregate.py'
      - '.github/workflows/lqg-semiclassical-hierarchy-overlap-audit.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        separation: [2, 3, 5, 10]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent hierarchy sensitivity probe
        run: python code/lqg_semiclassical_hierarchy_probe.py --separation ${{ matrix.separation }} --output build/hierarchy/R${{ matrix.separation }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchy-R${{ matrix.separation }}
          path: build/hierarchy/R${{ matrix.separation }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hierarchy-R*
          path: build/hierarchy-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_semiclassical_hierarchy_aggregate.py --input-dir build/hierarchy-results --output build/lqg-hierarchy-iter288-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-hierarchy-iter288-summary
          path: build/lqg-hierarchy-iter288-summary.json
          if-no-files-found: error
          retention-days: 90
