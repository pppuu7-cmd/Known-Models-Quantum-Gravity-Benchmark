name: rqcp-scoped-robustness-probes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/rqcp_fixed_band_probe_common.py'
      - 'code/rqcp_cutoff_robustness_probe.py'
      - 'code/rqcp_quartic_robustness_probe.py'
      - 'code/rqcp_mixed_response_step_probe.py'
      - 'code/rqcp_robustness_probe_aggregate.py'
      - '.github/workflows/rqcp-scoped-robustness-probes.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {label: cutoff-4, script: rqcp_cutoff_robustness_probe.py, arg: cutoff, value: '4'}
          - {label: cutoff-6, script: rqcp_cutoff_robustness_probe.py, arg: cutoff, value: '6'}
          - {label: cutoff-8, script: rqcp_cutoff_robustness_probe.py, arg: cutoff, value: '8'}
          - {label: cutoff-10, script: rqcp_cutoff_robustness_probe.py, arg: cutoff, value: '10'}
          - {label: cutoff-12, script: rqcp_cutoff_robustness_probe.py, arg: cutoff, value: '12'}
          - {label: cutoff-14, script: rqcp_cutoff_robustness_probe.py, arg: cutoff, value: '14'}
          - {label: cutoff-16, script: rqcp_cutoff_robustness_probe.py, arg: cutoff, value: '16'}
          - {label: quartic-0, script: rqcp_quartic_robustness_probe.py, arg: factor, value: '0'}
          - {label: quartic-050, script: rqcp_quartic_robustness_probe.py, arg: factor, value: '0.5'}
          - {label: quartic-075, script: rqcp_quartic_robustness_probe.py, arg: factor, value: '0.75'}
          - {label: quartic-100, script: rqcp_quartic_robustness_probe.py, arg: factor, value: '1.0'}
          - {label: quartic-125, script: rqcp_quartic_robustness_probe.py, arg: factor, value: '1.25'}
          - {label: quartic-150, script: rqcp_quartic_robustness_probe.py, arg: factor, value: '1.5'}
          - {label: quartic-200, script: rqcp_quartic_robustness_probe.py, arg: factor, value: '2.0'}
          - {label: step-00005, script: rqcp_mixed_response_step_probe.py, arg: sigma-step, value: '0.0005'}
          - {label: step-0001, script: rqcp_mixed_response_step_probe.py, arg: sigma-step, value: '0.001'}
          - {label: step-0002, script: rqcp_mixed_response_step_probe.py, arg: sigma-step, value: '0.002'}
          - {label: step-0005, script: rqcp_mixed_response_step_probe.py, arg: sigma-step, value: '0.005'}
          - {label: step-001, script: rqcp_mixed_response_step_probe.py, arg: sigma-step, value: '0.01'}
    steps:
      - name: Checkout exact KMQGB revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install hashed numerical environment
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Run independent probe ${{ matrix.label }}
        run: >-
          python code/${{ matrix.script }}
          --${{ matrix.arg }} '${{ matrix.value }}'
          --output build/probes/${{ matrix.label }}.json

      - name: Upload probe result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rqcp-probe-${{ matrix.label }}
          path: build/probes/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact KMQGB revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install hashed numerical environment
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Download all independent probe results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rqcp-probe-*
          path: build/probe-results
          merge-multiple: true

      - name: Aggregate without family-level promotion
        run: >-
          python code/rqcp_robustness_probe_aggregate.py
          --input build/probe-results
          --output build/rqcp-scoped-robustness-summary.json

      - name: Upload aggregate result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rqcp-scoped-robustness-summary
          path: build/rqcp-scoped-robustness-summary.json
          if-no-files-found: error
          retention-days: 90
