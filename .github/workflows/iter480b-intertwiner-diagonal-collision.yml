name: iter480b-intertwiner-diagonal-collision

on:
  push:
    branches: [ main ]
    paths:
      - 'code/iter480b_intertwiner_diagonal_collision.py'
      - 'recovery/ITER480B_PREREG_INTERTWINER_DIAGONAL_COLLISION_2026-09-13.md'
      - '.github/workflows/iter480b-intertwiner-diagonal-collision.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        gamma: [7, 8]
        causal: [0to5, 1to4, 2to3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 mpmath==1.3.0 sympy==1.13.3
      - name: Run frozen Iter480B lane
        env:
          ITER480B_GAMMA: ${{ matrix.gamma }}
          ITER480B_CLASS: ${{ matrix.causal }}
        run: python code/iter480b_intertwiner_diagonal_collision.py
      - name: Upload raw scientific lane artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter480b-g${{ matrix.gamma }}-${{ matrix.causal }}
          path: artifacts/iter480b-g${{ matrix.gamma }}-${{ matrix.causal }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter480b-*
          path: collected
          merge-multiple: false
      - name: Frozen aggregate classifier
        run: |
          python - <<'PY'
          import json, pathlib, sys
          files=sorted(pathlib.Path('collected').glob('**/*.json'))
          rows=[json.loads(p.read_text()) for p in files]
          expected={(g,c) for g in (7,8) for c in ('0to5','1to4','2to3')}
          seen={(r['panel']['gamma'],r['panel']['causal_representative']) for r in rows}
          complete=(seen==expected and len(rows)==6)
          passes=complete and all(r.get('scientific_pass') is True for r in rows)
          out={
            'iteration':'480B','lane_count':len(rows),'complete_expected_panel':complete,
            'all_lane_scientific_pass':passes,
            'classification': 'ITER480B_SOURCE_INTERTWINER_CONTRACTION_NONZERO_WITNESS_SCOPED' if passes else 'FAIL_ITER480B_SOURCE_INTERTWINER_CONTRACTION',
            'lanes':[{'lane':r.get('lane'),'scientific_pass':r.get('scientific_pass'),'max_ratio':r.get('panel',{}).get('max_ratio'),'nonzero_witnesses':r.get('panel',{}).get('nonzero_witnesses')} for r in rows],
            'scope':'aggregate only for frozen j=1 diagonal-collision boundary-intertwiner diagnostic; D7-S2/S3/S4 remain open'
          }
          pathlib.Path('iter480b-aggregate.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          sys.exit(0 if passes else 2)
          PY
      - name: Upload frozen aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter480b-aggregate
          path: iter480b-aggregate.json
          if-no-files-found: error
