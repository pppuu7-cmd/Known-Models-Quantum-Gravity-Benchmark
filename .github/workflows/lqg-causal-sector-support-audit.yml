name: lqg-causal-sector-support-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter301_causal_sector_support.json'
      - '.github/workflows/lqg-causal-sector-support-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [source_contract, connected_graph_theorem, k5_exact_enumeration, scope_boundary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter301
          python - <<'PY'
          import itertools, json, pathlib
          p=json.load(open('benchmarks/lqg_iter301_causal_sector_support.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'; details={}
          def induced(sig, edges):
              return tuple(sig[a]*sig[b] for a,b in edges)
          def connected(n, edges):
              adj=[set() for _ in range(n)]
              for a,b in edges: adj[a].add(b); adj[b].add(a)
              seen={0}; stack=[0]
              while stack:
                  x=stack.pop()
                  for y in adj[x]:
                      if y not in seen: seen.add(y); stack.append(y)
              return len(seen)==n
          if g=='source_contract':
              ok=(c['connected_graph_sigma_to_edge_sign_map_has_global_flip_kernel'] and
                  c['induced_edge_signs_obey_positive_cycle_product'] and
                  c['this_is_not_a_no_go_for_causal_spinfoams'])
              details={'sigma_values':[-1,1],'kappa_rule':'kappa_ab=sigma_a*sigma_b','comparison':'T(+)+T(-)=D'}
          elif g=='connected_graph_theorem':
              checks=0
              # Exhaust all connected simple graphs n=2..5. For each, verify image size 2^(V-1).
              for n in range(2,6):
                  all_edges=[(i,j) for i in range(n) for j in range(i+1,n)]
                  for mask in range(1,1<<len(all_edges)):
                      edges=[e for k,e in enumerate(all_edges) if (mask>>k)&1]
                      if not connected(n,edges): continue
                      image={induced(sig,edges) for sig in itertools.product((-1,1), repeat=n)}
                      if len(image)!=(1<<(n-1)):
                          raise SystemExit(f'image-size theorem failed n={n} edges={edges}')
                      checks += 1
              ok=(checks>0)
              details={'connected_graphs_checked':checks,'image_size_formula':'2^(V-1)','global_flip_kernel_size':2}
          elif g=='k5_exact_enumeration':
              n=5; edges=[(i,j) for i in range(n) for j in range(i+1,n)]
              image={induced(sig,edges) for sig in itertools.product((-1,1), repeat=n)}
              unrestricted=set(itertools.product((-1,1), repeat=len(edges)))
              # Triangle-cycle products characterize consistency on K5.
              def cycle_ok(k):
                  em={e:s for e,s in zip(edges,k)}
                  return all(em[(min(i,j),max(i,j))]*em[(min(j,l),max(j,l))]*em[(min(i,l),max(i,l))]==1
                             for i in range(n) for j in range(i+1,n) for l in range(j+1,n))
              cycle_set={k for k in unrestricted if cycle_ok(k)}
              ok=(len(image)==16 and len(unrestricted)==1024 and image==cycle_set)
              details={'k5_vertices':5,'k5_wedges':10,'sigma_induced_sectors':len(image),'unrestricted_wedge_sectors':len(unrestricted),'cycle_consistent_sectors':len(cycle_set),'strict_subset':image<unrestricted}
          elif g=='scope_boundary':
              ok=(c['generic_independent_monomial_reconstruction_of_full_D_product_from_only_sigma_induced_support_is_not_available'] and
                  c['source_specific_post_integration_identities_cancellations_or_extended_causal_sums_are_not_excluded'] and
                  not c['han_half_link_haar_glue_equivalence_proven'] and
                  not c['lambda_f_weighted_causal_stack_finiteness_normalization_cutoff_control_proven'] and
                  not c['same_realization_uv_to_causal_regge_gr_transport_proven'] and
                  not c['family_terminal'] and not c['d7_authorized'])
              details={'generic_support_mismatch_only':True,'no_no_go':True,'post_integration_relations_not_excluded':True,'han_glue_open':True,'stack_cutoff_open':True,'uv_ir_transport_open':True}
          else:
              raise SystemExit(2)
          out={'guard':g,'pass':bool(ok),'iteration':301,'details':details,'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter301/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter301-${{ matrix.guard }}
          path: build/lqg-iter301/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter301-*
          path: build/lqg-iter301-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=sorted(pathlib.Path('build/lqg-iter301-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          by={x['guard']:x for x in rows}; p=json.load(open('benchmarks/lqg_iter301_causal_sector_support.json'))
          out={
            'iteration':301,
            'independent_guards':4,
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'connected_graphs_checked':by['connected_graph_theorem']['details']['connected_graphs_checked'],
            'connected_graph_induced_sector_count_formula':'2^(V-1)',
            'k5_sigma_induced_causal_sectors':by['k5_exact_enumeration']['details']['sigma_induced_sectors'],
            'k5_unrestricted_toller_sign_sectors':by['k5_exact_enumeration']['details']['unrestricted_wedge_sectors'],
            'k5_cycle_consistent_equals_sigma_induced':True,
            'generic_full_D_product_recovery_from_sigma_induced_support_alone':False,
            'scientific_no_go_claim':False,
            'source_specific_post_integration_relations_or_extended_sums_excluded':False,
            'han_half_link_haar_glue_equivalence_proven':False,
            'causal_stack_finiteness_normalization_cutoff_control_proven':False,
            'same_realization_uv_to_regge_gr_transport_proven':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter301-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter301-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter301-summary
          path: |
            build/lqg-iter301-summary.json
            build/lqg-iter301-summary.sha256
          if-no-files-found: error
          retention-days: 90
