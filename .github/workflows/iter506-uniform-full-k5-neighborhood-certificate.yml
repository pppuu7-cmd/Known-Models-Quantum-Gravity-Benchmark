name: iter506-uniform-full-k5-neighborhood-certificate
on:
  push:
    branches: [research/iter506-uniform-full-k5-neighborhood-certificate]
    paths:
      - 'recovery/ITER506_PREREG_UNIFORM_FULL_K5_NEIGHBORHOOD_CERTIFICATE_2026-09-14.md'
      - 'code/iter506_uniform_full_k5_neighborhood_certificate.py'
      - 'code/iter506_aggregate.py'
      - '.github/workflows/iter506-uniform-full-k5-neighborhood-certificate.yml'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authority and scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('recovery/ITER506_PREREG_UNIFORM_FULL_K5_NEIGHBORHOOD_CERTIFICATE_2026-09-14.md').read_text().lower()
          assert 'prospectively frozen after consuming terminal iter505 and before any iter506 production evidence' in p
          assert 'eta in {1e-12, 1e-10, 1e-8, 1e-6}' in p
          assert '5e-3' in p and '1e-12' in p
          assert 'no-branch-sum' in p
          assert 'terminal d7 label' in p
          assert 'candidate gravity remains inactive' in p
          assert 'no post-hoc radius insertion or refinement is allowed' in p
          PY

  lane:
    needs: source-lock
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        panel: [T0, T1, T2]
        causal: [0to5, 1to4, 2to3]
        rho: [7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy
      - name: Run frozen analytic neighborhood lane
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter506_uniform_full_k5_neighborhood_certificate.py --panel '${{ matrix.panel }}' --causal '${{ matrix.causal }}' --rho '${{ matrix.rho }}' --out 'artifacts/iter506-${{ matrix.panel }}-${{ matrix.causal }}-rho${{ matrix.rho }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter506-${{ matrix.panel }}-${{ matrix.causal }}-rho${{ matrix.rho }}
          path: artifacts/iter506-${{ matrix.panel }}-${{ matrix.causal }}-rho${{ matrix.rho }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter506-*
          path: downloaded
      - name: Aggregate frozen Iter506 verdict
        env:
          PYTHONPATH: code
        run: |
          mkdir -p artifacts
          python code/iter506_aggregate.py --root downloaded --out artifacts/iter506-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter506-summary
          path: artifacts/iter506-summary.json
          if-no-files-found: error
