name: lqg-cplus-cminus-noncausal-cancellation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter314_cplus_cminus_noncausal_cancellation.json'
      - 'code/lqg_iter314_*.py'
      - '.github/workflows/lqg-cplus-cminus-noncausal-cancellation.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        probe:
          - cocausal_flip_rule
          - cminus_sign_sums
          - cplus_cminus_combined
          - noncausal_restoration
          - scope_guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Iter314 probe
        run: |
          mkdir -p build/lqg-iter314
          python code/lqg_iter314_${{ matrix.probe }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter314-${{ matrix.probe }}
          path: build/lqg-iter314/${{ matrix.probe }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter314-*
          path: build/lqg-iter314-results
          merge-multiple: true
      - run: python code/lqg_iter314_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter314-summary
          path: |
            build/lqg-iter314-summary.json
            build/lqg-iter314-summary.sha256
          if-no-files-found: error
          retention-days: 90
