name: iter471-k5-collision-strata-rescue
on:
  push:
    branches: [research/iter471-k5-collision-strata-rescue]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python code/iter471_k5_collision_strata_rescue.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter471-summary
          path: artifacts/iter471-summary.json
