name: lqg-generalized-causal-scope-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter293_generalized_causal_scope.json'
      - '.github/workflows/lqg-generalized-causal-scope-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [authority, generalized_scope, asymptotic_scope, transport_scope]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter293
          python - <<'PY'
          import json, os, pathlib
          p=json.load(open('benchmarks/lqg_iter293_generalized_causal_scope.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'
          checks={
            'authority': p['source']['arxiv']=='2603.22661' and p['source']['authority_level']=='PUBLIC_PREPRINT',
            'generalized_scope': c['generalized_model']=='EPRL-KKL' and c['arbitrary_2_complex_causal_structure_defined'] and c['orientation_consistency_criterion_1_to_2_skeleton'],
            'asymptotic_scope': c['causal_vertex_generalizes_bianchi_chen_gamonal'] and c['semiclassical_asymptotic_analysis_present'],
            'transport_scope': (not c['explicit_equivalence_to_han_spinfoam_stack']) and (not c['explicit_same_realization_uv_to_ir_parameter_transport']) and (not c['normalized_same_realization_observable_comparator_error_certificate']) and (not c['family_terminal']) and (not c['d7_authorized'])
          }
          ok=bool(checks[g])
          out={'guard':g,'pass':ok,'iteration':p['iteration'],'source':p['source'],'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter293/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter293-${{ matrix.guard }}
          path: build/lqg-iter293/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter293-*
          path: build/lqg-iter293-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          files=sorted(pathlib.Path('build/lqg-iter293-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          p=json.load(open('benchmarks/lqg_iter293_generalized_causal_scope.json'))
          out={
            'iteration':293,
            'independent_guards':len(rows),
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'generalized_causal_scope_positive':True,
            'explicit_han_stack_equivalence_ready':False,
            'complete_stack_same_realization_uv_ir_transport_ready':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter293-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter293-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter293-summary
          path: |
            build/lqg-iter293-summary.json
            build/lqg-iter293-summary.sha256
          if-no-files-found: error
          retention-days: 90
