name: paper-iv-iter374-378-iho-dqft-parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_iv/IHO_DQFT_PARITY_SOURCE_AUTHORITY_ITER374_378.json'
      - 'code/iho_dqft_iter374_378_parity.py'
      - 'code/iter374_378_aggregate.py'
      - '.github/workflows/paper-iv-iter374-378-iho-dqft-parity.yml'

permissions:
  contents: read

jobs:
  hankel-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        z: ['0.005','0.01','0.02','0.05','0.1','0.25','0.5','1.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - run: |
          mkdir -p build/iter374
          python code/iho_dqft_iter374_378_parity.py --mode kernel --z '${{ matrix.z }}' --output 'build/iter374/kernel-z${{ matrix.z }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter374-kernel-z${{ matrix.z }}
          path: build/iter374/*.json
          if-no-files-found: error
          retention-days: 90

  scalar-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        N: ['50','55','60']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - run: |
          mkdir -p build/iter375
          python code/iho_dqft_iter374_378_parity.py --mode scalar --N '${{ matrix.N }}' --output 'build/iter375/scalar-N${{ matrix.N }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter375-scalar-N${{ matrix.N }}
          path: build/iter375/*.json
          if-no-files-found: error
          retention-days: 90

  tensor-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        N: ['50','55','60']
        x: ['0','0.25','0.5','0.75']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - run: |
          mkdir -p build/iter376
          python code/iho_dqft_iter374_378_parity.py --mode tensor --N '${{ matrix.N }}' --x '${{ matrix.x }}' --output 'build/iter376/tensor-N${{ matrix.N }}-x${{ matrix.x }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter376-tensor-N${{ matrix.N }}-x${{ matrix.x }}
          path: build/iter376/*.json
          if-no-files-found: error
          retention-days: 90

  evidence-scope-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - run: |
          mkdir -p build/iter377
          python code/iho_dqft_iter374_378_parity.py --mode evidence --output build/iter377/evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter377-evidence-scope
          path: build/iter377/*.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [hankel-kernel, scalar-parity, tensor-parity, evidence-scope-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'iter37*'
          path: iter374-378-results
      - run: python code/iter374_378_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter374-378-summary
          path: iter374-378-summary.json
          if-no-files-found: error
          retention-days: 90
