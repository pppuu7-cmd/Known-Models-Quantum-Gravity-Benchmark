name: lqg-s5-forest-overlap-orbits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter321_*.py'
      - '.github/workflows/lqg-s5-forest-overlap-orbits.yml'

permissions:
  contents: read

jobs:
  orbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        case:
          - forest_empty
          - forest_single_k3
          - forest_single_k4
          - forest_single_k5
          - forest_pair_k3_k4
          - forest_pair_k3_k5
          - forest_pair_k4_k5
          - forest_triple_k3_k4_k5
          - overlap_k3_k3_i1
          - overlap_k3_k3_i2
          - overlap_k3_k4_i2
          - overlap_k4_k4_i3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/lqg-iter321
          python code/lqg_iter321_s5_orbit_probe.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter321-${{ matrix.case }}
          path: build/lqg-iter321/${{ matrix.case }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: orbit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter321-*
          path: build/lqg-iter321-results
          merge-multiple: true
      - run: python code/lqg_iter321_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter321-summary
          path: build/lqg-iter321-summary.json
          if-no-files-found: error
          retention-days: 90
