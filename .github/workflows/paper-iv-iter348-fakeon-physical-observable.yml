name: paper-iv-iter348-fakeon-physical-observable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'protocol/PAPER_IV_ITER348_FAKEON_QUADRATIC_TENSOR_PHYSICAL_OBSERVABLE_CONTRACT.json'
      - 'code/fakeon_iter348_*.py'
      - 'code/iter348_aggregate.py'
      - '.github/workflows/paper-iv-iter348-fakeon-physical-observable.yml'

permissions:
  contents: read

jobs:
  algebra-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python code/fakeon_iter348_ratio.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter348-algebra, path: iter348-ratio.json, if-no-files-found: error, retention-days: 90}
  decoupling-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python code/fakeon_iter348_decoupling.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter348-decoupling, path: iter348-decoupling.json, if-no-files-found: error, retention-days: 90}
  independent-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python code/fakeon_iter348_grid.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter348-grid, path: iter348-grid.json, if-no-files-found: error, retention-days: 90}
  source-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python code/fakeon_iter348_source_guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter348-source, path: iter348-source.json, if-no-files-found: error, retention-days: 90}
  aggregate:
    needs: [algebra-identity, decoupling-scaling, independent-grid, source-scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: iter348-*, path: iter348-results}
      - run: python code/iter348_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: iter348-summary, path: iter348-summary.json, if-no-files-found: error, retention-days: 90}
