name: paper-iv-iter338-341-parallel-terminalization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/paper_iv_iter338_341_*.py'
      - '.github/workflows/paper-iv-iter338-341-parallel-terminalization.yml'
      - 'protocol/PAPER_IV_MAJOR_FRAMEWORK_COVERAGE_CONTRACT.json'
      - 'paper_iv/PAPER_IV_D7_READINESS_STATE.json'
      - 'paper_iv/PAPER_IV_FROZEN_CORE_DECISION_LEDGER.json'
      - 'paper_iv/HIGHER_DERIVATIVE_QUANTIZATION_BRANCH_MAP_2026-09-10.json'

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [scan, nonlocal, higher_derivative, coherence]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter338-341
          python code/paper_iv_iter338_341_parallel_front.py --mode '${{ matrix.mode }}' --output 'build/iter338-341/${{ matrix.mode }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-iv-iter338-341-${{ matrix.mode }}
          path: build/iter338-341/${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: paper-iv-iter338-341-*
          path: iter338-341-results
      - run: python code/paper_iv_iter338_341_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-iv-iter338-341-summary
          path: iter338-341-summary.json
          if-no-files-found: error
          retention-days: 90
