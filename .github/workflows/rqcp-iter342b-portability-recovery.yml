name: rqcp-iter342b-portability-recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/rqcp_iter342b_*.py'
      - '.github/workflows/rqcp-iter342b-portability-recovery.yml'

permissions:
  contents: read
  actions: read

env:
  RQCP_SHA: 7c749f5f0aeefe07a897123295f3647fdc56d868
  PRIOR_RUN_ID: '34649913383'

jobs:
  portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Amordia/rqcp-toward-quantum-gravity
          ref: 7c749f5f0aeefe07a897123295f3647fdc56d868
          path: rqcp
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.20'
      - run: python -m pip install --disable-pip-version-check -r rqcp/requirements.txt
      - name: Reproduce scientific checker and quantify upstream strict portability failure
        run: |
          set -euo pipefail
          test "$(git -C rqcp rev-parse HEAD)" = "$RQCP_SHA"
          mkdir -p build/iter342b
          cp rqcp/evidence/rqcp-unified-qg-closure-evidence.json build/iter342b/frozen-evidence.json
          (cd rqcp && python scripts/check_rqcp_unified_qg_closure.py)
          set +e
          (cd rqcp && python scripts/check_release_integrity.py)
          RC=$?
          set -e
          test "$RC" -ne 0
          python code/rqcp_iter342b_portability_compare.py \
            --frozen build/iter342b/frozen-evidence.json \
            --regenerated rqcp/evidence/rqcp-unified-qg-closure-evidence.json \
            --release-exit "$RC" \
            --output build/iter342b/portability-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rqcp-iter342b-portability
          path: build/iter342b/portability-receipt.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: portability
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rqcp-iter342b-portability
          path: iter342b-343-results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34649913383
          pattern: rqcp-iter343-cutoff-*
          path: iter342b-343-results
      - run: python code/rqcp_iter342b_343_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rqcp-iter342b-343-summary
          path: iter342b-343-summary.json
          if-no-files-found: error
          retention-days: 90
