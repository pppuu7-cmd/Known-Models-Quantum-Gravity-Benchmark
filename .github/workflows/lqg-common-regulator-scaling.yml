name: lqg-common-regulator-scaling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter319_*.py'
      - '.github/workflows/lqg-common-regulator-scaling.yml'

permissions:
  contents: read

jobs:
  strata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        subset: ['012','013','014','023','024','034','123','124','134','234','0123','0124','0134','0234','1234','01234']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run common-regulator scaling stress test
        run: |
          mkdir -p build/lqg-iter319
          python code/lqg_iter319_common_regulator_probe.py --subset ${{ matrix.subset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter319-subset-${{ matrix.subset }}
          path: build/lqg-iter319/subset_${{ matrix.subset }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: strata
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter319-subset-*
          path: build/lqg-iter319-results
          merge-multiple: true
      - run: python code/lqg_iter319_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter319-summary
          path: |
            build/lqg-iter319-summary.json
            build/lqg-iter319-summary.sha256
          if-no-files-found: error
          retention-days: 90
