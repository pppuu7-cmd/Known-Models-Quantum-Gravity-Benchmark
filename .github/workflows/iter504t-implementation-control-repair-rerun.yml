name: KMQGB Iter504T implementation-control repair rerun

on:
  push:
    branches: [main]
    paths:
      - 'recovery/ITER504T_IMPLEMENTATION_CONTROL_REPAIR_RERUN_LAUNCH_2026-09-17.txt'

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen repair authority and unchanged science
        shell: bash
        run: |
          set -euo pipefail
          MARK='recovery/ITER504T_IMPLEMENTATION_CONTROL_REPAIR_RERUN_LAUNCH_2026-09-17.txt'
          test -f "$MARK"
          grep -Fx 'REPAIR_GATE=ITER504T_IMPLEMENTATION_CONTROL_REPAIR_RERUN_GATE' "$MARK"
          grep -Fx 'SCIENCE_CHANGED=false' "$MARK"
          grep -Fx 'SOURCE_CHANGED=false' "$MARK"
          grep -Fx 'CLASSIFIER_CHANGED=false' "$MARK"
          grep -Fx 'THRESHOLD_CHANGED=false' "$MARK"
          grep -Fx 'COHORT_VALUES_CHANGED=false' "$MARK"
          git merge-base --is-ancestor adc7bfb9df77a90455cac1b0f0cb7255d80c44d5 HEAD
          git merge-base --is-ancestor a47a9140cf10f2f0f912943133a01238ff1b5653 HEAD
          test "$(git rev-parse 51b8a95ed009761e542f8c50efaeca3a98bc2891:code/iter504t_local_derivative_contraction.py)" = '1ae78fc309839da30d1c78fc25c8e5ea3d98693f'
          test "$(git rev-parse 51b8a95ed009761e542f8c50efaeca3a98bc2891:code/iter504t_local_derivative_assemble.py)" = '6a886bf6ce8c263e586a6cb25d7441df5273a72d'
          test "$(git rev-parse 51b8a95ed009761e542f8c50efaeca3a98bc2891:code/iter504t_local_derivative_aggregate.py)" = '10a4338f5b55485b98cfdb6bfecd1a7e646a130a'
          test "$(git rev-parse 51b8a95ed009761e542f8c50efaeca3a98bc2891:code/iter504t_local_derivative_critic.py)" = '950d22e97b1ca2a17b2bb08d4386de6d4fb39445'
          test "$(git hash-object research/prereg/ITER504T_LOCAL_DERIVATIVE_ENCLOSURE_CONTRACTION_2026-09-17.md)" = 'f648b0e0d6a960bf60c32d5c34694497a50b7e68'
          test "$(git hash-object code/iter504t_local_derivative_contraction.py)" = 'db602157f90c130f6268d3b5b235a2144aca13a1'
          test "$(git hash-object code/iter504t_local_derivative_assemble.py)" = '62486912d9b930c12e8cddbb94999895fe8488df'
          test "$(git hash-object code/iter504t_local_derivative_aggregate.py)" = 'd19edf62ae10edbaa5d9eecb76ca8004595120fb'
          test "$(git hash-object code/iter504t_local_derivative_critic.py)" = '779697e3c507d18be8ac9f377dfe0b5212ecc393'
          test "$(git hash-object code/iter504t_implementation_control_repair_verdict.py)" = '8a547287c08fb42e299f258e39a4518a1bd950f5'
          expected_workflow="$(sed -n 's/^WORKFLOW_BLOB_SHA=//p' "$MARK")"
          test -n "$expected_workflow"
          test "$(git hash-object .github/workflows/iter504t-implementation-control-repair-rerun.yml)" = "$expected_workflow"
          for c in 1b0004064575f046210383dc7b1ee22d4f25e66b aa2b0256ce60d605574a18ec86c0bad5b5df1512 3a485d34efaa500bbd0276b397c1a2078d18905e 81e0e94649a50cccc510dc2630456af45fd98e46 33e2b9818c409843099aa136648a2da010a839a2; do
            git merge-base --is-ancestor "$c" HEAD
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and frozen constants recheck
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile code/iter504t_local_derivative_contraction.py code/iter504t_local_derivative_assemble.py code/iter504t_local_derivative_aggregate.py code/iter504t_local_derivative_critic.py code/iter504t_implementation_control_repair_verdict.py
          grep -F "ROOTS=(13,14,15);MAX_DEPTH=3;TOL=arb('0.05');FLOOR=arb('1.0')" code/iter504t_local_derivative_contraction.py
          grep -F "RGRID=(6,8,10,12);RHOS=(0.35,0.9,1.6,2.7)" code/iter504t_local_derivative_assemble.py
          grep -F "RGRID=(6,8,10,12);RHOS=(0.35,0.9,1.6,2.7)" code/iter504t_local_derivative_critic.py
          grep -F "componentwise_parent_inclusion_records" code/iter504t_local_derivative_contraction.py
          grep -F "wrong_R_cohort_top_level" code/iter504t_local_derivative_critic.py
          grep -F "R_6_to_7_possible_max" code/iter504t_local_derivative_critic.py

  roots:
    needs: source-lock
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
        root_box: [13,14,15]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
      - name: Capture environment
        shell: bash
        run: |
          mkdir -p out
          python -VV > out/python.txt 2>&1
          python -m pip freeze > out/pip-freeze.txt
          python - <<'PY' > out/flint.txt
          import flint
          print(getattr(flint, '__version__', 'unknown'))
          PY
          uname -a > out/uname.txt
      - name: Execute repaired same-contract bounded local-D root
        env:
          PYTHONPATH: code
        run: python code/iter504t_local_derivative_contraction.py --root-box '${{ matrix.root_box }}' --out 'out/root-${{ matrix.root_box }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504t-repair-${{ matrix.python }}-root-${{ matrix.root_box }}
          path: out
          if-no-files-found: error

  assemble:
    needs: roots
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-${{ matrix.python }}-root-13
          path: roots/13
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-${{ matrix.python }}-root-14
          path: roots/14
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-${{ matrix.python }}-root-15
          path: roots/15
      - name: Assemble one repaired environment independently
        run: |
          mkdir -p out
          python code/iter504t_local_derivative_assemble.py --root13 roots/13/root-13.json --root14 roots/14/root-14.json --root15 roots/15/root-15.json --out 'out/iter504t-${{ matrix.python }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504t-repair-assembled-${{ matrix.python }}
          path: out/iter504t-${{ matrix.python }}.json
          if-no-files-found: error

  aggregate:
    needs: assemble
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-assembled-3.11
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-assembled-3.13
          path: b
      - name: Aggregate repaired exact scientific decisions
        run: |
          mkdir -p out
          python code/iter504t_local_derivative_aggregate.py --a a/iter504t-3.11.json --b b/iter504t-3.13.json --out out/iter504t-repair-aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504t-repair-aggregate
          path: out/iter504t-repair-aggregate.json
          if-no-files-found: error

  critic:
    needs: [assemble, aggregate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: iter504t-repair-3.11-root-*
          path: roots-a
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: iter504t-repair-3.13-root-*
          path: roots-b
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-assembled-3.11
          path: asm-a
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-assembled-3.13
          path: asm-b
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-aggregate
          path: aggregate
      - name: Independent repaired adversarial Critic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python code/iter504t_local_derivative_critic.py \
            --a-root13 roots-a/iter504t-repair-3.11-root-13/root-13.json \
            --a-root14 roots-a/iter504t-repair-3.11-root-14/root-14.json \
            --a-root15 roots-a/iter504t-repair-3.11-root-15/root-15.json \
            --a-assembled asm-a/iter504t-3.11.json \
            --b-root13 roots-b/iter504t-repair-3.13-root-13/root-13.json \
            --b-root14 roots-b/iter504t-repair-3.13-root-14/root-14.json \
            --b-root15 roots-b/iter504t-repair-3.13-root-15/root-15.json \
            --b-assembled asm-b/iter504t-3.13.json \
            --aggregate aggregate/iter504t-repair-aggregate.json \
            --out out/iter504t-repair-critic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504t-repair-critic
          path: out/iter504t-repair-critic.json
          if-no-files-found: error

  repair-verdict:
    needs: [aggregate, critic]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-aggregate
          path: aggregate
      - uses: actions/download-artifact@v4
        with:
          name: iter504t-repair-critic
          path: critic
      - name: Classify frozen implementation-control repair gate
        run: |
          mkdir -p out
          python code/iter504t_implementation_control_repair_verdict.py --aggregate aggregate/iter504t-repair-aggregate.json --critic critic/iter504t-repair-critic.json --out out/iter504t-repair-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504t-repair-verdict
          path: out/iter504t-repair-verdict.json
          if-no-files-found: error
