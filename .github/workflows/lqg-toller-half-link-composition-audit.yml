name: lqg-toller-half-link-composition-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter302_toller_half_link_composition.json'
      - '.github/workflows/lqg-toller-half-link-composition-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [source_contract, branch_nonrepresentation, additive_completion, scope_boundary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter302
          python - <<'PY'
          import json, pathlib
          p=json.load(open('benchmarks/lqg_iter302_toller_half_link_composition.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'; details={}
          if g=='source_contract':
              ok=(c['toller_additive_completion_recovers_wigner_D'] and
                  c['individual_fixed_toller_branch_is_not_a_group_representation'] and
                  c['this_is_not_a_no_go_for_causal_spinfoams'])
              details={
                'source_relation':'T(+)+T(-)=D',
                'source_nonrepresentation':'T(s)(g1*g2) != sum T(s)(g1)T(s)(g2) generically',
                'causal_vertex_scope':'constrained causal combinatorial sum'
              }
          elif g=='branch_nonrepresentation':
              # Frozen source-grounded logic guard: ordinary representation composition is an implication
              # available for D but explicitly unavailable for a fixed Toller branch.
              ok=(c['individual_fixed_toller_branch_is_not_a_group_representation'] and
                  c['standard_same_branch_representation_composition_identity_is_not_available'] and
                  c['naive_fixed_branch_half_link_factorization_cannot_be_assumed_from_standard_D_representation_theory'])
              details={
                'fixed_branch_homomorphism_available':False,
                'naive_same_branch_half_link_factorization_authorized':False,
                'result_type':'source-grounded formal obstruction to inheritance, not amplitude no-go'
              }
          elif g=='additive_completion':
              # Treat T+ and T- as formal noncommuting branch symbols on two half-links.
              # D1*D2 expands to all four branch combinations; a same-branch-only rule has two terms.
              full=[('+','+'),('+','-'),('-','+'),('-','-')]
              same=[('+','+'),('-','-')]
              cross=[('+','-'),('-','+')]
              ok=(len(full)==4 and len(same)==2 and len(cross)==2 and
                  c['full_D_composition_can_be_recovered_after_additive_completion_before_composition'] and
                  c['cross_branch_or_post_integration_relations_may_restore_a_useful_gluing_identity'])
              details={
                'formal_D1D2_terms':full,
                'same_branch_terms':same,
                'cross_branch_terms':cross,
                'cross_branch_terms_required_in_generic_additive_expansion':True,
                'post_integration_identity_status':'open'
              }
          elif g=='scope_boundary':
              ok=(c['cross_branch_or_post_integration_relations_may_restore_a_useful_gluing_identity'] and
                  c['this_is_not_a_no_go_for_causal_spinfoams'] and
                  not c['han_half_link_haar_glue_equivalence_proven'] and
                  not c['lambda_f_weighted_causal_stack_finiteness_normalization_cutoff_control_proven'] and
                  not c['same_realization_uv_to_causal_regge_gr_transport_proven'] and
                  not c['family_terminal'] and not c['d7_authorized'])
              details={
                'no_no_go':True,
                'haar_integrated_cancellations_not_excluded':True,
                'new_causal_factorization_not_excluded':True,
                'han_glue_open':True,
                'stack_cutoff_open':True,
                'uv_ir_transport_open':True
              }
          else:
              raise SystemExit(2)
          out={'guard':g,'pass':bool(ok),'iteration':302,'details':details,'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter302/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter302-${{ matrix.guard }}
          path: build/lqg-iter302/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter302-*
          path: build/lqg-iter302-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=sorted(pathlib.Path('build/lqg-iter302-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          by={x['guard']:x for x in rows}; p=json.load(open('benchmarks/lqg_iter302_toller_half_link_composition.json'))
          out={
            'iteration':302,
            'independent_guards':4,
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'toller_additive_completion_recovers_D':True,
            'fixed_toller_branch_representation_composition_available':False,
            'naive_fixed_branch_standard_half_link_factorization_authorized':False,
            'generic_additive_two_half_link_expansion_terms':4,
            'generic_cross_branch_terms':2,
            'post_integration_or_cross_branch_glue_identity_excluded':False,
            'scientific_no_go_claim':False,
            'han_half_link_haar_glue_equivalence_proven':False,
            'causal_stack_finiteness_normalization_cutoff_control_proven':False,
            'same_realization_uv_to_regge_gr_transport_proven':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter302-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter302-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter302-summary
          path: |
            build/lqg-iter302-summary.json
            build/lqg-iter302-summary.sha256
          if-no-files-found: error
          retention-days: 90
