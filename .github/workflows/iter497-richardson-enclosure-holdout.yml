name: iter497-richardson-enclosure-holdout

on:
  push:
    paths:
      - '.github/workflows/iter497-richardson-enclosure-holdout.yml'
      - 'code/iter497_richardson_enclosure_holdout.py'
      - 'code/iter497_aggregate.py'
      - 'recovery/ITER497_PREREG_RICHARDSON_ENCLOSURE_HOLDOUT_2026-09-14.md'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen authority and scope guards
        run: |
          python - <<'PY'
          import pathlib
          pre=pathlib.Path('recovery/ITER497_PREREG_RICHARDSON_ENCLOSURE_HOLDOUT_2026-09-14.md').read_text()
          low=pre.lower()
          assert 'prospectively frozen before implementation' in low
          assert 'iter496_coefficient_stencil_convergence_qualified_scoped' in low
          assert '[0,1,3,5,6,11]' in pre
          assert '0.00150' in pre and '0.00175' in pre and '0.00200' in pre and '0.00225' in pre
          assert 'safety factor `2`' in low
          assert 'candidate gravity inactive' in low
          PY

  lane:
    needs: source-lock
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        causal: [0to5, 1to4, 2to3]
        block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy
      - name: Run frozen Richardson enclosure holdout job
        run: |
          mkdir -p artifacts
          python code/iter497_richardson_enclosure_holdout.py --causal '${{ matrix.causal }}' --block '${{ matrix.block }}' --out 'artifacts/iter497-${{ matrix.causal }}-b${{ matrix.block }}.json'
      - name: Upload raw job artifact
        uses: actions/upload-artifact@v4
        with:
          name: iter497-${{ matrix.causal }}-b${{ matrix.block }}
          path: artifacts/*.json
          if-no-files-found: error

  aggregate:
    needs: [source-lock, lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter497-*
          path: raw
          merge-multiple: false
      - name: Aggregate frozen verdict
        run: |
          mkdir -p aggregate
          python code/iter497_aggregate.py --root raw --out aggregate/iter497-summary.json
      - name: Upload aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter497-summary
          path: aggregate/iter497-summary.json
          if-no-files-found: error
