name: lqg-iter417-sigma-sector-collision-parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter417_sigma_sector_collision_parity.py'
      - '.github/workflows/lqg-iter417-sigma-sector-collision-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        k: [2, 3, 4, 5]
        eps: ['0.0', '1e-6', '1e-3', '1e-1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run exact source-support parity audit
        run: |
          python code/lqg_iter417_sigma_sector_collision_parity.py \
            --k '${{ matrix.k }}' \
            --eps '${{ matrix.eps }}' \
            --output 'build/iter417/k${{ matrix.k }}_eps${{ matrix.eps }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter417-k${{ matrix.k }}-eps${{ matrix.eps }}
          path: build/iter417/*.json
          if-no-files-found: error
          retention-days: 30
