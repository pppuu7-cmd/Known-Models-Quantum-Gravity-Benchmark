name: KMQGB Iter504Q root-box sharded diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter504q-root-box-sharded-diagnostic.yml'
      - 'research/prereg/ITER504Q_EXECUTION_ONLY_ROOT_BOX_SHARDING_2026-09-17.md'
      - 'code/iter504q_root_box_shard.py'
      - 'code/iter504q_root_box_assemble.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen science and sharding ancestry
        shell: bash
        run: |
          set -euo pipefail
          for c in \
            881c804f56a9a9969f8c969ea3ccd1826da92846 \
            18ef963041fe6ddec35e12cece0939aa18189a77 \
            432c6a38b310eae177a2d0675b95994cb6a89f34 \
            ecdfc00cd27973a4fc956c931bda30de2abc7c85 \
            53089560990ee19f96016cbe9ed1fdd3d7999279 \
            ceb948ef3b45d18686b94fd627b8da15a6da1f01; do
            git merge-base --is-ancestor "$c" HEAD
          done
          test "$(git hash-object code/iter504q_adaptive_subbox_diagnostic.py)" = "$(git rev-parse 18ef963041fe6ddec35e12cece0939aa18189a77:code/iter504q_adaptive_subbox_diagnostic.py)"
          test "$(git hash-object code/iter504q_adaptive_subbox_aggregate.py)" = "$(git rev-parse 432c6a38b310eae177a2d0675b95994cb6a89f34:code/iter504q_adaptive_subbox_aggregate.py)"

  root-shards:
    needs: source-lock
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python: ['3.11','3.13']
        root_box: [13,14,15]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
      - name: Execute one frozen root-box adaptive tree
        env:
          PYTHONPATH: code
        run: |
          mkdir -p out
          python code/iter504q_root_box_shard.py \
            --root-box '${{ matrix.root_box }}' \
            --out 'out/root-${{ matrix.root_box }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504q-${{ matrix.python }}-root-${{ matrix.root_box }}
          path: out/root-${{ matrix.root_box }}.json
          if-no-files-found: error

  assemble:
    needs: root-shards
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install frozen numerical dependencies for frozen summarize import
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
      - uses: actions/download-artifact@v4
        with:
          name: iter504q-${{ matrix.python }}-root-13
          path: roots/13
      - uses: actions/download-artifact@v4
        with:
          name: iter504q-${{ matrix.python }}-root-14
          path: roots/14
      - uses: actions/download-artifact@v4
        with:
          name: iter504q-${{ matrix.python }}-root-15
          path: roots/15
      - name: Assemble with unchanged frozen summarize function
        env:
          PYTHONPATH: code
        run: |
          mkdir -p out
          python code/iter504q_root_box_assemble.py \
            --box13 roots/13/root-13.json \
            --box14 roots/14/root-14.json \
            --box15 roots/15/root-15.json \
            --out 'out/iter504q-${{ matrix.python }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504q-sharded-${{ matrix.python }}
          path: out/iter504q-${{ matrix.python }}.json
          if-no-files-found: error

  aggregate:
    needs: assemble
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: iter504q-sharded-3.11
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: iter504q-sharded-3.13
          path: b
      - name: Aggregate independent environments with frozen classifier
        run: |
          mkdir -p out
          python code/iter504q_adaptive_subbox_aggregate.py \
            --a a \
            --b b \
            --out out/iter504q-sharded-aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504q-sharded-aggregate
          path: out/iter504q-sharded-aggregate.json
          if-no-files-found: error
