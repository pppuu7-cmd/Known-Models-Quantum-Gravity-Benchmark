name: lqg-partial-diagonal-subdivergence-census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter311_partial_diagonal_subdivergence_census.json'
      - 'code/lqg_iter311_*.py'
      - '.github/workflows/lqg-partial-diagonal-subdivergence-census.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        probe:
          - subset_degree_census
          - non_safe_subset_count
          - overlap_pair_census
          - forest_count
          - scope_guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Iter311 probe
        run: |
          mkdir -p build/lqg-iter311
          python code/lqg_iter311_${{ matrix.probe }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter311-${{ matrix.probe }}
          path: build/lqg-iter311/${{ matrix.probe }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter311-*
          path: build/lqg-iter311-results
          merge-multiple: true
      - run: python code/lqg_iter311_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter311-summary
          path: |
            build/lqg-iter311-summary.json
            build/lqg-iter311-summary.sha256
          if-no-files-found: error
          retention-days: 90
