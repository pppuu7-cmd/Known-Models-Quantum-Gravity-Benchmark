name: rqcp-reproducibility-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rqcp-reproducibility-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RQCP_REPO: Amordia/rqcp-toward-quantum-gravity
  RQCP_RELEASE_COMMIT: 3ec71888890453ea487eb0cc8a92548b24e3ed98
  RQCP_SCIENTIFIC_PAYLOAD: 7c749f5f0aeefe07a897123295f3647fdc56d868

jobs:
  evidence-recompute:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen RQCP v1.0.3 release tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.RQCP_REPO }}
          ref: ${{ env.RQCP_RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.20'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned numerical environment
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Recompute same-family fixed-band evidence
        run: python scripts/check_rqcp_unified_qg_closure.py

      - name: Verify evidence regeneration is deterministic
        run: git diff --exit-code -- evidence/rqcp-unified-qg-closure-evidence.json

  figure-recompute:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen RQCP v1.0.3 release tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.RQCP_REPO }}
          ref: ${{ env.RQCP_RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.20'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned numerical environment
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Regenerate publication evidence figure
        env:
          MPLCONFIGDIR: /tmp/rqcp-mpl
        run: python numerics/make_paper_figures.py

      - name: Validate generated figure manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('paper/figures/rqcp_fixed_band_evidence.figure.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for key in ('pdf', 'png'):
              if Path(data[key]).is_absolute():
                  raise SystemExit(f'absolute path leaked in figure manifest: {key}')
          print('PASS: figure manifest is portable')
          PY

  release-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout frozen RQCP v1.0.3 release tree with ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.RQCP_REPO }}
          ref: ${{ env.RQCP_RELEASE_COMMIT }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release and scientific-payload identities
        run: |
          test "$(git rev-parse HEAD)" = "$RQCP_RELEASE_COMMIT"
          git cat-file -e "$RQCP_SCIENTIFIC_PAYLOAD^{commit}"
          git merge-base --is-ancestor "$RQCP_SCIENTIFIC_PAYLOAD" "$RQCP_RELEASE_COMMIT"
          grep -F "$RQCP_SCIENTIFIC_PAYLOAD" README.md
          grep -F '10.5281/zenodo.22079986' README.md
          grep -F '10.5281/zenodo.22073562' README.md

      - name: Run frozen release-integrity validator
        run: python scripts/check_release_integrity.py
