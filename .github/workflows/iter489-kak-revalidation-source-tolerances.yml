name: iter489-kak-revalidation-source-tolerances

on:
  push:
    paths:
      - '.github/workflows/iter489-kak-revalidation-source-tolerances.yml'
      - 'code/iter489_kak_revalidation_source_tolerances.py'
      - 'code/iter489_aggregate.py'
      - 'recovery/ITER489_PREREG_KAK_REVALIDATION_SOURCE_TOLERANCES_2026-09-14.md'
  workflow_dispatch:

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate prospective authority
        run: |
          python - <<'PY'
          import pathlib
          p=pathlib.Path('recovery/ITER489_PREREG_KAK_REVALIDATION_SOURCE_TOLERANCES_2026-09-14.md').read_text()
          assert 'FROZEN BEFORE IMPLEMENTATION/PRODUCTION' in p
          assert 'high-precision absolute KAK reconstruction max residual `<1e-8`' in p
          assert 'determinant residual `<1e-10`' in p
          assert 'No numerical threshold may be changed after production' in p
          PY

  geometry:
    needs: source-lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cluster: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy
      - name: Run validation-only geometry audit
        run: |
          mkdir -p artifacts
          python code/iter489_kak_revalidation_source_tolerances.py \
            --cluster '${{ matrix.cluster }}' \
            --out 'artifacts/iter489-C-s${{ matrix.cluster }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: iter489-C-s${{ matrix.cluster }}
          path: artifacts/*.json
          if-no-files-found: error

  aggregate:
    needs: [source-lock, geometry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter489-C-s*
          path: raw
          merge-multiple: false
      - name: Aggregate frozen revalidation verdict
        run: |
          mkdir -p aggregate
          python code/iter489_aggregate.py --root raw --out aggregate/iter489-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter489-summary
          path: aggregate/iter489-summary.json
          if-no-files-found: error
