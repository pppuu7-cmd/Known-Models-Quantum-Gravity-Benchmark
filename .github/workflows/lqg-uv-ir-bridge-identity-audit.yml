name: lqg-uv-ir-bridge-identity-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_uv_ir_bridge_common.py'
      - 'code/lqg_uv_ir_family_identity_guard.py'
      - 'code/lqg_uv_ir_limit_orientation_guard.py'
      - 'code/lqg_uv_ir_parameter_transport_guard.py'
      - 'code/lqg_uv_ir_observable_target_guard.py'
      - 'code/lqg_uv_ir_bridge_aggregate.py'
      - '.github/workflows/lqg-uv-ir-bridge-identity-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: family, script: lqg_uv_ir_family_identity_guard.py}
          - {label: limits, script: lqg_uv_ir_limit_orientation_guard.py}
          - {label: parameters, script: lqg_uv_ir_parameter_transport_guard.py}
          - {label: observable, script: lqg_uv_ir_observable_target_guard.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent UV-IR bridge guard
        run: python code/${{ matrix.script }} --output build/lqg-uv-ir/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-uv-ir-${{ matrix.label }}
          path: build/lqg-uv-ir/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-uv-ir-*
          path: build/lqg-uv-ir-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_uv_ir_bridge_aggregate.py --input-dir build/lqg-uv-ir-results --output build/lqg-uv-ir-iter283-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-uv-ir-iter283-summary
          path: build/lqg-uv-ir-iter283-summary.json
          if-no-files-found: error
          retention-days: 90
