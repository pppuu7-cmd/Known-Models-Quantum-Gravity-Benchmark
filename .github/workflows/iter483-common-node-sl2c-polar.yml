name: iter483-common-node-sl2c-polar

on:
  push:
    branches: [ main ]
    paths:
      - 'code/iter483_common_node_sl2c_polar.py'
      - 'recovery/ITER483_PREREG_COMMON_NODE_SL2C_POLAR_GEOMETRY_2026-09-13.md'
      - '.github/workflows/iter483-common-node-sl2c-polar.yml'
  workflow_dispatch:

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        panel: [A, B, C, D]
        regime: [mild, strong]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependency
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Run frozen Iter483 lane
        env:
          ITER483_PANEL: ${{ matrix.panel }}
          ITER483_REGIME: ${{ matrix.regime }}
        run: python code/iter483_common_node_sl2c_polar.py
      - name: Upload raw lane artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter483-${{ matrix.panel }}-${{ matrix.regime }}
          path: artifacts/iter483-${{ matrix.panel }}-${{ matrix.regime }}.json
          if-no-files-found: error

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter483-*
          path: collected
          merge-multiple: false
      - name: Frozen aggregate classifier
        run: |
          python - <<'PY'
          import json,pathlib,sys
          fs=sorted(pathlib.Path('collected').glob('**/*.json')); rows=[json.loads(p.read_text()) for p in fs]
          expected={(p,r) for p in ('A','B','C','D') for r in ('mild','strong')}
          seen={(x.get('panel'),x.get('regime')) for x in rows}
          complete=len(rows)==8 and seen==expected
          ok=complete and all(x.get('scientific_pass') is True for x in rows)
          out={'iteration':'483','lane_count':len(rows),'complete_expected_panel':complete,'all_lane_scientific_pass':ok,
               'classification':'ITER483_COMMON_NODE_SL2C_POLAR_GEOMETRY_QUALIFIED_SCOPED' if ok else 'FAIL_ITER483_COMMON_NODE_SL2C_POLAR_GEOMETRY',
               'lanes':[{'lane':x.get('lane'),'pass':x.get('scientific_pass'),'cycle':x.get('cycle_residual'),'reconstruction':x.get('reconstruction_residual'),'eta_max':x.get('eta_max'),'corrupt':x.get('corrupted_cycle_residual')} for x in rows],
               'scope':'shared-node SL2C kinematic/polar prerequisite only; no source Toller KAK identification, Haar/spectral/full-vertex claim'}
          pathlib.Path('iter483-aggregate.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2)); sys.exit(0 if ok else 2)
          PY
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter483-aggregate
          path: iter483-aggregate.json
          if-no-files-found: error
