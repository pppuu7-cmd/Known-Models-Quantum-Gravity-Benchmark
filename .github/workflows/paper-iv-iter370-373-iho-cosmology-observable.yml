name: paper-iv-iter370-373-iho-cosmology-observable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_iv/IHO_DQFT_COSMOLOGY_SOURCE_AUTHORITY_ITER370_373.json'
      - 'code/iho_dqft_iter370_*.py'
      - 'code/iho_dqft_iter371_*.py'
      - 'code/iho_dqft_iter372_*.py'
      - 'code/iho_dqft_iter373_*.py'
      - 'code/iter370_373_aggregate.py'
      - '.github/workflows/paper-iv-iter370-373-iho-cosmology-observable.yml'

permissions:
  contents: read

jobs:
  observable-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        N: ['50','55','60']
        x: ['0','0.05','0.25','0.5','0.75','0.9']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter370
          python code/iho_dqft_iter370_tensor_ratio.py --N '${{ matrix.N }}' --x '${{ matrix.x }}' --output 'build/iter370/r-N${{ matrix.N }}-x${{ matrix.x }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter370-iho-r-N${{ matrix.N }}-x${{ matrix.x }}
          path: build/iter370/*.json
          if-no-files-found: error
          retention-days: 90

  domain-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        x: ['-0.05','0','0.05','0.25','0.5','0.75','0.9','1.0','1.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter371
          python code/iho_dqft_iter371_domain_guard.py --x '${{ matrix.x }}' --output 'build/iter371/domain-x${{ matrix.x }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter371-iho-domain-x${{ matrix.x }}
          path: build/iter371/*.json
          if-no-files-found: error
          retention-days: 90

  error-propagation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        x: ['0.05','0.25','0.5','0.75','0.9']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter372
          python code/iho_dqft_iter372_error_propagation.py --N 55 --x '${{ matrix.x }}' --sigma-N 1 --sigma-x 0.01 --output 'build/iter372/error-x${{ matrix.x }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter372-iho-error-x${{ matrix.x }}
          path: build/iter372/*.json
          if-no-files-found: error
          retention-days: 90

  branch-scope-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python code/iho_dqft_iter373_scope_guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter373-iho-cosmology-scope
          path: iter373-iho-cosmology-scope.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [observable-grid, domain-guard, error-propagation, branch-scope-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'iter37*'
          path: iter370-373-results
      - run: python code/iter370_373_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter370-373-summary
          path: iter370-373-summary.json
          if-no-files-found: error
          retention-days: 90
