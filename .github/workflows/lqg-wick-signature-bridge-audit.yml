name: lqg-wick-signature-bridge-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_wick_bridge_common.py'
      - 'code/lqg_wick_vertex_map_guard.py'
      - 'code/lqg_wick_imMirzi_domain_guard.py'
      - 'code/lqg_wick_object_scope_guard.py'
      - 'code/lqg_wick_chain_compatibility_guard.py'
      - 'code/lqg_wick_bridge_aggregate.py'
      - '.github/workflows/lqg-wick-signature-bridge-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: vertex, script: lqg_wick_vertex_map_guard.py}
          - {label: imMirzi, script: lqg_wick_imMirzi_domain_guard.py}
          - {label: scope, script: lqg_wick_object_scope_guard.py}
          - {label: chain, script: lqg_wick_chain_compatibility_guard.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Wick/signature bridge guard
        run: python code/${{ matrix.script }} --output build/lqg-wick/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-wick-${{ matrix.label }}
          path: build/lqg-wick/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-wick-*
          path: build/lqg-wick-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_wick_bridge_aggregate.py --input-dir build/lqg-wick-results --output build/lqg-wick-iter286-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-wick-iter286-summary
          path: build/lqg-wick-iter286-summary.json
          if-no-files-found: error
          retention-days: 90
