name: rqcp-cross-environment-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rqcp-cross-environment-audit.yml'
      - 'code/rqcp_evidence_semantic_compare.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  RQCP_REPO: Amordia/rqcp-toward-quantum-gravity
  RQCP_RELEASE_COMMIT: 3ec71888890453ea487eb0cc8a92548b24e3ed98

jobs:
  semantic-recompute:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: ubuntu22-t1
            os: ubuntu-22.04
            threads: 1
          - label: ubuntu24-t1
            os: ubuntu-24.04
            threads: 1
          - label: ubuntu24-t2
            os: ubuntu-24.04
            threads: 2
          - label: ubuntu24-t4
            os: ubuntu-24.04
            threads: 4
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: ${{ matrix.threads }}
      OMP_NUM_THREADS: ${{ matrix.threads }}
      MKL_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - name: Checkout KMQGB audit implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kmqgb
          persist-credentials: false

      - name: Checkout frozen RQCP v1.0.3 release tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.RQCP_REPO }}
          ref: ${{ env.RQCP_RELEASE_COMMIT }}
          path: rqcp
          persist-credentials: false

      - name: Set up frozen release Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.20'
          cache: pip
          cache-dependency-path: rqcp/requirements.txt

      - name: Install frozen numerical package versions
        run: python -m pip install --disable-pip-version-check -r rqcp/requirements.txt

      - name: Preserve committed evidence baseline
        run: cp rqcp/evidence/rqcp-unified-qg-closure-evidence.json baseline.json

      - name: Recompute RQCP evidence independently
        working-directory: rqcp
        run: python scripts/check_rqcp_unified_qg_closure.py

      - name: Compare scientific semantics fail-closed
        run: >-
          python kmqgb/code/rqcp_evidence_semantic_compare.py
          --baseline baseline.json
          --candidate rqcp/evidence/rqcp-unified-qg-closure-evidence.json
          --report report-${{ matrix.label }}.json

      - name: Print environment fingerprint
        run: |
          python - <<'PY'
          import json, platform
          import numpy, scipy
          print(json.dumps({
              'platform': platform.platform(),
              'python': platform.python_version(),
              'numpy': numpy.__version__,
              'scipy': scipy.__version__,
          }, sort_keys=True))
          try:
              numpy.show_config()
          except Exception as exc:
              print('show_config_failed', repr(exc))
          PY

      - name: Upload semantic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rqcp-semantic-${{ matrix.label }}
          path: report-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 30
