name: asymptotic-safety-spectral-unitarity-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/as_spectral_common.py'
      - 'code/as_spectral_rg_trajectory.py'
      - 'code/as_spectral_uv_integrability.py'
      - 'code/as_spectral_weight.py'
      - 'code/as_spectral_ir.py'
      - 'code/as_spectral_aggregate.py'
      - '.github/workflows/asymptotic-safety-spectral-unitarity-audit.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: rg, script: as_spectral_rg_trajectory.py}
          - {label: uv, script: as_spectral_uv_integrability.py}
          - {label: weight, script: as_spectral_weight.py}
          - {label: ir, script: as_spectral_ir.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent spectral audit probe
        run: python code/${{ matrix.script }} --output build/as-spectral/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: as-spectral-${{ matrix.label }}
          path: build/as-spectral/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: as-spectral-*
          path: build/as-spectral-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/as_spectral_aggregate.py --input-dir build/as-spectral-results --output build/as-spectral-iter280-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: as-spectral-iter280-summary
          path: build/as-spectral-iter280-summary.json
          if-no-files-found: error
          retention-days: 90
