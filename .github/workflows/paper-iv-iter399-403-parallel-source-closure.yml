name: paper-iv-iter399-403-parallel-source-closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_iv/HIGHER_DERIVATIVE_QUANTIZATION_BRANCH_MAP_V2_ITER399.json'
      - 'paper_iv/PAPER_IV_COVERAGE_DELTA_ITER399.json'
      - 'paper_iv/PARALLEL_SOURCE_CLOSURE_AUTHORITY_ITER400_403.json'
      - 'code/iter399_403_parallel_source_closure.py'
      - 'code/iter399_403_aggregate.py'
      - '.github/workflows/paper-iv-iter399-403-parallel-source-closure.yml'

permissions:
  contents: read

jobs:
  branch-map-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: python code/iter399_403_parallel_source_closure.py --mode branch --output iter399-branch-map-v2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter399-branch-map-v2
          path: iter399-branch-map-v2.json
          if-no-files-found: error

  source-family:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [HORAVA_LIFSHITZ, CDT_EDT, GFT_TENSOR_MODELS, STRING_MTHEORY_HOLOGRAPHY]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - run: |
          mkdir -p build/iter400-403
          python code/iter399_403_parallel_source_closure.py --mode family --family '${{ matrix.family }}' --output 'build/iter400-403/${{ matrix.family }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter400-403-${{ matrix.family }}
          path: build/iter400-403/*.json
          if-no-files-found: error

  aggregate:
    needs: [branch-map-v2, source-family]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'iter4*'
          path: iter399-403-results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'iter399*'
          path: iter399-403-results
      - run: python code/iter399_403_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iter399-403-summary
          path: iter399-403-summary.json
          if-no-files-found: error
