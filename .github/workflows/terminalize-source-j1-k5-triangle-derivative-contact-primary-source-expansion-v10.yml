- `arXiv:2601.23162v1`: `{dp['pdf_sha256']['arXiv:2601.23162v1']}`;
- `arXiv:2604.24945v1`: `{dp['pdf_sha256']['arXiv:2604.24945v1']}`.

All frozen page anchors passed. Six semantically relevant primary-source candidates were checked. Actionable same-realization selectors satisfying PRIMARY + SAME_REALIZATION + EXPLICIT + MAPPABLE + INDEPENDENT = `0`. Remaining affine nullity = `6`.

