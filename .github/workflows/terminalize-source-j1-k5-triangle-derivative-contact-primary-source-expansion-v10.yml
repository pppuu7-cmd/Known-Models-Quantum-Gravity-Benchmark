          git push origin HEAD:main
          echo "RESULT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Write durable recovery handoff and current front
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, hashlib
          R=pathlib.Path('.')
          result_commit=os.environ['RESULT_COMMIT']
