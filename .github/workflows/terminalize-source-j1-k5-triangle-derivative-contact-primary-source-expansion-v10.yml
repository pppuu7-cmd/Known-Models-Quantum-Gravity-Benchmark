name: terminalize-source-j1-k5-triangle-derivative-contact-primary-source-expansion-v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terminalize-source-j1-k5-triangle-derivative-contact-primary-source-expansion-v10.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  terminalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download authoritative terminal aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35088750770 --jq .status)" = completed
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35088750770 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35088750770 --jq .head_sha)" = 17daa25c4629e26a632dffed83dfac68da344e48
          rm -rf downloaded
          mkdir downloaded
          gh run download 35088750770 --name v10-aggregate --dir downloaded
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/35088750770/artifacts > downloaded/artifacts.json
      - name: Validate frozen terminal decision and materialize durable records
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, pathlib
          R=pathlib.Path('.')
          d=pathlib.Path('downloaded')
          agg=json.loads((d/'v10_aggregate.json').read_text())
          assert agg['gate']=='SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_GATE'
          assert agg['classification']=='SOURCE_EXPANDED_FINITE_RENORMALIZATION_AUTHORITY_BLOCKED_SCOPED'
          assert agg['lane_decision_agreement'] is True
          assert agg['lane_a_controls_pass'] is True and agg['lane_b_controls_pass'] is True
          dp=agg['decision_projection']
          assert dp['controls_pass'] is True
          assert dp['actionable_record_count']==0
          assert dp['remaining_affine_nullity']==6
          arts=json.loads((d/'artifacts.json').read_text())['artifacts']
          byname={a['name']:a for a in arts}
          for name in ('v10-3.11','v10-3.13','v10-aggregate'):
              assert name in byname and byname[name]['expired'] is False
          outdir=R/'results'; outdir.mkdir(exist_ok=True)
          canon=outdir/'SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_CANONICAL_2026-09-16.json'
          raw=outdir/'SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_RAW_2026-09-16.log'
          hashes=outdir/'SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_HASHES_2026-09-16.sha256'
          canon.write_text((d/'v10_aggregate.json').read_text())
          raw.write_text((d/'v10_aggregate.log').read_text())
          def sh(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          hashes.write_text(f"{sh(canon)}  {canon.name}\n{sh(raw)}  {raw.name}\n")

          candidates=json.loads((R/'inputs/source_j1_k5_triangle_derivative_contact_primary_source_expansion_v10_candidates.json').read_text())['candidate_records']
          for sid in ('arXiv:2601.23162v1','arXiv:2604.24945v1'):
              rec=agg['source_records'][sid]
              obj={
                  'source_id':sid,
                  'gate':'SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_GATE',
                  'role':'full immutable primary-source audit record for V10',
                  'pdf_url':rec['pdf_url'],
                  'pdf_sha256':rec['pdf_sha256'],
                  'pdf_byte_length':rec['byte_length'],
                  'version_marker_present':rec['version_marker_present'],
                  'full_text_term_scan_counts':rec['term_scan_counts'],
                  'candidate_passages':[x for x in candidates if x['source_id']==sid],
                  'actionable_selector_count':sum(1 for x in agg['candidate_checks'] if x['source_id']==sid and x['computed_actionable']),
                  'interpretation':'No candidate passage in this frozen full-primary-source audit supplied a new exact mappable selector on the six-dimensional V8 affine freedom.'
              }
              slug=sid.split(':',1)[1].lower().replace('.','_')
              (R/'sources'/f'{slug}_finite_renormalization_full_primary_audit_v10.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')

          art_lines=[]
          for name in ('v10-3.11','v10-3.13','v10-aggregate'):
              a=byname[name]
              art_lines.append(f"- {name}: artifact `{a['id']}`, digest `{a['digest']}`.")
          terminal=outdir/'SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_TERMINAL_2026-09-16.md'
          terminal.write_text(f'''# SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10 — terminal result

Date: 2026-09-16
Status: TERMINAL

## Authority

- Gate: `SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_GATE`
- Prospective freeze commit: `6188178d92b8a4c2885e14eb90923168224d83ee`
- Candidate-record hardening commit: `1bf668621e6cb36115e2ded95e7663529bf9f122`
- Implementation commits: `5c76c0730104233463b688c18773d4ed0629b61b`, `b51a4efd8e73350aede3fa1da406e0ea7a17b416`
- Authoritative workflow head: `17daa25c4629e26a632dffed83dfac68da344e48`
- Authoritative Actions run: `35088750770`, terminal `completed/success`
- Jobs: source-lock `104769749310`; Python 3.11 `104769780036`; Python 3.13 `104769780072`; aggregate `104769924093`.
{chr(10).join(art_lines)}

