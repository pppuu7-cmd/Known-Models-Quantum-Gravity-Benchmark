## Frozen terminal classification

`SOURCE_EXPANDED_FINITE_RENORMALIZATION_AUTHORITY_BLOCKED_SCOPED`

This is **BLOCKED, not FAIL**.

## Exact result

The terminal V8/V9 locks were reproduced: invariant basis count `8`, V8 rank/augmented-rank `2/2`, affine nullity `6`; V9 selector rank `0`, remaining nullity `6`.

Both frozen immutable primary PDFs were retrieved inside Actions and independently audited under Python 3.11 and 3.13. The lanes agree exactly on decision SHA256 `{agg['decision_sha256']}`.

