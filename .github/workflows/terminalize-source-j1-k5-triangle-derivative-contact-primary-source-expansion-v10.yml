          raw=R/'results/SOURCE_J1_K5_TRIANGLE_DERIVATIVE_CONTACT_PRIMARY_SOURCE_EXPANSION_V10_RAW_2026-09-16.log'
          sh=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          front=R/'recovery/CURRENT_BENCHMARK_FRONT.md'
