name: lqg-causal-support-pole-cancellation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter308_causal_support_pole_cancellation.json'
      - 'code/lqg_iter308_*.py'
      - '.github/workflows/lqg-causal-support-pole-cancellation.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        probe:
          - causal_support_factor
          - unrestricted_support_cancellation
          - unit_causal_sum_witness
          - nonnegative_weight_guard
          - scope_guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Iter308 probe
        run: |
          mkdir -p build/lqg-iter308
          python code/lqg_iter308_${{ matrix.probe }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter308-${{ matrix.probe }}
          path: build/lqg-iter308/${{ matrix.probe }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter308-*
          path: build/lqg-iter308-results
          merge-multiple: true
      - run: python code/lqg_iter308_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter308-summary
          path: |
            build/lqg-iter308-summary.json
            build/lqg-iter308-summary.sha256
          if-no-files-found: error
          retention-days: 90
