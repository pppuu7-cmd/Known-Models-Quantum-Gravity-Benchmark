name: lqg-iter443-one-leg-radial-integrability
on:
  push:
    branches: [research/iter443-one-leg-radial-integrability]
    paths:
      - 'benchmarks/lqg_iter443_one_leg_radial_integrability_contract.json'
      - 'code/lqg_iter443_radial_gate.py'
      - '.github/workflows/lqg-iter443-one-leg-radial-integrability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radial:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {gamma: 7.0, j: 2}
          - {gamma: 7.0, j: 5}
          - {gamma: 8.0, j: 2}
          - {gamma: 8.0, j: 5}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Evaluate frozen one-leg radial gate
        run: python code/lqg_iter443_radial_gate.py --gamma '${{ matrix.gamma }}' --j '${{ matrix.j }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter443-g${{ matrix.gamma }}-j${{ matrix.j }}
          path: build/lqg-iter443/*.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: radial
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: iter443-*
          path: evidence
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Aggregate fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,hashlib,pathlib
          rows=[json.load(open(f)) for f in sorted(glob.glob('evidence/g*_j*.json'))]
          ok=len(rows)==4 and all(r.get('controls_valid') for r in rows)
          out={'iteration':443,'lanes_found':len(rows),'lanes_passed':sum(bool(r.get('controls_valid')) for r in rows),'controls_valid':ok,'worst_late_log_slope':max((r['late_log_slope'] for r in rows),default=None),'max_scaled_envelope_variation':max((r['scaled_envelope_variation'] for r in rows),default=None),'classification':'SOURCE_ONE_LEG_RADIAL_ENVELOPE_INTEGRABLE_ON_FROZEN_GRID' if ok else 'RADIAL_GATE_INVALID_OR_FAILED','d7_s2':'STRENGTHENED_BUT_NOT_CLOSED' if ok else 'NOT_CLOSED','d7_s3':'NOT_CLOSED','d7_s4':'PARTIAL_GLOBAL_NOT_CLOSED','d7':'NOT_CLOSED / NOT_YET_AUTHORIZED','candidate_gravity_authorized':False,'next_gate':'Simultaneous multi-group noncompact directions / full causal-vertex Haar-angular integrability; do not infer full vertex finiteness from this one-leg gate.'}
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'; pathlib.Path('iter443-summary.json').write_text(payload); pathlib.Path('iter443-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n'); print(payload)
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iter443-summary
          path: |
            iter443-summary.json
            iter443-summary.sha256
          if-no-files-found: error
          retention-days: 90
