name: iter473-source-kernel-executable-audit
on:
  push:
    branches: [research/iter473-source-kernel-executable-audit]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python code/iter473_source_kernel_executable_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: iter473-summary
          path: artifacts/iter473-summary.json
