name: KMQGB Iter504R root-affine reuse continuous diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter504r-root-affine-reuse-diagnostic.yml'
      - 'research/prereg/ITER504R_ROOT_AFFINE_REUSE_CONTINUOUS_DRIFT_DIAGNOSTIC_2026-09-17.md'
      - 'code/iter504r_root_affine_reuse.py'
      - 'code/iter504r_affine_reuse_assemble.py'
      - 'code/iter504r_affine_reuse_aggregate.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  release-obsolete-runners:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Cancel nonterminal resource-superseded Iter504Q runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/actions/runs/35153170282/cancel" 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "Iter504Q unsharded already noncancellable/completed" }
          gh api --method POST "repos/${{ github.repository }}/actions/runs/35153583453/cancel" 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "Iter504Q sharded already noncancellable/completed" }

  source-lock:
    needs: release-obsolete-runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen Iter504R authority and implementation ancestry
        shell: bash
        run: |
          set -euo pipefail
          for c in \
            147d68f26ed3a14ce3cd1fd77fcd96d5fb329ec8 \
            f846820bae39963a48272deccb2e4a539100fce1 \
            904cae881f86f213973110fc8f18a4c02d67cc3d \
            e0367d4e0b91afc668e733c2027fd39bf27637fc \
            c53d3c9836af89f2b13d4f73db93f08a42dbd069 \
            162014c7566afa4828e646f77e52d91140dc8388 \
            f0844237cbf6ba1e042399d5a76dec8a4ab8b248 \
            aeef88e899c2f3900a8735b30610e9adabebbb9d; do
            git merge-base --is-ancestor "$c" HEAD
          done
      - name: Verify inherited Iter504 science modules unchanged
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            code/iter499_arb_core.py \
            code/iter500_compact_sandwich_kak.py \
            code/iter501_direct_max_envelope_interval.py \
            code/iter503_ad_core.py \
            code/iter504_centered_shard.py; do
            test "$(git hash-object "$p")" = "$(git rev-parse aeef88e899c2f3900a8735b30610e9adabebbb9d:"$p")"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and frozen constants check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile code/iter504r_root_affine_reuse.py code/iter504r_affine_reuse_assemble.py code/iter504r_affine_reuse_aggregate.py
          grep -F "MAX_DEPTH = 10" code/iter504r_root_affine_reuse.py
          grep -F "DRIFT_TOL = arb('0.05')" code/iter504r_root_affine_reuse.py
          grep -F "ROBUST_FLOOR = arb('1.0')" code/iter504r_root_affine_reuse.py
          grep -F "ROOT_BOXES = (13, 14, 15)" code/iter504r_root_affine_reuse.py

  root-models:
    needs: source-lock
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python: ['3.11','3.13']
        root_box: [13,14,15]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath sympy 'python-flint==0.9.0'
      - name: Build one full root derivative model and refine delta only
        env:
          PYTHONPATH: code
        run: |
          mkdir -p out
          python code/iter504r_root_affine_reuse.py \
            --root-box '${{ matrix.root_box }}' \
            --out 'out/root-${{ matrix.root_box }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504r-${{ matrix.python }}-root-${{ matrix.root_box }}
          path: out/root-${{ matrix.root_box }}.json
          if-no-files-found: error

  assemble:
    needs: root-models
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: iter504r-${{ matrix.python }}-root-13
          path: roots/13
      - uses: actions/download-artifact@v4
        with:
          name: iter504r-${{ matrix.python }}-root-14
          path: roots/14
      - uses: actions/download-artifact@v4
        with:
          name: iter504r-${{ matrix.python }}-root-15
          path: roots/15
      - name: Assemble exact covers and frozen classifier
        run: |
          mkdir -p out
          python code/iter504r_affine_reuse_assemble.py \
            --box13 roots/13/root-13.json \
            --box14 roots/14/root-14.json \
            --box15 roots/15/root-15.json \
            --out 'out/iter504r-${{ matrix.python }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504r-assembled-${{ matrix.python }}
          path: out/iter504r-${{ matrix.python }}.json
          if-no-files-found: error

  aggregate:
    needs: assemble
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: iter504r-assembled-3.11
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: iter504r-assembled-3.13
          path: b
      - name: Aggregate independent Python environments
        run: |
          mkdir -p out
          python code/iter504r_affine_reuse_aggregate.py \
            --a a \
            --b b \
            --out out/iter504r-aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter504r-affine-reuse-aggregate
          path: out/iter504r-aggregate.json
          if-no-files-found: error
