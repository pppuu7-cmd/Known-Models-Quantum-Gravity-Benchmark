name: lqg-toller-su2-haar-half-link-glue-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter303_toller_su2_haar_glue.json'
      - 'code/lqg_iter303_*.py'
      - '.github/workflows/lqg-toller-su2-haar-half-link-glue-audit.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        probe:
          - source_covariance_contract
          - exact_schur_haar_contraction
          - mismatched_spin_orthogonality
          - branch_bilinearity
          - scope_guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent Iter303 probe
        shell: bash
        run: |
          mkdir -p build/lqg-iter303
          python code/lqg_iter303_${{ matrix.probe }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter303-${{ matrix.probe }}
          path: build/lqg-iter303/${{ matrix.probe }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter303-*
          path: build/lqg-iter303-results
          merge-multiple: true
      - name: Aggregate only after all independent probes succeed
        run: python code/lqg_iter303_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter303-summary
          path: |
            build/lqg-iter303-summary.json
            build/lqg-iter303-summary.sha256
          if-no-files-found: error
          retention-days: 90
