name: lqg-spinfoam-stack-hessian-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_stack_hessian_common.py'
      - 'code/lqg_stack_exact_definiteness.py'
      - 'code/lqg_stack_incidence_factorization.py'
      - 'code/lqg_stack_kron18.py'
      - 'code/lqg_stack_coefficients.py'
      - 'code/lqg_stack_aggregate.py'
      - '.github/workflows/lqg-spinfoam-stack-hessian-audit.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: definiteness, script: lqg_stack_exact_definiteness.py}
          - {label: incidence, script: lqg_stack_incidence_factorization.py}
          - {label: kron18, script: lqg_stack_kron18.py}
          - {label: coefficients, script: lqg_stack_coefficients.py}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent LQG spinfoam-stack probe
        run: python code/${{ matrix.script }} --output build/lqg-stack/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-stack-${{ matrix.label }}
          path: build/lqg-stack/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-stack-*
          path: build/lqg-stack-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_stack_aggregate.py --input-dir build/lqg-stack-results --output build/lqg-stack-iter281-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-stack-iter281-summary
          path: build/lqg-stack-iter281-summary.json
          if-no-files-found: error
          retention-days: 90
