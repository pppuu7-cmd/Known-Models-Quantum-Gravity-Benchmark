name: lqg-minimal-jet-normalization-rank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_iter330_explicit_k5_jet_basis.py'
      - 'code/lqg_iter332_*.py'
      - '.github/workflows/lqg-minimal-jet-normalization-rank.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [k4, k3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: |
          mkdir -p build/iter332
          python code/lqg_iter332_minimal_jet_normalization_rank.py --kind '${{ matrix.kind }}' --output 'build/iter332/${{ matrix.kind }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter332-${{ matrix.kind }}
          path: build/iter332/${{ matrix.kind }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter332-*
          path: iter332-results
      - run: python code/lqg_iter332_aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter332-summary
          path: iter332-summary.json
          if-no-files-found: error
          retention-days: 90
