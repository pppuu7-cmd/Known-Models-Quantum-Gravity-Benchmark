name: lqg-formal-causal-stack-composition-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/lqg_iter297_formal_causal_stack_composition.json'
      - '.github/workflows/lqg-formal-causal-stack-composition-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard: [source_contract, member_index_preservation, lambda_bookkeeping, composition_boundary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run frozen independent guard
        shell: bash
        run: |
          mkdir -p build/lqg-iter297
          python - <<'PY'
          import itertools, json, pathlib
          from fractions import Fraction
          p=json.load(open('benchmarks/lqg_iter297_formal_causal_stack_composition.json'))
          c=p['prospectively_frozen_claims']; g='${{ matrix.guard }}'
          details={}

          if g=='source_contract':
              ok=(c['han_stack_members_are_generalized_eprl_kkl_on_2_complexes'] and
                  c['han_stack_member_indexing_is_face_multiplicity_and_spin_based'] and
                  c['han_lambda_weights_multiply_member_amplitudes_externally'] and
                  c['han_multivertex_amplitude_is_gluing_of_vertex_amplitudes'] and
                  c['beltran_causal_vertex_is_defined_as_eprl_kkl_vertex_alternative_on_arbitrary_2_complex'] and
                  c['beltran_explicitly_proposes_replacing_eprl_kkl_amplitude_by_causal_alternative_at_each_vertex_in_multivertex_discretizations'] and
                  c['formal_memberwise_causal_vertex_substitution_exists_on_iter296_admissible_causal_stack_members'])
              details={'formal_composition_only':True}

          elif g=='member_index_preservation':
              # A local vertex replacement changes the local amplitude symbol but not the
              # pre-existing member labels (face multiplicities and spins) by definition.
              checked=0
              for nfaces in range(1,9):
                  for seed in range(1,65):
                      pvec=tuple(1+((seed*(i+2)+i*i)%7) for i in range(nfaces))
                      spins=tuple(tuple(1+((seed+i+3*j)%11) for j in range(mult)) for i,mult in enumerate(pvec))
                      standard={'p':pvec,'spins':spins,'vertices':tuple(f'V{j}' for j in range(2+(seed%5))),'local_symbol':'A_EPRL_KKL'}
                      causal=dict(standard); causal['local_symbol']='A_CAUSAL_PLUS'
                      if standard['p']!=causal['p'] or standard['spins']!=causal['spins'] or standard['vertices']!=causal['vertices']:
                          raise SystemExit('member labels changed')
                      checked+=1
              ok=(checked==512 and c['formal_lambda_f_power_bookkeeping_can_be_retained_on_same_member_index_set'])
              details={'member_label_cases_checked':checked,'max_faces':8,'max_tested_multiplicity':7}

          elif g=='lambda_bookkeeping':
              # Exact-rational check of Han's identity prod_v lambda_vf^p = (prod_v lambda_vf)^p.
              cases=0
              for nv in range(2,9):
                  for pface in range(1,17):
                      for seed in range(1,17):
                          lambdas=[Fraction(1+((seed+3*v)%9),1+((2*seed+v)%7)) for v in range(nv)]
                          lhs=Fraction(1,1)
                          for lam in lambdas:
                              lhs*=lam**pface
                          face=Fraction(1,1)
                          for lam in lambdas: face*=lam
                          rhs=face**pface
                          if lhs!=rhs: raise SystemExit('lambda bookkeeping identity failed')
                          cases+=1
              ok=(cases==1792 and c['han_lambda_weights_multiply_member_amplitudes_externally'])
              details={'exact_rational_cases':cases,'vertex_counts':'2..8','multiplicities':'1..16','seeds':16}

          elif g=='composition_boundary':
              boundary=(not c['exact_identity_with_han_half_link_gluing_kernel_proven'] and
                        not c['generalized_causal_vertex_finiteness_proven'] and
                        not c['generalized_causal_vertex_normalization_proven'] and
                        not c['causal_stack_cutoff_removal_proven'] and
                        not c['causal_stack_large_cutoff_factorization_or_triangulation_independence_proven'] and
                        not c['same_realization_uv_to_regge_gr_parameter_observable_error_transport_proven'] and
                        not c['family_terminal'] and not c['d7_authorized'])
              ok=boundary
              details={
                'half_link_glue_equivalence_ready':False,
                'causal_vertex_finiteness_ready':False,
                'causal_vertex_normalization_ready':False,
                'causal_cutoff_removal_ready':False,
                'causal_large_cutoff_factorization_ready':False,
                'uv_ir_observable_transport_ready':False
              }
          else:
              raise SystemExit(2)

          out={'guard':g,'pass':bool(ok),'iteration':p['iteration'],'details':details,
               'classification_target':p['frozen_classification_target']}
          pathlib.Path(f'build/lqg-iter297/{g}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter297-${{ matrix.guard }}
          path: build/lqg-iter297/${{ matrix.guard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-iter297-*
          path: build/lqg-iter297-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          files=sorted(pathlib.Path('build/lqg-iter297-results').glob('*.json'))
          rows=[json.loads(x.read_text()) for x in files]
          if len(rows)!=4 or not all(x['pass'] for x in rows): raise SystemExit(1)
          by={x['guard']:x for x in rows}
          p=json.load(open('benchmarks/lqg_iter297_formal_causal_stack_composition.json'))
          out={
            'iteration':297,
            'independent_guards':4,
            'all_guards_pass':True,
            'classification':p['frozen_classification_target'],
            'formal_memberwise_causal_vertex_substitution_exists':True,
            'same_member_multiplicity_and_spin_index_set_retained':True,
            'external_lambda_multiplicity_bookkeeping_retained_formally':True,
            'member_index_cases':by['member_index_preservation']['details'],
            'lambda_bookkeeping_cases':by['lambda_bookkeeping']['details'],
            'exact_han_half_link_glue_equivalence_proven':False,
            'generalized_causal_vertex_finiteness_proven':False,
            'generalized_causal_vertex_normalization_proven':False,
            'causal_stack_cutoff_removal_proven':False,
            'causal_stack_large_cutoff_factorization_or_triangulation_independence_proven':False,
            'same_realization_uv_to_regge_gr_parameter_observable_error_transport_proven':False,
            'family_terminal':False,
            'd7_authorized':False,
            'guard_files':[x.name for x in files]
          }
          payload=json.dumps(out,indent=2,sort_keys=True)+'\n'
          pathlib.Path('build/lqg-iter297-summary.json').write_text(payload)
          pathlib.Path('build/lqg-iter297-summary.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-iter297-summary
          path: |
            build/lqg-iter297-summary.json
            build/lqg-iter297-summary.sha256
          if-no-files-found: error
          retention-days: 90
