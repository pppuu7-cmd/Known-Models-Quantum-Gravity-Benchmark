name: source-j1-k5-eq4-triple-contact-common-group-variable-lift

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-j1-k5-eq4-triple-contact-common-group-variable-lift.yml'
      - 'code/source_j1_k5_eq4_triple_contact_common_group_variable_lift.py'
      - 'code/source_j1_k5_eq4_triple_contact_common_group_variable_lift_aggregate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prospective freeze and source identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7620bc32ad691d37100642e8e33fd15cadd729a9 HEAD
          git merge-base --is-ancestor bb5d7b922784231b8e89d6538fea11ab8ee0a09e HEAD
          test "$(git hash-object sources/arxiv_2601_23162v1_eq4_local_collision_map_expansion_v13.json)" = fdfb13f9974ebc891cb3f490ca553dd0991d9136
          test "$(git hash-object sources/arxiv_2604_24945v1_eq4_local_collision_map_expansion_v13.json)" = c742e8cab0648b8fbaef88f09876644c6c2c3077
          grep -F 'EQ4_TRIPLE_CONTACT_COMMON_GROUP_VARIABLE_LIFT_DERIVED_SCOPED' research/prereg/SOURCE_J1_K5_EQ4_TRIPLE_CONTACT_COMMON_GROUP_VARIABLE_LIFT_GATE_2026-09-16.md
          grep -F 'EQ4_TRIPLE_CONTACT_COMMON_GROUP_VARIABLE_LIFT_RANK_FAIL_SCOPED' research/prereg/SOURCE_J1_K5_EQ4_TRIPLE_CONTACT_COMMON_GROUP_VARIABLE_LIFT_GATE_2026-09-16.md
          grep -F 'EQ4_TRIPLE_CONTACT_COMMON_GROUP_VARIABLE_LIFT_BLOCKED_SCOPED' research/prereg/SOURCE_J1_K5_EQ4_TRIPLE_CONTACT_COMMON_GROUP_VARIABLE_LIFT_GATE_2026-09-16.md
          grep -F 'INVALID_IMPLEMENTATION' research/prereg/SOURCE_J1_K5_EQ4_TRIPLE_CONTACT_COMMON_GROUP_VARIABLE_LIFT_GATE_2026-09-16.md

  lane:
    needs: source-lock
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run frozen exact common-group lift classifier
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tag=$(echo '${{ matrix.python }}' | tr -d '.')
          python code/source_j1_k5_eq4_triple_contact_common_group_variable_lift.py --authority inputs/source_j1_k5_eq4_triple_contact_common_group_variable_lift_authority.json --repo-root . --out "artifacts/lift_${tag}.json" | tee "artifacts/lift_${tag}.log"
          sha256sum "artifacts/lift_${tag}.json" "artifacts/lift_${tag}.log" > "artifacts/lift_${tag}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: common-group-lift-${{ matrix.python }}
          path: artifacts/lift_*
          if-no-files-found: error

  aggregate:
    needs: lane
    if: ${{ always() && needs.lane.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: common-group-lift-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate frozen decision
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python code/source_j1_k5_eq4_triple_contact_common_group_variable_lift_aggregate.py --a downloaded/lift_311.json --b downloaded/lift_313.json --out artifacts/lift_aggregate.json | tee artifacts/lift_aggregate.log
          sha256sum artifacts/lift_aggregate.json artifacts/lift_aggregate.log > artifacts/lift_aggregate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: common-group-lift-aggregate
          path: artifacts/lift_aggregate.*
          if-no-files-found: error
