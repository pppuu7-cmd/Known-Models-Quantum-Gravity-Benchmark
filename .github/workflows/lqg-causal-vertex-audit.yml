name: lqg-causal-vertex-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/lqg_causal_vertex_audit.py'
      - '.github/workflows/lqg-causal-vertex-audit.yml'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        label: [split, regge, scope, transport]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Run independent causal-vertex guard
        run: python code/lqg_causal_vertex_audit.py guard --label '${{ matrix.label }}' --output build/lqg-causal/${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-causal-${{ matrix.label }}
          path: build/lqg-causal/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lqg-causal-*
          path: build/lqg-causal-results
          merge-multiple: true
      - name: Aggregate after dependency barrier
        run: python code/lqg_causal_vertex_audit.py aggregate --input-dir build/lqg-causal-results --output build/lqg-causal-iter290-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lqg-causal-iter290-summary
          path: build/lqg-causal-iter290-summary.json
          if-no-files-found: error
          retention-days: 90
